# Scheduled drift watch for the documented API contract. `make check` is
# strictly offline, so nothing in the push or CI path ever compares the repo
# proto against the LIVE rendered TechDocs site; this job is that comparison.
# It scrapes the rendered pages, generates a TechDocs-derived proto, compiles
# both sides with Buf, and reports every place the two contracts disagree.
#
# It reads only. It never commits, never opens anything, and never writes into
# the checkout: run evidence goes to a runner-local directory the comparator
# refuses to place inside the repository. The run directory uploads as an
# artifact, and the medium-tier findings are the input to the proto sync
# batches (docs/parity.md, and the spec's Phase D).
#
# Findings do not fail the job today. The medium tier is not at zero yet, so a
# red run would report the same known worklist every week; --fail-on-findings
# belongs here once T-D4 proves zero medium. A scrape, parse, or compile
# failure still exits non-zero and fails the job.
#
# This replaces a comparator that ran by hand on one development host. Any
# host with Python, Buf, and network access runs the repo command directly;
# see tools/techdocs-proof/README.md.
name: techdocs-drift

on:
  schedule:
    # Thursdays 05:41 UTC; off-peak, a non-zero minute to dodge the
    # top-of-hour scheduler crunch, and a different day from sync-drift so the
    # two upstream watches do not report in the same window.
    - cron: "41 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  techdocs-drift:
    name: techdocs comparator (live-docs drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # The same provisioning script the CI job and the CI-mirror container
      # run. The comparator needs Buf, which that script installs at the
      # pinned version codegen already depends on, so this job cannot drift to
      # a different Buf than the one the repo generates with.
      - name: Install gate toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-setup.sh

      - name: techdocs comparator
        env:
          LINODEMCP_TECHDOCS_PROOF_ROOT: ${{ runner.temp }}/techdocs-proof
        run: |
          PYTHONPATH=tools/techdocs-proof/src python3 -m techdocs_proof \
            --retention-days 30 | tee "${RUNNER_TEMP}/manifest.json"

      - name: Summarize findings
        if: always()
        env:
          LINODEMCP_TECHDOCS_PROOF_ROOT: ${{ runner.temp }}/techdocs-proof
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["LINODEMCP_TECHDOCS_PROOF_ROOT"])
          latest = root / "latest.json"
          if not latest.is_file():
              print("No run manifest; the comparator did not reach a result.")
              raise SystemExit(0)
          manifest = json.loads(latest.read_text(encoding="utf-8"))
          print(f"## techdocs comparator: {manifest['status']}\n")
          summary = manifest.get("summary") or {}
          if not summary:
              print(f"error: {manifest.get('error')}")
              raise SystemExit(0)
          print(f"- routes compared: {summary['active_routes_compared']}")
          print(f"- proto tools compared: {summary['proto_tools_compared']}")
          print(f"- actionable (medium) findings: {summary['actionable_findings']}\n")
          print("| finding kind | medium |")
          print("| --- | --- |")
          medium = summary.get("finding_kinds_by_severity", {}).get("medium", {})
          for kind, count in sorted(medium.items()):
              print(f"| {kind} | {count} |")
          PY

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: techdocs-proof-run
          path: ${{ runner.temp }}/techdocs-proof/
          retention-days: 30
          if-no-files-found: warn
