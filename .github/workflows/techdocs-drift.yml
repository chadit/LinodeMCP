# Weekly comparison of proto/ against the LIVE rendered TechDocs site, which
# `make check` cannot do because it is offline. It reads only: evidence goes to
# a runner-local directory and uploads as an artifact, and the route snapshot
# refresh reports a candidate a human lands. Findings do not fail the job while
# the medium tier is above zero; a scrape, parse, or compile failure still does.
name: techdocs-drift

on:
  schedule:
    # Off-peak on a non-zero minute to dodge the top-of-hour crunch, on a
    # different day from sync-drift.
    - cron: "41 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  techdocs-drift:
    name: techdocs comparator (live-docs drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # The same provisioning script CI runs, so this job cannot drift to a
      # different Buf than the one the repo generates with.
      - name: Install gate toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-setup.sh

      - name: techdocs comparator
        env:
          LINODEMCP_TECHDOCS_PROOF_ROOT: ${{ runner.temp }}/techdocs-proof
        run: |
          PYTHONPATH=tools/techdocs-proof/src python3 -m techdocs_proof \
            --retention-days 30 | tee "${RUNNER_TEMP}/manifest.json"

      - name: Summarize findings
        if: always()
        env:
          LINODEMCP_TECHDOCS_PROOF_ROOT: ${{ runner.temp }}/techdocs-proof
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["LINODEMCP_TECHDOCS_PROOF_ROOT"])
          latest = root / "latest.json"
          if not latest.is_file():
              print("No run manifest; the comparator did not reach a result.")
              raise SystemExit(0)
          manifest = json.loads(latest.read_text(encoding="utf-8"))
          print(f"## techdocs comparator: {manifest['status']}\n")
          summary = manifest.get("summary") or {}
          if not summary:
              print(f"error: {manifest.get('error')}")
              raise SystemExit(0)
          print(f"- routes compared: {summary['active_routes_compared']}")
          print(f"- proto tools compared: {summary['proto_tools_compared']}")
          print(f"- actionable (medium) findings: {summary['actionable_findings']}\n")
          print("| finding kind | medium |")
          print("| --- | --- |")
          medium = summary.get("finding_kinds_by_severity", {}).get("medium", {})
          for kind, count in sorted(medium.items()):
              print(f"| {kind} | {count} |")
          PY

      # Refreshes docs/contracts/api-techdocs-routes-baseline.txt. It reports and
      # uploads a candidate; REQ-D5 keeps the write behind a human landing a diff.
      - name: Route snapshot refresh
        if: always()
        env:
          LINODEMCP_TECHDOCS_PROOF_ROOT: ${{ runner.temp }}/techdocs-proof
        run: |
          set -euo pipefail
          candidate="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          latest = Path(os.environ["LINODEMCP_TECHDOCS_PROOF_ROOT"]) / "latest.json"
          if not latest.is_file():
              raise SystemExit(0)
          manifest = json.loads(latest.read_text(encoding="utf-8"))
          print((manifest.get("artifacts") or {}).get("route_snapshot") or "")
          PY
          )"
          reviewed=docs/contracts/api-techdocs-routes-baseline.txt
          if [[ -z "${candidate}" || ! -f "${candidate}" ]]; then
            echo "## route snapshot: no candidate" >> "${GITHUB_STEP_SUMMARY}"
            echo "The comparator did not reach a route snapshot." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "## route snapshot refresh" >> "${GITHUB_STEP_SUMMARY}"
          # Header lines carry the harvest date; only route lines are signal.
          if diff <(grep -v '^#' "${reviewed}") <(grep -v '^#' "${candidate}") \
            > "${RUNNER_TEMP}/route-drift.diff"; then
            echo "No route drift: the reviewed snapshot still matches TechDocs." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "TechDocs moved. Copy \`route-snapshot.txt\` out of the uploaded"
            echo "run evidence over \`${reviewed}\`, review the diff, and land it."
            echo ""
            echo '```diff'
            cat "${RUNNER_TEMP}/route-drift.diff"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: techdocs-proof-run
          path: ${{ runner.temp }}/techdocs-proof/
          retention-days: 30
          if-no-files-found: warn
