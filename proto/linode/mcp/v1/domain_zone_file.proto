syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// DomainZoneFile is the rendered DNS zone file lines for a domain.
message DomainZoneFile {
  repeated string zone_file = 1;
}

// DomainZoneFileGetInput is the input contract for linode_domain_zone_file_get.
message DomainZoneFileGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_domain_zone_file_get"
    method: "GET"
    path: "/domains/{domain_id}/zone-file"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_DOMAINS_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DNS};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DomainZoneFile";
  option (linode.mcp.v1.tool_description) = "Gets the rendered zone file for a specific domain by its ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve zone file for domain {domain_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the domain whose zone file to retrieve (required).
  int32 domain_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID,
    // A derived check reports only that the id is missing and loses the reason
    // a value that was sent could not be read as one.
    (linode.mcp.v1.reader_message) = {absent: "domain_id must be a positive integer"}
  ];
}
