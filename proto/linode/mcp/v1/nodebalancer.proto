syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// Transfer is the bandwidth transfer summary attached to several resources.
message Transfer {
  double in = 1;
  double out = 2;
  double total = 3;
}

// NodeBalancer mirrors the Linode NodeBalancer object.
message NodeBalancer {
  int32 id = 1;
  string label = 2;
  string region = 3;
  string hostname = 4;
  string ipv4 = 5;
  string ipv6 = 6;
  int32 client_conn_throttle = 7;
  Transfer transfer = 8;
  repeated string tags = 9;
  string created = 10;
  string updated = 11;
}

// NodeBalancerListResponse mirrors the linode_nodebalancer_list wrapper: a
// count, an optional filter echo, and the NodeBalancers. This is the project's
// own envelope, not the Linode {data,page,pages,results} list shape.
message NodeBalancerListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated NodeBalancer nodebalancers = 3;
}

// NodeBalancerWriteResponse is the {message, nodebalancer} envelope the
// NodeBalancer create/update tools return.
message NodeBalancerWriteResponse {
  string message = 1;
  NodeBalancer nodebalancer = 2;
}

// NodeBalancerDeleteResponse is the id-echo envelope linode_nodebalancer_delete
// returns: a confirmation message plus the deleted NodeBalancer's ID. The
// delete endpoint returns an empty body, so the id echo confirms the target.
message NodeBalancerDeleteResponse {
  string message = 1;
  int32 nodebalancer_id = 2;
}

// NodeBalancerGetInput is the input contract for linode_nodebalancer_get.
message NodeBalancerGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_get"
    method: "GET"
    path: "/nodebalancers/{nodebalancer_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancer";
  option (linode.mcp.v1.tool_description) = "Gets detailed information about a specific NodeBalancer by its ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve NodeBalancer {nodebalancer_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer to retrieve (required).
  int32 nodebalancer_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// InstanceNodeBalancerListInput is the input contract for
// linode_instance_nodebalancer_list.
message InstanceNodeBalancerListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_nodebalancer_list"
    method: "GET"
    path: "/linode/instances/{linode_id}/nodebalancers"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerListResponse";
  option (linode.mcp.v1.tool_description) = "Lists NodeBalancers assigned to a Linode instance.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// NodeBalancerListInput is the input contract for linode_nodebalancer_list.
message NodeBalancerListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_list"
    method: "GET"
    path: "/nodebalancers"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerListResponse";
  option (linode.mcp.v1.tool_description) = "Lists all NodeBalancers on your account. Can filter by region or label.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter by region ID (e.g., us-east, eu-west).
  optional string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter NodeBalancers by label containing this string (case-insensitive).
  optional string label_contains = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// NodeBalancerCreateInput is the input contract for linode_nodebalancer_create.
message NodeBalancerCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_create"
    method: "POST"
    path: "/nodebalancers"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new NodeBalancer (load balancer). WARNING: Billing starts immediately. Use linode_region_list to find valid regions.";
  option (linode.mcp.v1.error_message) = "Failed to create NodeBalancer: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "NodeBalancer '{label}' (ID: {id}) created successfully in {region}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The load balancer being created. The label and the reserved address are
  // both optional, so the four wordings cover which of them the call carries.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new NodeBalancer \"{label}\" will be created in region {region}. Reserved IPv4 address {ipv4} will be assigned."
    template: "A new NodeBalancer \"{label}\" will be created in region {region}."
    template: "A new NodeBalancer will be created in region {region}. Reserved IPv4 address {ipv4} will be assigned."
    template: "A new NodeBalancer will be created in region {region}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for the NodeBalancer starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };
  option (buf.validate.message).cel = {
    id: "nodebalancer_create.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  // Dotted-quad only, which is what both hand handlers accepted: Go parsed the
  // address and held it to four octets, Python built an IPv4Address from it.
  option (buf.validate.message).cel = {
    id: "nodebalancer_create.ipv4.format"
    message: "ipv4 must be a valid IPv4 address"
    expression: "!has(this.ipv4) || this.ipv4.matches('^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$')"
  };
  option (buf.validate.message).cel = {
    id: "nodebalancer_create.firewall_id.min"
    message: "firewall_id must be an integer greater than or equal to 1"
    expression: "!has(this.firewall_id) || this.firewall_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the NodeBalancer will be created (e.g., 'us-east').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A label for the NodeBalancer (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Connections per second throttle limit (0-20). Default is 0 (no throttle).
  optional int32 client_conn_throttle = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm creation. This operation incurs billing
  // charges. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Reserved public IPv4 address to assign. When omitted, the API allocates
  // an ephemeral IPv4 address.
  optional string ipv4 = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Tags to apply to the new NodeBalancer (optional).
  repeated string tags = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Port configurations to create with the NodeBalancer, each an object with
  // the same fields linode_nodebalancer_config_create takes (optional). The
  // item shape is free-form because the API documents it only as an object.
  repeated google.protobuf.Struct configs = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // VPC configurations to attach, each an object with subnet_id and the VPC
  // address ranges (optional). The item shape is free-form because the API
  // documents it only as an object.
  repeated google.protobuf.Struct vpcs = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // ID of the Cloud Firewall to assign to the new NodeBalancer (optional).
  optional int32 firewall_id = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// NodeBalancerUpdateInput is the input contract for linode_nodebalancer_update.
message NodeBalancerUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_update"
    method: "PUT"
    path: "/nodebalancers/{nodebalancer_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates an existing NodeBalancer. Can modify label and connection throttle.";
  option (linode.mcp.v1.error_message) = "Failed to modify NodeBalancer {nodebalancer_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a NodeBalancer. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "NodeBalancer {nodebalancer_id} modified successfully";
  // The read is the NodeBalancer, whose label the request alone does not carry.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_nodebalancer_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Label changes from \"{state:label}\" to \"{label}\"."
    template: "Label is set to \"{label}\"."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_unchanged) = {
    state: "label"
    argument: "label"
  };
  // A throttle of 0 turns throttling off, which is why the line is guarded on
  // the argument being carried rather than on its value.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Connection throttle is set to {client_conn_throttle} connections per second per client IP."
    line: PREVIEW_LINE_SIDE_EFFECT
    when_present: "client_conn_throttle"
  };
  // proto3 collapses an absent int32 onto 0, so this one rule answers absent,
  // zero, and negative nodebalancer_id alike.
  option (buf.validate.message).cel = {
    id: "nodebalancer_update.nodebalancer_id.positive"
    message: "nodebalancer_id must be a positive integer"
    expression: "this.nodebalancer_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer to update.
  int32 nodebalancer_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the NodeBalancer (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New connections per second throttle limit (0-20) (optional).
  optional int32 client_conn_throttle = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm NodeBalancer update. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Complete replacement set of tags (optional). Omitting it leaves the
  // NodeBalancer's tags unchanged; an empty list removes all of them.
  repeated string tags = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// NodeBalancerDeleteInput is the input contract for linode_nodebalancer_delete.
message NodeBalancerDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_delete"
    method: "DELETE"
    path: "/nodebalancers/{nodebalancer_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a NodeBalancer. WARNING: This will remove the load balancer and all its configurations. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "NodeBalancer";
  option (linode.mcp.v1.success_message) = "NodeBalancer {nodebalancer_id} removed successfully";
  // A replay would report a NodeBalancer the first attempt already removed as
  // one that never existed.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_nodebalancer_get"
  };
  // The walk lists the configs that cascade with it.
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_nodebalancer_config_list"
    emit: {
      kind: "nodebalancer_config"
      id_field: "id"
      action: "cascade_deleted"
      note: "{protocol} config on port {port}"
    }
    warnings: {
      template: "Deleting this NodeBalancer destroys {count} config(s) and their backend node lists."
      when_any: true
    }
    list_error_warning: "Could not list NodeBalancer configs: {error}"
  };

  option (buf.validate.message).cel = {
    id: "nodebalancer_delete.nodebalancer_id.positive"
    message: "nodebalancer_id must be a positive integer"
    expression: "this.nodebalancer_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer to delete.
  int32 nodebalancer_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// NodeBalancerFirewallListInput is the input contract for
// linode_nodebalancer_firewall_list.
message NodeBalancerFirewallListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_firewall_list"
    method: "GET"
    path: "/nodebalancers/{nodebalancer_id}/firewalls"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallListResponse";
  option (linode.mcp.v1.tool_description) = "Lists Cloud Firewalls assigned to a specific NodeBalancer by its ID.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer whose Cloud Firewalls should be listed.
  int32 nodebalancer_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Page number to retrieve.
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page, from 25 through 500.
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// NodeBalancerFirewallUpdateInput is the input contract for
// linode_nodebalancer_firewall_update. firewall_ids is a required array in the
// hand-built schema; a repeated field cannot land in the generated required
// set, so it drops to optional there while the handler still enforces presence.
message NodeBalancerFirewallUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_firewall_update"
    method: "PUT"
    path: "/nodebalancers/{nodebalancer_id}/firewalls"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_NODEBALANCERS_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallListResponse";
  option (linode.mcp.v1.tool_description) = "Replaces the Cloud Firewall assignments for a specific NodeBalancer. Pass an empty firewall_ids list to remove all assignments.";
  option (linode.mcp.v1.error_message) = "Failed to update firewall assignments for NodeBalancer {nodebalancer_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This replaces firewall assignments for a NodeBalancer. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;
  // Same split as the Linode instance twin: an absent firewall_ids and the
  // empty list that removes every assignment reach a rule as one value, so the
  // presence check reads the arguments.
  //
  // The assignments the replacement overwrites are the state, envelope and
  // all, read on the page this call itself publishes.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_nodebalancer_firewall_list"
    envelope_state: true
  };

  // Entry positivity is all a rule can see of firewall_ids: a list the caller
  // omitted arrives here as the empty one, which passes vacuously.
  option (buf.validate.message).cel = {
    id: "nodebalancer_firewall_update.firewall_ids.positive"
    message: "firewall_ids entries must be positive integers"
    expression: "this.firewall_ids.all(f, f >= 1)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer whose Cloud Firewall assignments should be
  // replaced.
  int32 nodebalancer_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Complete list of firewall IDs to assign to the NodeBalancer. Use an empty
  // list to remove all firewall assignments.
  repeated int32 firewall_ids = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Must be set to true to confirm firewall assignment changes. Ignored when
  // dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
