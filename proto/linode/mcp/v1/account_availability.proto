syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// AccountAvailability reports which services are available and unavailable to the
// account in one region.
message AccountAvailability {
  repeated string available = 1;
  string region = 2;
  repeated string unavailable = 3;
}

// AccountAvailabilityListResponse is the envelope
// linode_account_availability_list returns: a count, an optional echoed filter,
// and the full proto AccountAvailability elements.
message AccountAvailabilityListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated AccountAvailability account_availabilities = 3;
}

// AccountAvailabilityGetInput is the input contract for
// linode_account_availability_get.
message AccountAvailabilityGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_availability_get"
    method: "GET"
    path: "/account/availability/{region_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountAvailability";
  option (linode.mcp.v1.tool_description) = "Gets services available and unavailable to the account in one region.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve account availability for region {region_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The region slug to inspect (required).
  string region_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_REGION_SLUG
  ];
}

// AccountAvailabilityListInput is the input contract for
// linode_account_availability_list.
message AccountAvailabilityListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_availability_list"
    method: "GET"
    path: "/account/availability"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountAvailabilityListResponse";
  option (linode.mcp.v1.tool_description) = "Lists services available and unavailable to the account in each region.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
