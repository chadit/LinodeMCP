syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// Kernel mirrors a Linode kernel.
message Kernel {
  string id = 1;
  string label = 2;
  string version = 3;
  bool kvm = 4;
  string architecture = 5;
  bool pvops = 6;
  bool deprecated = 7;
  string built = 8;
}

// KernelListResponse is the envelope linode_kernel_list returns: a count, an
// optional echoed filter, and the full proto Kernel elements.
message KernelListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Kernel kernels = 3;
}

// KernelGetInput is the input contract for linode_kernel_get.
message KernelGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_kernel_get"
    method: "GET"
    path: "/linode/kernels/{kernel_id}"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1; // system param
  // The ID of the kernel to retrieve, such as linode/latest-64bit (required).
  string kernel_id = 2;
}

// KernelListInput is the input contract for linode_kernel_list.
message KernelListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_kernel_list"
    method: "GET"
    path: "/linode/kernels"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2;
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3;
}
