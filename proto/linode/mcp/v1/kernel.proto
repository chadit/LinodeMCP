syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/options.proto";

// Kernel mirrors a Linode kernel.
message Kernel {
  string id = 1;
  string label = 2;
  string version = 3;
  bool kvm = 4;
  string architecture = 5;
  bool pvops = 6;
  bool deprecated = 7;
  string built = 8;
}

// KernelListResponse is the envelope linode_kernel_list returns: a count, an
// optional echoed filter, and the full proto Kernel elements.
message KernelListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Kernel kernels = 3;
}

// KernelGetInput is the input contract for linode_kernel_get.
message KernelGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_kernel_get"
    method: "GET"
    path: "/linode/kernels/{kernel_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.Kernel";
  option (linode.mcp.v1.tool_description) = "Gets one Linode kernel by ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve kernel: {error}";

  // One sentence covers every way the id can fail, which is what the hand
  // readers answered. Surrounding space is tolerated because they trimmed
  // before judging, and the percent sign is refused because a percent-encoded
  // separator addresses a route the caller did not spell.
  option (buf.validate.message).cel = {
    id: "kernel_get.kernel_id.identifier"
    message: "kernel_id must be a kernel identifier like linode/latest-64bit"
    expression: "this.kernel_id.matches('(?s)^\\\\s*linode/[^/]*[^/\\\\s]\\\\s*$') && !this.kernel_id.contains('?') && !this.kernel_id.contains('#') && !this.kernel_id.contains('..') && !this.kernel_id.contains('%')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the kernel to retrieve, such as linode/latest-64bit (required).
  string kernel_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_FREE_TEXT,
    (linode.mcp.v1.reader_message) = {
      absent: "kernel_id must be a kernel identifier like linode/latest-64bit"
      unusable: "kernel_id must be a kernel identifier like linode/latest-64bit"
    }
  ];
}

// KernelListInput is the input contract for linode_kernel_list.
message KernelListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_kernel_list"
    method: "GET"
    path: "/linode/kernels"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.KernelListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available Linode kernels with optional pagination.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
