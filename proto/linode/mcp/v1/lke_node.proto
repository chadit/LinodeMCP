syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// LKENode mirrors one node within an LKE cluster node pool.
message LKENode {
  string id = 1;
  int32 instance_id = 2;
  string status = 3;
}

// LKENodeDeleteResponse is the id-echo envelope linode_lke_node_delete returns:
// a confirmation message plus the parent cluster ID and the deleted node ID. The
// node ID is a string. The delete endpoint returns an empty body, so the echo
// confirms the target.
message LKENodeDeleteResponse {
  string message = 1;
  int32 cluster_id = 2;
  string node_id = 3;
}

// LKENodeRecycleResponse is the id-echo envelope linode_lke_node_recycle
// returns: a confirmation message plus the parent cluster ID and the recycled
// node ID (a string). The recycle endpoint returns an empty body.
message LKENodeRecycleResponse {
  string message = 1;
  int32 cluster_id = 2;
  string node_id = 3;
}

// LKENodeGetInput is the input contract for linode_lke_node_get.
message LKENodeGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_node_get"
    method: "GET"
    path: "/lke/clusters/{cluster_id}/nodes/{node_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LKE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_LKE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKENode";
  option (linode.mcp.v1.tool_description) = "Retrieves details of a specific node within an LKE cluster";
  option (linode.mcp.v1.error_message) = "Failed to retrieve node '{node_id}' for cluster {cluster_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster (required).
  int32 cluster_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // The ID of the node to retrieve (required).
  string node_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// LKENodeDeleteInput is the input contract for linode_lke_node_delete.
message LKENodeDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_node_delete"
    method: "DELETE"
    path: "/lke/clusters/{cluster_id}/nodes/{node_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LKE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_LKE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKENodeDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a specific node from an LKE cluster. The node will be removed and may be replaced depending on pool settings. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This deletes the specified node. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Node {node_id} deleted from cluster {cluster_id} successfully";
  option (linode.mcp.v1.resource_type) = "LKENode";
  // A replay would report a node the first attempt already removed as one the
  // cluster never had.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_node_get"
  };
  // The walk names the backing Linode the delete destroys, which the fetched
  // node carries; the pool-level sentence goes out even for an unbacked node.
  option (linode.mcp.v1.dependency_walk) = {
    state_scalar: "instance_id"
    emit: {
      kind: "instance"
      id_field: "instance_id"
      label_field: "id"
      action: "cascade_deleted"
      note: "Backing Linode for this node."
    }
    warnings: {
      template: "Deleting this node removes it from its pool; the pool node count drops by one and scheduled workloads reschedule."
    }
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the node to delete (string format).
  string node_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm node deletion. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKENodeRecycleInput is the input contract for linode_lke_node_recycle.
message LKENodeRecycleInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_node_recycle"
    method: "POST"
    path: "/lke/clusters/{cluster_id}/nodes/{node_id}/recycle"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LKE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_LKE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKENodeRecycleResponse";
  option (linode.mcp.v1.tool_description) = "Recycles a specific node in an LKE cluster. The node will be drained and replaced with a new one. Pass dry_run=true to preview without recycling.";
  option (linode.mcp.v1.confirm_message) = "This recycles the specified node, replacing it with a new one. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Node {node_id} in cluster {cluster_id} recycle initiated successfully";
  // A replay drains and replaces the node a second time, so the replacement the
  // first attempt brought up is torn down again.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_node_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the node to recycle (string format).
  string node_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm node recycling. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
