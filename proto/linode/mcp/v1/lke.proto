syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/common.proto";
import "linode/mcp/v1/options.proto";

// LKEControlPlane is the control-plane configuration nested in an LKE cluster.
message LKEControlPlane {
  bool high_availability = 1;
}

// LKECluster mirrors the Linode Kubernetes Engine cluster object.
message LKECluster {
  int32 id = 1;
  string label = 2;
  string region = 3;
  string k8s_version = 4;
  string status = 5;
  repeated string tags = 6;
  string created = 7;
  string updated = 8;
  LKEControlPlane control_plane = 9;
}

// LKEClusterListResponse is the envelope linode_lke_cluster_list returns: a
// count, an optional echoed filter, and the full proto LKECluster elements.
message LKEClusterListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated LKECluster clusters = 3;
}

// LKEClusterWriteResponse is the {message, cluster} envelope the LKE cluster
// create/update tools return.
message LKEClusterWriteResponse {
  string message = 1;
  LKECluster cluster = 2;
}

// LKEClusterDeleteResponse is the id-echo envelope linode_lke_cluster_delete
// returns: a confirmation message plus the deleted cluster's ID. The delete
// endpoint returns an empty body, so the id echo confirms the target.
message LKEClusterDeleteResponse {
  string message = 1;
  int32 cluster_id = 2;
}

// LKEClusterActionResponse is the id-echo envelope the cluster-scoped POST
// actions linode_lke_cluster_recycle and linode_lke_cluster_regenerate return: a
// confirmation message plus the cluster ID the action ran against. The action
// endpoints return an empty body.
message LKEClusterActionResponse {
  string message = 1;
  int32 cluster_id = 2;
}

// LKEClusterGetInput is the input contract for linode_lke_cluster_get.
message LKEClusterGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_get"
    method: "GET"
    path: "/lke/clusters/{cluster_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKECluster";
  option (linode.mcp.v1.tool_description) = "Retrieves details of a single LKE cluster by its ID";
  option (linode.mcp.v1.error_message) = "Failed to retrieve LKE cluster: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster to retrieve (required).
  int32 cluster_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// LKEClusterListInput is the input contract for linode_lke_cluster_list.
message LKEClusterListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_list"
    method: "GET"
    path: "/lke/clusters"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterListResponse";
  option (linode.mcp.v1.tool_description) = "Lists all Linode Kubernetes Engine (LKE) clusters. Can filter by label.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter clusters by label containing this string (case-insensitive).
  optional string label = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY,
    (linode.mcp.v1.list_filter) = {match: MATCH_CONTAINS}
  ];
}

// LKENodePoolCreateItem is one node-pool definition in the node_pools array of
// linode_lke_cluster_create. It mirrors the fields the create handler reads from
// each pool object (linode.CreateLKEClusterNodePool): type and count are the
// required pair, autoscaler is a small open object, and tags is an optional
// string list. autoscaler stays a map so the generator emits a plain object
// without pinning its inner shape.
message LKENodePoolCreateItem {
  // Linode type for the pool's nodes (e.g. g6-standard-2).
  string type = 1;
  // Number of nodes in the pool (minimum 1).
  int32 count = 2;
  // Autoscaler settings, e.g. {"enabled": true, "min": 1, "max": 5} (optional).
  map<string, google.protobuf.Value> autoscaler = 3;
  // Tags to apply to the node pool (optional).
  repeated string tags = 4;
}

// LKEClusterCreateInput is the input contract for linode_lke_cluster_create.
// node_pools is a required array in the hand-built schema, but a repeated
// message field never lands in the generated required set, so node_pools drops
// out of required (recorded in the required-flag-loss log); the rule below is
// what refuses a call that sends none.
message LKEClusterCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_create"
    method: "POST"
    path: "/lke/clusters"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new LKE Kubernetes cluster. WARNING: This creates billable resources. Use linode_lke_version_list to find valid k8s_version values, linode_region_list for regions, and linode_lke_type_list for node types. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.error_message) = "Failed to create LKE cluster: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates billable Kubernetes resources. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "LKE cluster '{label}' (ID: {id}) created in {region} with Kubernetes {k8s_version}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The cluster that would be created and the billing that starts with it.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new LKE cluster \"{label}\" will be created in region {region} running Kubernetes {k8s_version}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for the cluster's node pools starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.k8s_version.required"
    message: "k8s_version is required"
    expression: "this.k8s_version.matches('[^ \\t\\r\\n]')"
  };
  // A list carries no presence bit, so its size is what says one was sent.
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.node_pools.required"
    message: "node_pools must contain at least one node pool"
    expression: "size(this.node_pools) > 0"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.tier.known"
    message: "tier must be one of: standard, enterprise"
    expression: "!has(this.tier) || this.tier != 0"
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.vpc_id.min"
    message: "vpc_id must be an integer greater than or equal to 1"
    expression: "!has(this.vpc_id) || this.vpc_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.subnet_id.min"
    message: "subnet_id must be an integer greater than or equal to 1"
    expression: "!has(this.subnet_id) || this.subnet_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "lke_cluster_create.stack_type.known"
    message: "stack_type must be one of: ipv4, ipv4-ipv6"
    expression: "!has(this.stack_type) || this.stack_type in ['ipv4','ipv4-ipv6']"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the cluster (3-32 characters).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region for the cluster (e.g. us-east).
  string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Kubernetes version (e.g. 1.29). Use linode_lke_version_list to find valid
  // values.
  string k8s_version = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Array of node pool objects: [{"type": "g6-standard-2", "count": 3}]. Each
  // pool may also carry an autoscaler object and tags.
  repeated LKENodePoolCreateItem node_pools = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Tags to apply to the cluster (optional).
  repeated string tags = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Control plane settings, e.g. {"high_availability": true} (optional, HA
  // incurs additional cost).
  map<string, google.protobuf.Value> control_plane = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm cluster creation. This creates billable resources.
  // Ignored when dry_run=true.
  bool confirm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Service tier for the cluster: standard or enterprise (optional). Without it
  // the API creates a standard cluster, so an enterprise cluster cannot be
  // created at all unless this is sent.
  optional LKETier.Value tier = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether to install the Akamai App Platform on the cluster (optional).
  optional bool apl_enabled = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Networking stack for the cluster's nodes: "ipv4" or "ipv4-ipv6" (optional,
  // defaults to ipv4). This stays a plain string rather than an enum wrapper
  // because proto enum value names are identifiers and cannot carry the hyphen
  // in ipv4-ipv6, so an enum would advertise a value the API rejects.
  optional string stack_type = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // ID of the VPC to place the cluster's nodes in (optional).
  optional int32 vpc_id = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // ID of the VPC subnet to place the cluster's nodes in (optional, requires
  // vpc_id).
  optional int32 subnet_id = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// LKEClusterUpdateInput is the input contract for linode_lke_cluster_update.
message LKEClusterUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_update"
    method: "PUT"
    path: "/lke/clusters/{cluster_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates an existing LKE cluster's label, Kubernetes version, tags, or high availability setting. Pass dry_run=true to preview without modifying.";
  option (linode.mcp.v1.error_message) = "Failed to modify LKE cluster {cluster_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This modifies the LKE cluster configuration. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "LKE cluster {cluster_id} modified successfully";
  // The preview reads the cluster so the label and Kubernetes version a change
  // starts from can be named; the request carries only the new values.
  option (linode.mcp.v1.tool_hooks) = "preview";
  // proto3 collapses an absent int32 onto 0, so this one rule answers absent,
  // zero, and negative cluster_id alike.
  option (buf.validate.message).cel = {
    id: "lke_cluster_update.cluster_id.positive"
    message: "cluster_id must be a positive integer"
    expression: "this.cluster_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster to update.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the cluster (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New Kubernetes version (optional). Use linode_lke_version_list to find
  // valid values.
  optional string k8s_version = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Tags to apply to the cluster (optional, replaces existing tags).
  repeated string tags = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Control plane settings, e.g. {"high_availability": true} (optional).
  map<string, google.protobuf.Value> control_plane = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm cluster update. Ignored when dry_run=true.
  bool confirm = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKEClusterDeleteInput is the input contract for linode_lke_cluster_delete.
message LKEClusterDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_delete"
    method: "DELETE"
    path: "/lke/clusters/{cluster_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes an LKE cluster. WARNING: This is irreversible. All node pools, nodes, and associated resources will be deleted. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This is irreversible. All node pools, nodes, and associated resources will be deleted. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "LKE cluster {cluster_id} removed successfully";
  option (linode.mcp.v1.resource_type) = "LKECluster";
  // A replay would report a cluster the first attempt already removed as one
  // that never existed.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_cluster_get"
  };
  // The walk lists the cluster's node pools to count the nodes the delete
  // destroys, which is an extra call no descriptor describes.
  option (linode.mcp.v1.tool_hooks) = "dependency_walk";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster to delete.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm deletion. This action is irreversible. Ignored
  // when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKEClusterRecycleInput is the input contract for linode_lke_cluster_recycle.
message LKEClusterRecycleInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_recycle"
    method: "POST"
    path: "/lke/clusters/{cluster_id}/recycle"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterActionResponse";
  option (linode.mcp.v1.tool_description) = "Recycles all nodes in an LKE cluster. WARNING: This causes temporary disruption as all nodes are replaced. Pass dry_run=true to preview without recycling.";
  option (linode.mcp.v1.confirm_message) = "Recycles all nodes in the cluster. This causes temporary disruption. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "LKE cluster {cluster_id} recycle initiated successfully";
  // A replay starts a second rollout over nodes the first one is still
  // replacing, doubling the disruption the caller accepted once.
  option (linode.mcp.v1.retry_disabled) = true;
  // No resource_type: it feeds only the two-stage drift hash, and this recycle
  // advertises no mode/plan_id, so it declares nothing the 20 other single-step
  // destroys do not.
  // The read is the cluster, never a credential the recycle might rotate.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_cluster_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster to recycle.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm recycling. This causes temporary disruption.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKEClusterRegenerateInput is the input contract for
// linode_lke_cluster_regenerate.
message LKEClusterRegenerateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_cluster_regenerate"
    method: "POST"
    path: "/lke/clusters/{cluster_id}/regenerate"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEClusterActionResponse";
  option (linode.mcp.v1.tool_description) = "Regenerates the service token for an LKE cluster. Existing tokens will stop working. Pass dry_run=true to preview without regenerating.";
  option (linode.mcp.v1.confirm_message) = "This regenerates the cluster service token. Existing tokens will stop working. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Service token for LKE cluster {cluster_id} regenerated successfully";
  // The server mints the replacement token, so a replay invalidates the one the
  // first attempt returned, matching the service token delete this rotates with.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the cluster rather than either credential, so a preview
  // reports cluster metadata without exposing what the call rotates.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_cluster_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm token regeneration. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Regenerate the cluster's kubeconfig (optional, defaults to false).
  optional bool kubeconfig = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Regenerate the cluster's service token (optional, defaults to false).
  optional bool servicetoken = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// LKEServiceTokenDeleteInput is the input contract for
// linode_lke_service_token_delete.
message LKEServiceTokenDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_service_token_delete"
    method: "DELETE"
    path: "/lke/clusters/{cluster_id}/servicetoken"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEServiceTokenDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes and regenerates the service token for an LKE cluster. Existing tokens will stop working. Pass dry_run=true to preview without regenerating. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This deletes the service token. Existing tokens will stop working. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Service token for LKE cluster {cluster_id} deleted and regenerated successfully";
  option (linode.mcp.v1.resource_type) = "LKEServiceToken";
  // A replayed delete would rotate the token a second time and invalidate the
  // one the first attempt handed back, so this route is never retried.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the cluster rather than the token, so a preview and a plan
  // report cluster metadata without exposing the credential itself.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_cluster_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm service token deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKEControlPlaneACLAddresses holds the IPv4 and IPv6 CIDRs allowed to reach an
// LKE cluster's Kubernetes API server. Both lists are emitted (as []).
message LKEControlPlaneACLAddresses {
  repeated string ipv4 = 1;
  repeated string ipv6 = 2;
}

// LKEControlPlaneACL mirrors the control-plane ACL for an LKE cluster: whether
// the ACL is enforced and the allowed address lists.
message LKEControlPlaneACL {
  bool enabled = 1;
  LKEControlPlaneACLAddresses addresses = 2;
}

// LKEACLWriteResponse is the {message, acl} envelope the linode_lke_acl_update
// tool returns: a confirmation string plus the full control-plane ACL element.
// The Linode API wraps the ACL under a top-level "acl" key; the handler keeps
// that acl object whole so the output round-trips through this message.
message LKEACLWriteResponse {
  string message = 1;
  LKEControlPlaneACL acl = 2;
}

// LKEServiceTokenDeleteResponse is the id-echo envelope
