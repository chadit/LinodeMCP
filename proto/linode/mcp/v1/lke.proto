message LKEServiceTokenDeleteResponse {
  string message = 1;
  int32 cluster_id = 2;
}

// LKEACLDeleteResponse is the id-echo envelope linode_lke_acl_delete returns: a
// confirmation message plus the cluster ID whose control-plane ACL was removed.
// The delete endpoint returns an empty body, so the id echo confirms the target.
message LKEACLDeleteResponse {
  string message = 1;
  int32 cluster_id = 2;
}

// LKEACLGetInput is the input contract for linode_lke_acl_get.
message LKEACLGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_acl_get"
    method: "GET"
    path: "/lke/clusters/{cluster_id}/control_plane_acl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEControlPlaneACL";
  option (linode.mcp.v1.tool_description) = "Retrieves the control plane ACL configuration for an LKE cluster";
  option (linode.mcp.v1.error_message) = "Failed to retrieve control plane ACL for cluster {cluster_id}: {error}";
  // proto3 collapses an absent int32 onto 0, so this one rule answers absent,
  // zero, and negative cluster_id alike.
  option (buf.validate.message).cel = {
    id: "lke_acl_get.cluster_id.positive"
    message: "cluster_id must be a positive integer"
    expression: "this.cluster_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster (required).
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// LKEACLUpdateInput is the input contract for linode_lke_acl_update. acl is a
// required nested object in the hand-built schema ({"enabled": bool,
// "addresses": {"ipv4": [...], "ipv6": [...]}}), but a map field never lands in
// the generated required set, so acl drops out of required (recorded in the
// required-flag-loss log); the handler still requires it at runtime.
message LKEACLUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_acl_update"
    method: "PUT"
    path: "/lke/clusters/{cluster_id}/control_plane_acl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEACLWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates the control plane ACL for an LKE cluster. Controls which IP addresses can access the cluster's API server. Pass dry_run=true to preview without modifying.";
  option (linode.mcp.v1.error_message) = "Failed to modify control plane ACL for cluster {cluster_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This modifies the control plane ACL, which controls API server access. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Control plane ACL for cluster {cluster_id} modified successfully";
  // The PUT replaces the whole address list rather than merging into it, so a
  // replay reapplies a set someone else may have changed since the first call.
  option (linode.mcp.v1.retry_disabled) = true;
  // The preview reads the current ACL so a caller sees what they are replacing.
  // The API wraps it under a top-level acl key, the way the delete beside this
  // reads it.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_acl_get"
    body_key: "acl"
  };
  // An absent enabled leaves the gate as it stands, so it is neither an open
  // nor a close and the third arm says only that the list changed.
  option (linode.mcp.v1.preview_sentence) = {
    chosen_by: {
      argument: "acl.enabled"
      when_true: "The control-plane ACL is enabled; only the listed addresses may reach the Kubernetes API."
      when_false: "The control-plane ACL is disabled; the Kubernetes API becomes reachable from any address."
      when_absent: "The cluster control-plane ACL address list is updated."
    }
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // proto3 collapses an absent int32 onto 0, so this one rule answers absent,
  // zero, and negative cluster_id alike.
  option (buf.validate.message).cel = {
    id: "lke_acl_update.cluster_id.positive"
    message: "cluster_id must be a positive integer"
    expression: "this.cluster_id >= 1"
  };
  // An empty acl object sends nothing, so it is rejected alongside an absent one.
  option (buf.validate.message).cel = {
    id: "lke_acl_update.acl.required"
    message: "acl is required and must be an object"
    expression: "size(this.acl) > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Control plane ACL object: {"enabled": true, "addresses": {"ipv4":
  // ["10.0.0.1/32"], "ipv6": ["..."]}}.
  map<string, google.protobuf.Value> acl = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm ACL update. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// LKEACLDeleteInput is the input contract for linode_lke_acl_delete. Note: no
// mode/plan_id; this destroy is not on the two-stage flow per the dump.
message LKEACLDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_acl_delete"
    method: "DELETE"
    path: "/lke/clusters/{cluster_id}/control_plane_acl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEACLDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes the control plane ACL for an LKE cluster. This removes all IP restrictions from the API server. Pass dry_run=true to preview without deleting.";
  option (linode.mcp.v1.error_message) = "Failed to remove control plane ACL for cluster {cluster_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This removes all IP restrictions from the API server. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Control plane ACL for cluster {cluster_id} removed successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_acl_get"
    body_key: "acl"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm ACL deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
