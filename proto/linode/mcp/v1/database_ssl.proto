syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// DatabaseSSL is the SSL CA certificate of a Managed Database instance.
message DatabaseSSL {
  string ca_certificate = 1;
}

// DatabaseMySQLInstanceSSLGetInput is the input contract for
// linode_database_mysql_instance_ssl_get.
message DatabaseMySQLInstanceSSLGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_mysql_instance_ssl_get"
    method: "GET"
    path: "/databases/mysql/instances/{instance_id}/ssl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseSSL";
  option (linode.mcp.v1.tool_description) = "Retrieves the SSL CA certificate for a MySQL Managed Database instance by ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve MySQL Managed Database SSL certificate: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The MySQL Managed Database instance ID (required).
  int32 instance_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// DatabasePostgreSQLInstanceSSLGetInput is the input contract for
// linode_database_postgresql_instance_ssl_get.
message DatabasePostgreSQLInstanceSSLGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_postgresql_instance_ssl_get"
    method: "GET"
    path: "/databases/postgresql/instances/{instance_id}/ssl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseSSL";
  option (linode.mcp.v1.tool_description) = "Retrieves the SSL CA certificate for a PostgreSQL Managed Database instance by ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve PostgreSQL Managed Database SSL certificate: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The PostgreSQL Managed Database instance ID (required).
  int32 instance_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}
