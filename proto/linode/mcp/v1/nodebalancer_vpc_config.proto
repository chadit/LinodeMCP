syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// NodeBalancerVPCConfig mirrors one VPC configuration attached to a NodeBalancer.
// The range/vpc id fields are nullable (omitted when unset).
message NodeBalancerVPCConfig {
  int32 id = 1;
  optional int32 vpc_id = 2;
  int32 subnet_id = 3;
  string ipv4_range = 4;
  string ipv6_range = 5;
  optional int32 ipv4_range_id = 6;
  optional int32 ipv6_range_id = 7;
  optional bool ipv4_range_auto_assign = 8;
  int32 nodebalancer_id = 9;
}

// NodeBalancerVPCConfigListResponse mirrors the
// linode_nodebalancer_vpc_config_list wrapper: a count, an optional filter echo,
// and the VPC configs. This is the project's own envelope, not the Linode
// {data,page,pages,results} list shape.
message NodeBalancerVPCConfigListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated NodeBalancerVPCConfig vpc_configs = 3;
}

// NodeBalancerVPCConfigGetInput is the input contract for
// linode_nodebalancer_vpc_config_get.
message NodeBalancerVPCConfigGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_vpc_config_get"
    method: "GET"
    path: "/nodebalancers/{nodebalancer_id}/vpcs/{vpc_config_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerVPCConfig";
  option (linode.mcp.v1.tool_description) = "Gets a VPC configuration for a specific NodeBalancer by IDs.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve VPC configuration {vpc_config_id} for NodeBalancer {nodebalancer_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer (required).
  int32 nodebalancer_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // The ID of the VPC configuration to retrieve (required).
  int32 vpc_config_id = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// NodeBalancerVPCConfigListInput is the input contract for
// linode_nodebalancer_vpc_config_list.
message NodeBalancerVPCConfigListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_vpc_config_list"
    method: "GET"
    path: "/nodebalancers/{nodebalancer_id}/vpcs"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerVPCConfigListResponse";
  option (linode.mcp.v1.tool_description) = "Lists VPC configurations for a specific NodeBalancer by its ID.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer whose VPC configurations should be listed.
  int32 nodebalancer_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Page number to retrieve.
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page, from 25 through 500.
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
