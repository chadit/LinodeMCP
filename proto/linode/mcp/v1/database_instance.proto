// DatabaseMySQLInstanceCredentialsResetInput is the input contract for
// linode_database_mysql_instance_credentials_reset.
message DatabaseMySQLInstanceCredentialsResetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_mysql_instance_credentials_reset"
    method: "POST"
    path: "/databases/mysql/instances/{instance_id}/credentials/reset"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_DATABASES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DATABASES};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseInstanceActionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Resets credentials for a MySQL Managed Database instance by ID. Pass dry_run=true to preview without resetting.";
  option (linode.mcp.v1.error_message) = "Failed to reset MySQL Managed Database credentials: {error}";
  option (linode.mcp.v1.confirm_message) = "This resets Managed Database credentials. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "MySQL Managed Database credentials reset";
  // A replay rotates the password a second time, so the credentials the first
  // reset handed out stop working.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the instance the rotation lands on.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_database_mysql_instance_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "MySQL Managed Database instance {instance_id} credentials will be reset."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Resetting credentials can disrupt clients using the old credentials."
    line: PREVIEW_LINE_WARNING
  };
  // The id addresses the instance in the path, and a caller who sends a
  // non-positive one is told so rather than being sent to a route that cannot
  // exist.
  option (buf.validate.message).cel = {
    id: "database_mysql_instance_credentials_reset.instance_id.positive"
    message: "instance_id must be a positive integer"
    expression: "this.instance_id > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The MySQL Managed Database instance ID whose credentials to reset.
  int32 instance_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm resetting database credentials. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

