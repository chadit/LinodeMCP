// DatabaseMySQLInstanceDeleteInput is the input contract for
// linode_database_mysql_instance_delete.
message DatabaseMySQLInstanceDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_mysql_instance_delete"
    method: "DELETE"
    path: "/databases/mysql/instances/{instance_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_DATABASES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DATABASES};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseInstanceDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a MySQL Managed Database instance. WARNING: This is irreversible. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This deletes a Managed Database instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "DatabaseInstance";
  option (linode.mcp.v1.success_message) = "Managed Database instance {instance_id} deleted";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the instance a delete removes.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_database_mysql_instance_get"
  };

  option (buf.validate.message).cel = {
    id: "database_mysql_instance_delete.instance_id.positive"
    message: "instance_id must be a positive integer"
    expression: "this.instance_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The MySQL Managed Database instance ID to delete.
  int32 instance_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm database deletion. This action is irreversible.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

