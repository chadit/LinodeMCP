syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/options.proto";

// AccountBetaProgram is one beta program the account is enrolled in. description
// and ended are nullable (omitted when unset).
message AccountBetaProgram {
  optional string description = 1;
  optional string ended = 2;
  string enrolled = 3;
  string id = 4;
  string label = 5;
  string started = 6;
}

// AccountBetaProgramListResponse is the {count, filter?, account_betas}
// envelope the linode_account_beta_list tool returns.
message AccountBetaProgramListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated AccountBetaProgram account_betas = 3;
}

// AccountBetaGetInput is the input contract for linode_account_beta_get.
message AccountBetaGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_beta_get"
    method: "GET"
    path: "/account/betas/{beta_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountBetaProgram";
  option (linode.mcp.v1.tool_description) = "Gets one beta program that the account is enrolled in.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve account beta program {beta_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Beta program ID to retrieve (required).
  string beta_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_BETA_SLUG
  ];
}

// AccountBetaListInput is the input contract for linode_account_beta_list.
message AccountBetaListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_beta_list"
    method: "GET"
    path: "/account/betas"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountBetaProgramListResponse";
  option (linode.mcp.v1.tool_description) = "Lists beta programs that the account is enrolled in.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// AccountBetaEnrollInput is the input contract for linode_account_beta_enroll.
// The hand-built param is named id (string beta program slug), so the field
// keeps that name.
message AccountBetaEnrollInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_beta_enroll"
    method: "POST"
    path: "/account/betas"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountBetaEnrollResponse";
  option (linode.mcp.v1.tool_description) = "Enrolls the account in a beta program.";
  option (linode.mcp.v1.error_message) = "Failed to enroll the account in a beta program: {error}";
  option (linode.mcp.v1.confirm_message) = "This enrolls the account in a beta program. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Account beta enrollment requested successfully";
  // The id travels in the path of every later beta call, so the charset is
  // held here rather than left to the API to reject.
  option (buf.validate.message).cel = {
    id: "account_beta_enroll.id.required"
    message: "id is required"
    expression: "this.id != ''"
  };
  option (buf.validate.message).cel = {
    id: "account_beta_enroll.id.charset"
    message: "id must contain only letters, numbers, underscores, and hyphens"
    expression: "this.id.matches('^[a-zA-Z0-9_-]+$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Unique identifier for the beta program (required).
  string id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm beta program enrollment. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
