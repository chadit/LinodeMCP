  option (linode.mcp.v1.success_message) = "Profile phone number deleted successfully";
  // Neither language retried this DELETE; a replay would report a number the
  // caller had just removed as one the profile never had.
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Must be true to confirm deleting the profile phone number. Ignored when
  // dry_run=true.
  bool confirm = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfilePhoneNumberVerifyInput is the input contract for
// linode_profile_phone_number_verify.
message ProfilePhoneNumberVerifyInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_phone_number_verify"
    method: "POST"
    path: "/profile/phone-number/verify"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MessageResponse";
  option (linode.mcp.v1.tool_description) = "Verifies a profile phone number with a one-time SMS code.";
  option (linode.mcp.v1.error_message) = "Failed to verify profile phone number: {error}";
  option (linode.mcp.v1.confirm_message) = "This verifies a profile phone number. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile phone number verified successfully";
  // Neither language retried this POST; the code is single-use, so a replay
  // reports the caller's own first attempt back to them as a bad code.
  option (linode.mcp.v1.retry_disabled) = true;
  // The code is trimmed before anything reads it, which Python has always
  // sent trimmed.
  option (linode.mcp.v1.normalize_fields) = {
    field: "otp_code"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // Where the verified number lands, which the code alone does not say.
  option (linode.mcp.v1.preview_sentence) = {
    template: "The phone number is verified and added to the profile."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "profile_phone_number_verify.otp_code.non_blank"
    message: "otp_code must be a non-empty string"
    expression: "this.otp_code.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // One-time SMS code sent to the profile phone number. The preview redacts it:
  // it authenticates the number, so it does not belong in an echoed request.
  string otp_code = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // Must be true to confirm verifying the phone number. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// SecurityQuestionListInput is the input contract for
// linode_profile_security_question_list (pairs with
// SecurityQuestionListResponse; the endpoint is not paginated).
message SecurityQuestionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_security_question_list"
    method: "GET"
    path: "/profile/security-questions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SecurityQuestionListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available profile security questions for the authenticated profile";
  option (linode.mcp.v1.list_envelope) = {
    shape: SHAPE_KEYED
    member: "security_questions"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// SecurityQuestionAnswerItem is one {question_id, response} answer in the
// security_questions array of linode_profile_security_question_answer. Both
// members are required: an answer naming no question, or a question with no
// answer, is not something the API can store.
message SecurityQuestionAnswerItem {
  // The security question being answered.
  int32 question_id = 1;
  // The answer text, between 3 and 17 characters.
  string response = 2;
}

// SecurityQuestionAnswerInput is the input contract for
// linode_profile_security_question_answer. security_questions is a required
// array of {question_id, response} objects; a repeated field cannot be marked
// required in the generated schema, so the required flag is dropped and the
// count rule below is what refuses a call that sends none.
message SecurityQuestionAnswerInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_security_question_answer"
    method: "POST"
    path: "/profile/security-questions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MessageResponse";
  option (linode.mcp.v1.tool_description) = "Answers security questions for the authenticated profile. Pass dry_run=true to preview without submitting.";
  option (linode.mcp.v1.error_message) = "Failed to answer profile security questions: {error}";
  option (linode.mcp.v1.confirm_message) = "This submits profile security question answers. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile security questions answered successfully";
  // Neither language retried this POST; a replay would answer the questions a
  // second time with material the caller only meant to send once.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.preview_sentence) = {
    template: "The profile's security question answers are saved."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The answers are security material and the question ids are what a caller
  // checks before confirming, so the report stands in for one member of each
  // entry rather than for the whole argument.
  option (linode.mcp.v1.preview_stand_in) = {
    argument: "security_questions"
    member: "response"
    text: "[redacted]"
  };

  // Ordered: the count is checked before the items, because a caller who sent
  // the wrong number of answers has not yet been asked about any one of them.
  option (buf.validate.message).cel = {
    id: "profile_security_question_answer.security_questions.count"
    message: "security_questions must contain exactly 3 answers"
    expression: "size(this.security_questions) == 3"
  };
  option (buf.validate.message).cel = {
    id: "profile_security_question_answer.question_id.positive"
    message: "question_id must be a positive integer"
    expression: "this.security_questions.all(answer, answer.question_id >= 1)"
  };
  // Counted rather than compared through unique(): the two runtimes evaluate
  // the same rule text through different CEL engines, and all/filter/size are
  // what both are already proven on.
  option (buf.validate.message).cel = {
    id: "profile_security_question_answer.question_id.unique"
    message: "question_id values must be unique"
    expression: "this.security_questions.all(answer, size(this.security_questions.filter(other, other.question_id == answer.question_id)) == 1)"
  };
  option (buf.validate.message).cel = {
    id: "profile_security_question_answer.response.length"
    message: "response length must be between 3 and 17 characters"
    expression: "this.security_questions.all(answer, size(answer.response) >= 3 && size(answer.response) <= 17)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The security question answers to submit. Required at runtime, though the
  // generated schema cannot mark a repeated field required.
  repeated SecurityQuestionAnswerItem security_questions = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm answering security questions. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
