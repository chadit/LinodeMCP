message ProfileTokenDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_token_delete"
    method: "DELETE"
    path: "/profile/tokens/{token_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileTokenIDResponse";
