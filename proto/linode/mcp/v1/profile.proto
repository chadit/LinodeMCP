}

// ProfileTokenCreateInput is the input contract for linode_profile_token_create.
message ProfileTokenCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_token_create"
    method: "POST"
    path: "/profile/tokens"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileTokenCreateResponse";
  option (linode.mcp.v1.confirm_message) = "This creates a personal access token. Set confirm=true to proceed.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Token expiry timestamp (optional).
  optional string expiry = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Token label (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Token scopes string (optional).
  optional string scopes = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm personal access token creation. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileTokenUpdateInput is the input contract for linode_profile_token_update.
message ProfileTokenUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_token_update"
    method: "PUT"
    path: "/profile/tokens/{token_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.PersonalAccessTokenWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This updates a personal access token. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile token updated successfully";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Personal access token ID.
  int32 token_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Token label. The label is the only field a token update can change.
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm updating a personal access token. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileTokenDeleteInput is the input contract for linode_profile_token_delete
