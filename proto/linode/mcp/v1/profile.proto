    tool: "linode_profile_tfa_enable_confirm"
    method: "POST"
    path: "/profile/tfa-enable-confirm"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileTfaEnableConfirmResponse";
  option (linode.mcp.v1.tool_description) = "Confirms two-factor authentication enablement for the authenticated profile with a TFA code.";
  option (linode.mcp.v1.error_message) = "Failed to confirm profile two-factor authentication: {error}";
  option (linode.mcp.v1.confirm_message) = "This enables two-factor authentication for the profile. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile two-factor authentication enabled successfully";
  // The account-recovery code and its expiry come back in the answer and no
  // argument carries either, so the envelope is what the body decodes into.
  option (linode.mcp.v1.response_body_fields) = "scratch";
  option (linode.mcp.v1.response_body_fields) = "expiry";
  // Neither language retried this POST; the code is single-use, so a replay
  // reports the caller's own first attempt back to them as a bad code.
  option (linode.mcp.v1.retry_disabled) = true;
  // The code is trimmed before anything reads it, which Python has always
  // sent trimmed.
  option (linode.mcp.v1.normalize_fields) = {
    field: "tfa_code"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // What confirming the secret turns on, which the request body does not say.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Two-factor authentication is enabled for this profile."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "profile_tfa_enable_confirm.tfa_code.non_blank"
    message: "tfa_code must be a non-empty string"
    expression: "this.tfa_code.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-factor authentication code to confirm enablement. The preview redacts
  // it: it authenticates the caller, so it does not belong in an echoed request.
  string tfa_code = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // Must be true to confirm enabling profile two-factor authentication.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

