syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// ProfileReferrals is the referral standing the profile reports: the caller's
// own referral code and link plus the counts credited against it.
message ProfileReferrals {
  string code = 1;
  int32 completed = 2;
  int32 credit = 3;
  int32 pending = 4;
  int32 total = 5;
  string url = 6;
}

// Profile mirrors the authenticated user's Linode profile.
//
// scopes is not in the reviewed spec snapshot but the API sends it for a
// personal access token, so it stays. authorized_keys and verified_phone_number
// arrive as JSON null when unset.
message Profile {
  string username = 1;
  string email = 2;
  string timezone = 3;
  int32 uid = 4;
  bool email_notifications = 5;
  bool restricted = 6;
  bool two_factor_auth = 7;
  string scopes = 8;
  string authentication_type = 9;
  repeated string authorized_keys = 10;
  bool ip_whitelist_enabled = 11;
  string lish_auth_method = 12;
  ProfileReferrals referrals = 13;
  string verified_phone_number = 14;
}

// ProfileGetInput is the input contract for linode_profile_get (the singular
// authenticated profile, so no resource ID).
message ProfileGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_get"
    method: "GET"
    path: "/profile"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_CORE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.Profile";
  option (linode.mcp.v1.tool_description) = "Retrieves Linode user account profile information";
  option (linode.mcp.v1.error_message) = "Failed to retrieve the profile: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileLishAuthMethod is how the caller may authenticate to the Linode Shell.
// See the enum-wrapper convention in nodebalancer_config.proto.
message ProfileLishAuthMethod {
  enum Value {
    unspecified = 0;
    password_keys = 1;
    keys_only = 2;
    disabled = 3;
  }
}

// ProfileWriteResponse is the linode_profile_update envelope: a confirmation
// message plus the profile the API returned.
message ProfileWriteResponse {
  string message = 1;
  Profile profile = 2;
}

// ProfileUpdateInput is the input contract for linode_profile_update. The route
// changes the members it is given and leaves the rest, so every body field is
// optional and a call naming none is refused rather than sent.
//
// ip_whitelist_enabled is deliberately absent. The spec marks it deprecated and
// one-way: it can no longer be enabled, so a caller who disables it through this
// tool could never undo it.
message ProfileUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_update"
    method: "PUT"
    path: "/profile"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates the authenticated user's own profile: email, timezone, notification and Lish settings, and the account restriction and two-factor flags. Requires confirm=true. Pass dry_run=true to preview without updating.";
  option (linode.mcp.v1.confirm_message) = "This changes your own Linode profile. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile updated";
  option (linode.mcp.v1.error_message) = "Failed to update profile: {error}";

  // An empty authorized_keys counts as absent here: CEL cannot tell one from a
  // list the caller never sent, and clearing the keys is what lish_auth_method
  // disabled is for.
  option (buf.validate.message).cel = {
    id: "profile_update.any"
    message: "at least one update field is required: email, timezone, email_notifications, authorized_keys, lish_auth_method, restricted, or two_factor_auth"
    expression: "has(this.email) || has(this.timezone) || has(this.email_notifications) || size(this.authorized_keys) > 0 || has(this.lish_auth_method) || has(this.restricted) || has(this.two_factor_auth)"
  };
  // A string naming no member of the enum is set to its zero and marked
  // present, which is what separates a wrong value from an absent one.
  option (buf.validate.message).cel = {
    id: "profile_update.lish_auth_method.known"
    message: "lish_auth_method must be one of: password_keys, keys_only, disabled"
    expression: "!has(this.lish_auth_method) || this.lish_auth_method != 0"
  };
  // Only blankness is checked: the API is the authority on what address it
  // accepts, and a blank one is the mistake worth catching before the call.
  option (buf.validate.message).cel = {
    id: "profile_update.email.present"
    message: "email must not be blank"
    expression: "!has(this.email) || this.email.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "profile_update.authorized_keys.entries"
    message: "authorized_keys entries must not be blank"
    expression: "this.authorized_keys.all(k, k.matches('[^ \\t\\r\\n]'))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // New contact address for Akamai Cloud Computing communication (optional).
  optional string email = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Time zone clients such as Cloud Manager display assets in (optional). The
  // API itself still answers in UTC.
  optional string timezone = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Receive email about account activity (optional). Business-critical mail
  // still arrives when this is false.
  optional bool email_notifications = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Complete replacement set of SSH keys for Lish access (optional). Ignored
  // when lish_auth_method is disabled.
  repeated string authorized_keys = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // How Lish authenticates (optional). keys_only is the most secure if Lish is
  // in use; disabled turns Lish off.
  optional ProfileLishAuthMethod.Value lish_auth_method = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Restrict what this user can reach on the account (optional). Their access
  // is then whatever their grants allow.
  optional bool restricted = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Require two-factor authentication from an untrusted computer (optional).
  // Turning this on also needs the two-factor secret to be created.
  optional bool two_factor_auth = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm changing your own profile. Ignored when
  // dry_run=true.
  bool confirm = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileGrantsGetInput is the input contract for linode_profile_grants_get
// (the authenticated user's own grants, so no username in the path). It answers
// with AccountUserGrants, the message the account-user grants tool already
// returns, because /profile/grants is the same object addressed as "me" instead
// of by username, and modeling it twice would be two spellings of one API shape.
message ProfileGrantsGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_grants_get"
    method: "GET"
    path: "/profile/grants"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountUserGrants";
  option (linode.mcp.v1.tool_description) = "Gets the grants and account permissions for the authenticated user's profile.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve profile grants: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileApp mirrors one OAuth app authorization on the profile.
message ProfileApp {
  int32 id = 1;
  string label = 2;
  string scopes = 3;
  string website = 4;
}

// ProfileAppListResponse is the linode_profile_app_list envelope: count and the
// full proto ProfileApp elements. Pagination does not echo a filter.
message ProfileAppListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ProfileApp profile_apps = 3;
}

// ProfileAppGetInput is the input contract for linode_profile_app_get.
message ProfileAppGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_app_get"
    method: "GET"
    path: "/profile/apps/{app_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileApp";
  option (linode.mcp.v1.tool_description) = "Gets one OAuth app authorization from the profile.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve authorized app {app_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the authorized app to retrieve (required).
  int32 app_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_BOUNDED_ID
  ];
}

// TrustedDevice mirrors one trusted device on the authenticated profile
// (GET /profile/devices). expiry is nullable: the Linode API returns null for a
// device whose trust window does not expire, so it is optional and omitted then.
message TrustedDevice {
  int32 id = 1;
  string created = 2;
  optional string expiry = 3;
  string last_authenticated = 4;
  string last_remote_addr = 5;
  string user_agent = 6;
}

// TrustedDeviceListResponse is the linode_profile_device_list envelope: count
// and the full proto TrustedDevice elements. Pagination does not echo a filter.
message TrustedDeviceListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated TrustedDevice profile_devices = 3;
}

// PersonalAccessToken mirrors one personal access token's METADATA on the
// authenticated profile (GET /profile/tokens). The list response carries no
// token secret: the full token value is returned only once at creation, so no
// secret field is modeled here and any token value the API returns is dropped.
// expiry is nullable (a non-expiring token returns null), so it is optional.
message PersonalAccessToken {
  int32 id = 1;
  string label = 2;
  string scopes = 3;
  string created = 4;
  optional string expiry = 5;
}

// PersonalAccessTokenListResponse is the linode_profile_token_list envelope:
// count and the full proto PersonalAccessToken metadata elements. Pagination
// does not echo a filter.
message PersonalAccessTokenListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated PersonalAccessToken profile_tokens = 3;
}

// PersonalAccessTokenWriteResponse is the {message, token} envelope the token
// update tool returns: a confirmation string plus the full PersonalAccessToken
// metadata element (no secret, an update never returns the token value).
message PersonalAccessTokenWriteResponse {
  string message = 1;
  PersonalAccessToken token = 2;
}

// CreatedPersonalAccessToken is the response from creating a personal access
// token. Unlike the metadata PersonalAccessToken element, it carries the
// one-time secret token value the user needs to authenticate API calls. The
// secret is returned to the user by design; it is not output-redacted. expiry is
// nullable (a non-expiring token returns null), so it is optional.
message CreatedPersonalAccessToken {
  int32 id = 1;
  string label = 2;
  string scopes = 3;
  string created = 4;
  optional string expiry = 5;
  string token = 6;
}

// ProfileTokenCreateResponse is the {warning, token} envelope the token create
// tool returns. The warning reminds the user the token secret carried on token
// is shown only once.
message ProfileTokenCreateResponse {
  string warning = 1;
  CreatedPersonalAccessToken token = 2;
}

// ProfileTfaEnableResponse is the {secret, expiry, warning} envelope the TFA
// enable tool returns: the one-time two-factor secret plus its provisioning
// expiry. The secret is returned to the user by design (it must be confirmed to
// activate two-factor auth); it is not output-redacted. The warning reminds the
// user to save the secret before confirming.
message ProfileTfaEnableResponse {
  string secret = 1;
  string expiry = 2;
  string warning = 3;
}

// ProfileTokenIDResponse is the {message, token_id} id-echo the token delete
// (revoke) tool returns; the revoke endpoint returns no resource body to echo.
message ProfileTokenIDResponse {
  string message = 1;
  int32 token_id = 2;
}

// ProfileAppIDResponse is the {message, app_id} id-echo the app delete tool
// returns; the revoke endpoint returns no resource body to echo.
message ProfileAppIDResponse {
  string message = 1;
  int32 app_id = 2;
}

// ProfileDeviceIDResponse is the {message, device_id} id-echo the device revoke
// tool returns; the revoke endpoint returns no resource body to echo.
message ProfileDeviceIDResponse {
  string message = 1;
  int32 device_id = 2;
}

// SecurityQuestion mirrors one security question on the authenticated profile
// (GET /profile/security-questions). response holds the saved answer text and is
// nullable: the API returns null for a question the user has not answered yet,
// so it is optional and omitted then.
message SecurityQuestion {
  int32 id = 1;
  string question = 2;
  optional string response = 3;
}

// SecurityQuestionListResponse is the linode_profile_security_question_list
// envelope: count and the full proto SecurityQuestion elements. The endpoint is
// not paginated and applies no filter.
message SecurityQuestionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated SecurityQuestion security_questions = 3;
}

// ProfilePreferencesUpdateResponse is the {message, preferences} envelope the
// preferences update tool returns. Preferences are per-OAuth-client, free-form
// key/value data (the API round-trips whatever the caller stores), so
// preferences is a google.protobuf.Struct rather than a fixed schema.
message ProfilePreferencesUpdateResponse {
  string message = 1;
  google.protobuf.Struct preferences = 2;
}

// ProfileTfaEnableConfirmResponse is the {message, scratch, expiry} envelope the
// TFA enable-confirm tool returns. scratch is the one-time backup code the API
// hands back on confirmation; it is returned to the user by design (it is the
// account-recovery code) and is not output-redacted. expiry is echoed when the
// API includes it.
message ProfileTfaEnableConfirmResponse {
  string message = 1;
  string scratch = 2;
  string expiry = 3;
}

// ProfilePreferencesGetInput is the input contract for
// linode_profile_preferences_get (singular preferences object, no resource ID).
message ProfilePreferencesGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_preferences_get"
    method: "GET"
    path: "/profile/preferences"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_description) = "Retrieves Linode user preference settings";
  option (linode.mcp.v1.error_message) = "Failed to retrieve profile preferences: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfilePreferencesUpdateInput is the input contract for
// linode_profile_preferences_update. preferences is a free-form key/value object
// the API round-trips, so it maps to a google.protobuf.Value map. It is required
// at runtime but a map field cannot be marked required in the generated schema,
// so the required flag is dropped (body_root enforces presence).
message ProfilePreferencesUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_preferences_update"
    method: "PUT"
    path: "/profile/preferences"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfilePreferencesUpdateResponse";
  option (linode.mcp.v1.tool_description) = "Updates dashboard preferences for the authenticated profile. The call replaces the stored preferences with the ones supplied rather than merging them.";
  option (linode.mcp.v1.confirm_message) = "This updates profile preferences. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile preferences updated successfully";
  option (linode.mcp.v1.error_message) = "Failed to update profile preferences: {error}";
  // The route replaces the stored preferences rather than merging them, so a
  // replay reapplies a blob someone else may have changed since the first call.
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Free-form user preferences to store. The route reads them at the root of
  // the request body rather than under a member of it, unlike the firewall
  // settings PUT whose map does nest.
  map<string, google.protobuf.Value> preferences = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_root) = true
  ];
  // Must be true to confirm updating profile preferences. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileAppListInput is the input contract for linode_profile_app_list.
message ProfileAppListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_app_list"
    method: "GET"
    path: "/profile/apps"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileAppListResponse";
  option (linode.mcp.v1.tool_description) = "Lists OAuth app authorizations for the authenticated profile.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ProfileAppDeleteInput is the input contract for linode_profile_app_delete.
message ProfileAppDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_app_delete"
    method: "DELETE"
    path: "/profile/apps/{app_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ProfileAppIDResponse";
  option (linode.mcp.v1.tool_description) = "Revokes OAuth app access from the authenticated profile.";
  option (linode.mcp.v1.error_message) = "Failed to revoke profile app: {error}";
  option (linode.mcp.v1.confirm_message) = "This revokes OAuth app access. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile app {app_id} revoked successfully";
  // Neither language retried this DELETE, and a replay would report a revoke
  // that already happened as a missing app.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the authorization the revoke ends, which is the whole answer
  // either language gave.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_profile_app_get"
  };

  option (buf.validate.message).cel = {
    id: "profile_app_delete.app_id.positive"
    message: "app_id must be a positive integer"
    expression: "this.app_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Profile authorized app ID to revoke.
  int32 app_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm revoking OAuth app access. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ProfileDeviceListInput is the input contract for linode_profile_device_list.
message ProfileDeviceListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_device_list"
    method: "GET"
    path: "/profile/devices"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.TrustedDeviceListResponse";
  option (linode.mcp.v1.tool_description) = "Lists trusted devices for the authenticated profile.";
  option (linode.mcp.v1.list_envelope) = {shape: SHAPE_REQUIRED_DATA};

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ProfileDeviceGetInput is the input contract for linode_profile_device_get.
message ProfileDeviceGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_device_get"
    method: "GET"
    path: "/profile/devices/{device_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.TrustedDevice";
  option (linode.mcp.v1.tool_description) = "Gets one trusted device from the profile.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve trusted device {device_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Profile trusted device ID.
  int32 device_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_BOUNDED_ID
  ];
}

// ProfileDeviceRevokeInput is the input contract for
// linode_profile_device_revoke.
message ProfileDeviceRevokeInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_device_revoke"
    method: "DELETE"
