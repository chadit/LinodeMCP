// ProfileTokenUpdateInput is the input contract for linode_profile_token_update.
message ProfileTokenUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_profile_token_update"
    method: "PUT"
    path: "/profile/tokens/{token_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.PersonalAccessTokenWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates a personal access token for the authenticated profile.";
  option (linode.mcp.v1.error_message) = "Failed to update profile token: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a personal access token. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Profile token updated successfully";
  // Go's hand path sent this PUT through no retry wrapper, so declaring the
  // retry off keeps the two clients answering a transport failure the same way.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the token whose label the update replaces. A call naming no
  // label reads the second wording, which names none either.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_profile_token_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "The personal access token's label is set to \"{label}\"."
    template: "The personal access token is updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The rules run in the order written, so a call breaking more than one hears
  // the id first: an unusable id makes the label question moot.
  option (buf.validate.message).cel = {
    id: "profile_token_update.token_id.positive"
    message: "token_id must be a positive integer"
    expression: "this.token_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "profile_token_update.label.required"
    message: "label is required"
    expression: "has(this.label)"
  };
  option (buf.validate.message).cel = {
    id: "profile_token_update.label.non_blank"
    message: "label must be a non-empty string"
    expression: "!has(this.label) || this.label.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Personal access token ID.
  int32 token_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Token label. The label is the only field a token update can change.
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm updating a personal access token. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

