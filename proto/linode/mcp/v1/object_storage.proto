  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuotaUsage";
  option (linode.mcp.v1.tool_description) = "Gets usage for a single Object Storage global quota by quota ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Object Storage global quota usage {obj_global_quota_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
