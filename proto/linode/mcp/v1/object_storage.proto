  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucketWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new Object Storage bucket. WARNING: Billing starts immediately.";
  option (linode.mcp.v1.error_message) = "Failed to create bucket: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Bucket '{label}' created successfully in {region}";
  // The bucket a create would add, and the billing that starts with it.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new Object Storage bucket \"{label}\" will be created in {region}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for Object Storage starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };

  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.label.min"
    message: "bucket label must be at least 3 characters"
    expression: "size(this.label) >= 3"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.label.max"
    message: "bucket label must not exceed 63 characters"
    expression: "size(this.label) <= 63"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.label.xn_prefix"
    message: "bucket label must not use the 'xn--' prefix (reserved for internationalized domain names)"
    expression: "!this.label.startsWith('xn--')"
  };
  // The charset also answers the two rules that used to follow it: an
  // IP-formatted label needs dots or colons, and a label passing this one
  // already starts and ends alphanumeric.
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.label.charset"
    message: "bucket label must contain only lowercase letters, numbers, and hyphens"
    expression: "this.label.matches('^[a-z0-9][a-z0-9-]*[a-z0-9]$')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.acl.known"
    message: "acl must be one of: private, public-read, authenticated-read, public-read-write"
    expression: "!has(this.acl) || this.acl in ['private', 'public-read', 'authenticated-read', 'public-read-write']"
  };
  // An endpoint_type naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "object_storage_bucket_create.endpoint_type.known"
    message: "endpoint_type must be one of: E0, E1, E2, E3"
    expression: "!has(this.endpoint_type) || this.endpoint_type != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Bucket label (3-63 chars, lowercase alphanumeric and hyphens, must
  // start/end with alphanumeric).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Object Storage region for the bucket (e.g. us-east-1).
  string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Access control: private, public-read, authenticated-read, or
  // public-read-write (default: private).
  optional string acl = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether to enable CORS on the bucket (default: true).
  optional bool cors_enabled = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm bucket creation. This operation incurs
  // billing charges. Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Endpoint generation to place the bucket on: E0, E1, E2, or E3 (optional).
  // Omitting it lets the API pick the region's default generation.
  optional ObjectStorageEndpointType.Value endpoint_type = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A specific S3 endpoint hostname to place the bucket on (optional).
  optional string s3_endpoint = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

