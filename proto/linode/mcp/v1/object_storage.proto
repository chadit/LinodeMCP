  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Object Storage global quota ID to retrieve usage for.
  string obj_global_quota_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageTransfer is the linode_object_storage_transfer_get response: the
// current month's outbound bytes. used is int64 (a month of egress easily exceeds
// int32) and emits as a JSON number on both languages.
message ObjectStorageTransfer {
  int64 used = 1;
}

// ObjectStorageTransferGetInput is the input contract for
// linode_object_storage_transfer_get.
message ObjectStorageTransferGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_transfer_get"
    method: "GET"
    path: "/object-storage/transfer"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageTransfer";
  option (linode.mcp.v1.tool_description) = "Gets Object Storage outbound data transfer usage for the current month";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Object Storage transfer usage: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// PresignedURLResponse is the linode_object_storage_presigned_url_create response:
// just the generated URL. The tool is capability Read despite the create verb.
message PresignedURLResponse {
  string url = 1;
}

// PresignedURLCreateInput is the input contract for
// linode_object_storage_presigned_url_create, pairing with
// PresignedURLResponse. region, label, name, and method are required. The tool
// is capability Read despite the create verb, so it has no confirm/dry_run.
message PresignedURLCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_presigned_url_create"
    method: "POST"
    path: "/object-storage/buckets/{region}/{label}/object-url"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.PresignedURLResponse";
  option (linode.mcp.v1.tool_description) = "Generates a presigned URL for accessing an object in Object Storage. Use method=GET to create a download URL, method=PUT to create an upload URL.";
  option (linode.mcp.v1.error_message) = "Failed to generate presigned URL for '{name}' in bucket '{label}': {error}";
  // The method arrives in whatever case the caller typed it, so it is folded to
  // the canonical S3 verb before the enum rule below reads it.
  option (linode.mcp.v1.normalize_fields) = {
    field: "method"
    transform: NORMALIZE_TRANSFORM_UPPERCASE
  };

  option (buf.validate.message).cel = {
    id: "object_storage_presigned_url_create.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_presigned_url_create.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_presigned_url_create.name.required"
    message: "name (object key) is required"
    expression: "this.name.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_presigned_url_create.method.known"
    message: "method must be one of: GET, PUT"
    expression: "this.method != 0"
  };
  // The rejection names the value it read, which is the one sentence in the
  // contract a static message cannot carry: a CEL rule answering a string
  // reports that string instead of its declared one.
  option (buf.validate.message).cel = {
    id: "object_storage_presigned_url_create.expires_in.range"
    expression: "(!has(this.expires_in) || (this.expires_in >= 1 && this.expires_in <= 604800)) ? '' : string('expires_in must be between 1 and 604800 seconds (7 days), got ' + string(this.expires_in))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g., 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The object key (path/filename within the bucket).
  string name = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // HTTP method: 'GET' for download URL, 'PUT' for upload URL.
  PresignedURLMethod.Value method = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // URL expiration in seconds (1-604800, default 3600 = 1 hour).
  optional int32 expires_in = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Content-Type the signed request must carry, for a PUT upload URL
  // (optional). The signature covers it, so an upload that sends a different
  // Content-Type is rejected.
  optional string content_type = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// ObjectStorageObject is one object (or common prefix) inside a bucket, as
// returned by the S3-style object-list endpoint. size is int64 so objects larger
// than 2GB survive without truncation; it emits as a JSON number on both
// languages. is_prefix marks a delimiter-grouped common prefix rather than a
// real object.
message ObjectStorageObject {
  string name = 1;
  string etag = 2;
  string last_modified = 3;
  string owner = 4;
  int64 size = 5;
  bool is_prefix = 6;
}

// ObjectStorageObjectListResponse is the linode_object_storage_bucket_object_list
// envelope. Unlike the standard {count, filter, repeated} list shape it carries
// the S3 pagination metadata the endpoint returns: is_truncated signals more
// pages, and next_marker is the cursor to resume from (omitted when the page is
// not truncated). filter echoes the applied prefix/delimiter.
message ObjectStorageObjectListResponse {
  int32 count = 1;
  optional string filter = 2;
  bool is_truncated = 3;
  optional string next_marker = 4;
  repeated ObjectStorageObject objects = 5;
}

// ObjectStorageObjectUploadResponse is the linode_object_storage_object_upload
// answer. label and name echo the call; the rest are LOCAL because the transfer
// produced them and no Linode body carries them.
//
// There is no content hash member beside etag. For a single PUT the endpoint's
// ETag IS the stored object's MD5, so a caller verifies by hashing their own
// file and comparing it against etag, which checks the round trip end to end
// rather than repeating the server's own arithmetic back at it. Above the
// single-part ceiling that stops being true, which is what upload_mode is for:
// it answers "single" for every Tier A upload, and a later multipart mode is
// the signal that a composite ETag is not a content hash.
message ObjectStorageObjectUploadResponse {
  string message = 1;
  string label = 2;
  string name = 3;
  // Bytes the transfer sent, counted off the stream rather than from a stat, so
  // a file that changed size mid-read reports what actually reached the bucket.
  int64 size_bytes = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL];
  // The entity tag the bucket stored the object under, quotes stripped. Empty
  // when the endpoint sent none, which leaves the object stored but unverifiable
  // rather than failed.
  string etag = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL];
  // "single" for every Tier A upload. Multipart is not implemented yet, so a
  // file over the ceiling is refused rather than answered with another mode.
  string upload_mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL];
}

// ObjectStorageObjectDownloadResponse is the linode_object_storage_object_download
// answer. label and name echo the call; the rest are LOCAL because the transfer
// produced them and no Linode body carries them.
//
// dest_path is deliberately not echoed. The tool writes the file at exactly the
// path it was given, so reporting it back would restate the caller's own
// argument rather than tell them anything the call decided.
//
// The same reasoning as the upload's answer: etag is whatever the endpoint sent
// back, reported as it arrived rather than checked here, so a caller who wants
// verification hashes the file that landed and compares it themselves.
message ObjectStorageObjectDownloadResponse {
  string message = 1;
  string label = 2;
  string name = 3;
  // Bytes written to the destination, counted off the stream rather than from
  // the Content-Length header, so a truncated transfer reports what landed.
  int64 size_bytes = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL];
  // The entity tag the object was stored under, quotes stripped. Empty when the
  // endpoint sent none.
  string etag = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL];
}

// ObjectStorageObjectDownloadInput is the input contract for
// linode_object_storage_object_download. region, label, name, and dest_path are
// required.
//
// The declared route is the presigned-URL create, for the reason the upload
// gives: asking for a URL is the one Linode operation this tool performs, and
// following that URL is not a route the client builds. Capability is Read
// because nothing on Linode changes; the local file it writes is guarded by
// overwrite defaulting to false rather than by a confirm gate, since a confirm
// prompt would announce a Linode mutation that never happens.
message ObjectStorageObjectDownloadInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_object_download"
    method: "POST"
    path: "/object-storage/buckets/{region}/{label}/object-url"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageObjectDownloadResponse";
  option (linode.mcp.v1.tool_description) = "Downloads an object from an Object Storage bucket to a local file. Takes a filesystem path on the machine running the server, streams the object to it, and reports the byte count and stored ETag.";
  option (linode.mcp.v1.error_message) = "Failed to download '{name}' from bucket '{label}': {error}";
  option (linode.mcp.v1.success_message) = "Object '{name}' downloaded from bucket '{label}'";
  // The transfer consumes the response body as it writes it, so a replay after
  // a timeout would resume against a stream the first attempt already drained.
  option (linode.mcp.v1.retry_disabled) = true;
  // The caller does not choose the verb: this tool only ever signs a GET.
  option (linode.mcp.v1.body_constant) = {
    key: "method"
    text: "GET"
  };
  // The destination path is trimmed before anything reads it, so a path of
  // spaces answers "dest_path is required" rather than reaching the
  // absolute-path rule.
  option (linode.mcp.v1.normalize_fields) = {
    field: "dest_path"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The declared POST mints the URL; the transfer that follows it is the GET
  // streamed to the destination, which no route builds.
  option (linode.mcp.v1.execute_transport) = {
    presign {
      direction: TRANSFER_DIRECTION_DOWN
      url_field: "url"
      local_path_argument: "dest_path"
      overwrite_argument: "overwrite"
      size_field: "size_bytes"
      etag_field: "etag"
    }
  };

  option (buf.validate.message).cel = {
    id: "object_storage_object_download.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_download.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_download.name.required"
    message: "name (object key) is required"
    expression: "this.name.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_download.dest_path.required"
    message: "dest_path is required"
    expression: "this.dest_path.matches('[^ \\t\\r\\n]')"
  };
  // Absoluteness is decided by the path text rather than by the host the server
  // runs on, the same reason the upload's source path gives.
  option (buf.validate.message).cel = {
    id: "object_storage_object_download.dest_path.absolute"
    message: "dest_path must be a local, absolute path"
    expression: "this.dest_path.startsWith('/') || this.dest_path.matches('^[A-Za-z]:')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_download.expires_in.range"
    message: "expires_in must be between 1 and 604800 seconds (7 days)"
    expression: "!has(this.expires_in) || (this.expires_in >= 1 && this.expires_in <= 604800)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g. 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The object key to fetch.
  string name = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Absolute path to write the object to. The bytes are streamed to it; the
  // path itself reaches no request, which is why it declares no request
  // location.
  string dest_path = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_TOOL];
  // Replace a file already at dest_path. Default false, which is what stands in
  // for a confirm gate on a tool that changes nothing on Linode.
  optional bool overwrite = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_TOOL];
  // Lifetime of the presigned URL in seconds (1-604800). Defaults to the
  // configured budget, which has to outlast the transfer it authorizes.
  optional int32 expires_in = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// ObjectStorageObjectUploadInput is the input contract for
// linode_object_storage_object_upload. region, label, name, and source_path are
// required.
//
// The declared route is the presigned-URL create, because that is the one
// Linode operation this tool calls: it asks for a URL and then PUTs the file to
// the URL the API handed back. Following a URL is not a route the client builds,
// which is why nothing here declares an S3 path and why no Object Storage key is
// ever minted. The transfer itself is the declared transport's.
message ObjectStorageObjectUploadInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_object_upload"
    method: "POST"
    path: "/object-storage/buckets/{region}/{label}/object-url"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageObjectUploadResponse";
  option (linode.mcp.v1.tool_description) = "Uploads a local file to an Object Storage bucket. Takes a filesystem path on the machine running the server, streams it to a presigned URL, and reports the byte count and stored ETag.";
  option (linode.mcp.v1.error_message) = "Failed to upload '{name}' to bucket '{label}': {error}";
  option (linode.mcp.v1.confirm_message) = "This uploads a local file to Object Storage, replacing any object already stored under that key. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Object '{name}' uploaded to bucket '{label}'";
  // The transfer consumes the file as it sends it, so a replay after a timeout
  // would re-read a stream the first attempt already drained.
  option (linode.mcp.v1.retry_disabled) = true;
  // The caller does not choose the verb: this tool only ever signs a PUT.
  // Declaring it as an argument would advertise a choice it does not have.
  option (linode.mcp.v1.body_constant) = {
    key: "method"
    text: "PUT"
  };
  // The source path is trimmed before anything reads it, so a path of spaces
  // answers "source_path is required" rather than reaching the absolute-path
  // rule.
  option (linode.mcp.v1.normalize_fields) = {
    field: "source_path"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The dry run sizes the source the transport would send, so a file the
  // single-part ceiling refuses is named in the preview rather than on the
  // live call. The size the wording reads is the one measurement a preview
  // takes without moving a byte.
  option (linode.mcp.v1.preview_sentence) = {
    template: "{transport:size_bytes} bytes will be uploaded to '{name}' in bucket '{label}' as a single part."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The declared POST mints the URL; the transfer that follows it is the PUT of
  // the file itself, which no route builds.
  option (linode.mcp.v1.execute_transport) = {
    presign {
      direction: TRANSFER_DIRECTION_UP
      url_field: "url"
      local_path_argument: "source_path"
      content_type_argument: "content_type"
      size_field: "size_bytes"
      etag_field: "etag"
      answer_constant {
        field: "upload_mode"
        text: "single"
      }
    }
  };

  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.name.required"
    message: "name (object key) is required"
    expression: "this.name.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.source_path.required"
    message: "source_path is required"
    expression: "this.source_path.matches('[^ \\t\\r\\n]')"
  };
  // Absoluteness is decided by the path text rather than by the host the server
  // runs on, the reason the support-ticket attachment gives: asking the OS made
  // the same call legal on one platform and refused on another.
  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.source_path.absolute"
    message: "source_path must be a local, absolute path"
    expression: "this.source_path.startsWith('/') || this.source_path.matches('^[A-Za-z]:')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_object_upload.expires_in.range"
    message: "expires_in must be between 1 and 604800 seconds (7 days)"
    expression: "!has(this.expires_in) || (this.expires_in >= 1 && this.expires_in <= 604800)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g. 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The object key the file is stored under.
  string name = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Absolute path to the local file to upload. Its contents are streamed to the
  // presigned URL; the path itself reaches no request, which is why it declares
  // no request location.
  string source_path = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_TOOL];
  // Content-Type the stored object carries (optional, defaults to
  // application/octet-stream). The default is filled in before the URL is
  // signed, not at PUT time: the signature covers this header, so a PUT sending
  // a type the presign request never named is refused by the endpoint.
  optional string content_type = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Lifetime of the presigned URL in seconds (1-604800). Defaults to the
  // configured budget, which has to outlast the transfer it authorizes.
  optional int32 expires_in = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm the upload. Ignored when dry_run=true.
  bool confirm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and the
  // local file it would send. Default false.
  optional bool dry_run = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
