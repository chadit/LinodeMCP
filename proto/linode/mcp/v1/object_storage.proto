syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// ObjectStorageKeyPermission is the per-bucket grant level for an Object Storage
// access key. Values are the exact lowercase Linode API strings, authored from
// the live OpenAPI spec. See the enum-wrapper convention in
// nodebalancer_config.proto. The key create/update tools carry bucket_access as
// a JSON-array string, so no input field is this enum's type; the handlers
// validate each parsed entry's permissions against this generated value set.
message ObjectStorageKeyPermission {
  enum Value {
    unspecified = 0;
    read_only = 1;
    read_write = 2;
  }
}

// ObjectStorageEndpointType is the Object Storage endpoint generation a bucket
// is created on. E0 is the legacy endpoint; E1 through E3 are the newer
// generations with different performance and feature sets. Values are the exact
// Linode API wire strings. See the enum-wrapper convention in
// nodebalancer_config.proto.
message ObjectStorageEndpointType {
  enum Value {
    unspecified = 0;
    E0 = 1;
    E1 = 2;
    E2 = 3;
    E3 = 4;
  }
}

// PresignedURLMethod is the HTTP method the presigned-URL create tool signs for:
// GET produces a download URL, PUT an upload URL. This is a tool-level S3
// presign choice (not a Linode API field), so the value set is authored here.
// See the enum-wrapper convention in nodebalancer_config.proto.
message PresignedURLMethod {
  enum Value {
    unspecified = 0;
    GET = 1;
    PUT = 2;
  }
}

// ObjectStorageKeyBucketAccess is a per-bucket grant nested in an Object Storage
// key. permissions stays a string on this response message (the read side never
// rejects an unknown API value); the write-side validation is enum-backed.
message ObjectStorageKeyBucketAccess {
  string bucket_name = 1;
  string region = 2;
  string permissions = 3;
}

// ObjectStorageKeyRegion is a per-region entry nested in an Object Storage key.
message ObjectStorageKeyRegion {
  string id = 1;
  string s3_endpoint = 2;
}

// ObjectStorageKey mirrors a Linode Object Storage key. bucket_access and regions
// are repeated (emitted as []).
message ObjectStorageKey {
  string label = 1;
  string access_key = 2;
  string secret_key = 3;
  repeated ObjectStorageKeyBucketAccess bucket_access = 4;
  repeated ObjectStorageKeyRegion regions = 5;
  int32 id = 6;
  bool limited = 7;
}

// ObjectStorageKeyListResponse is the linode_object_storage_key_list envelope:
// count and the full proto ObjectStorageKey elements. The list endpoint returns
// keys without secret material, so each element's secret_key serializes as its
// empty default. The tool has no filter params, so filter is omitted.
message ObjectStorageKeyListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ObjectStorageKey keys = 3;
}

// ObjectStorageKeyWriteResponse is the {message, key} envelope the Object Storage
// key create tool returns. warning carries the secret-shown-once notice on create.
message ObjectStorageKeyWriteResponse {
  string message = 1;
  ObjectStorageKey key = 2;
  string warning = 3;
}

// ObjectStorageKeyDeleteResponse is the id-echo envelope
// linode_object_storage_key_delete returns: a confirmation message plus the
// revoked key's ID. The delete endpoint returns an empty body, so the id echo
// confirms the target.
message ObjectStorageKeyDeleteResponse {
  string message = 1;
  int32 key_id = 2;
}

// ObjectStorageKeyGetInput is the input contract for linode_object_storage_key_get.
message ObjectStorageKeyGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_key_get"
    method: "GET"
    path: "/object-storage/keys/{key_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageKey";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Object Storage key to retrieve (required).
  int32 key_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageKeyListInput is the input contract for
// linode_object_storage_key_list.
message ObjectStorageKeyListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_key_list"
    method: "GET"
    path: "/object-storage/keys"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageKeyListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageKeyCreateInput is the input contract for
// linode_object_storage_key_create. label and confirm are required.
// bucket_access is a JSON array passed as a string; the handler parses and
// validates it, so the schema type stays string.
message ObjectStorageKeyCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_key_create"
    method: "POST"
    path: "/object-storage/keys"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageKeyWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This creates an access key. The secret_key is only shown ONCE in the response. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Access key '{label}' created successfully (ID: {id})";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the access key (max 50 characters).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // JSON array of bucket permissions: [{"bucket_name": "name", "region":
  // "region", "permissions": "read_only|read_write"}]. Omit for unrestricted
  // access.
  optional string bucket_access = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true. The secret_key is only shown ONCE in the response.
  // Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageKeyUpdateInput is the input contract for
// linode_object_storage_key_update. key_id and confirm are required.
message ObjectStorageKeyUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_key_update"
    method: "PUT"
    path: "/object-storage/keys/{key_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageKeyWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This modifies access key permissions. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Access key {key_id} modified successfully";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // ID of the access key to update.
  int32 key_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the access key (max 50 characters).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // JSON array of bucket permissions: [{"bucket_name": "name", "region":
  // "region", "permissions": "read_only|read_write"}].
  optional string bucket_access = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm key update. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Complete replacement set of regions the key is valid in (optional).
  repeated string regions = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// ObjectStorageKeyDeleteInput is the input contract for
// linode_object_storage_key_delete. key_id and confirm are required.
message ObjectStorageKeyDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_key_delete"
    method: "DELETE"
    path: "/object-storage/keys/{key_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageKeyDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This revokes the access key permanently. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "ObjectStorageKey";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // ID of the access key to revoke.
  int32 key_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm key revocation. This action is permanent.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageBucket mirrors a Linode Object Storage bucket.
message ObjectStorageBucket {
  string label = 1;
  string region = 2;
  string hostname = 3;
  string created = 4;
  int32 objects = 5;
  int32 size = 6;
  string cluster = 7;
}

// ObjectStorageBucketListResponse is the linode_object_storage_bucket_list
// envelope: count and the full proto ObjectStorageBucket elements. The tool has
// no filter params, so filter is omitted.
message ObjectStorageBucketListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ObjectStorageBucket buckets = 3;
}

// ObjectStorageBucketWriteResponse is the {message, bucket} envelope the Object
// Storage bucket create tool returns.
message ObjectStorageBucketWriteResponse {
  string message = 1;
  ObjectStorageBucket bucket = 2;
}

// ObjectStorageBucketDeleteResponse is the id-echo envelope
// linode_object_storage_bucket_delete returns: a confirmation message plus the
// region and label identifying the deleted bucket. The delete endpoint returns
// an empty body, so the echo confirms the target.
message ObjectStorageBucketDeleteResponse {
  string message = 1;
  string region = 2;
  string label = 3;
}

// ObjectStorageBucketGetInput is the input contract for
// linode_object_storage_bucket_get.
message ObjectStorageBucketGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_get"
    method: "GET"
    path: "/object-storage/buckets/{region}/{label}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucket";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (required).
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (required).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageBucketListInput is the input contract for
// linode_object_storage_bucket_list.
message ObjectStorageBucketListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_list"
    method: "GET"
    path: "/object-storage/buckets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucketListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageBucketByRegionListInput is the input contract for
// linode_object_storage_bucket_by_region_list. region is required.
message ObjectStorageBucketByRegionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_by_region_list"
    method: "GET"
    path: "/object-storage/buckets/{region}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucketListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where buckets are located (e.g., 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageBucketObjectListInput is the input contract for
// linode_object_storage_bucket_object_list. region and label are required.
// page_size is a string on purpose: the hand-built schema advertised it as a
// string and the handler forwards it verbatim as an S3 query param.
message ObjectStorageBucketObjectListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_object_list"
    method: "GET"
    path: "/object-storage/buckets/{region}/{label}/object-list"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageObjectListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g., 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Filter objects by key prefix (e.g., 'images/' to list only objects in the
  // images folder).
  optional string prefix = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Delimiter for grouping keys (typically '/' for folder-like listing).
  optional string delimiter = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Pagination marker from a previous truncated response.
  optional string marker = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of objects to return per page (default 100, max 500).
  optional string page_size = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ObjectStorageBucketCreateInput is the input contract for
// linode_object_storage_bucket_create. label, region, and confirm are required.
message ObjectStorageBucketCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_create"
    method: "POST"
    path: "/object-storage/buckets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucketWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Bucket '{label}' created successfully in {region}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Bucket label (3-63 chars, lowercase alphanumeric and hyphens, must
  // start/end with alphanumeric).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Object Storage region for the bucket (e.g. us-east-1).
  string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Access control: private, public-read, authenticated-read, or
  // public-read-write (default: private).
  optional string acl = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether to enable CORS on the bucket (default: true).
  optional bool cors_enabled = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm bucket creation. This operation incurs
  // billing charges. Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Endpoint generation to place the bucket on: E0, E1, E2, or E3 (optional).
  // Omitting it lets the API pick the region's default generation.
  optional ObjectStorageEndpointType.Value endpoint_type = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A specific S3 endpoint hostname to place the bucket on (optional).
  optional string s3_endpoint = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// ObjectStorageBucketDeleteInput is the input contract for
// linode_object_storage_bucket_delete. region, label, and confirm are required.
message ObjectStorageBucketDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_bucket_delete"
    method: "DELETE"
    path: "/object-storage/buckets/{region}/{label}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageBucketDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive and irreversible. All objects must be removed first. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Bucket '{label}' in {region} removed successfully";
  option (linode.mcp.v1.resource_type) = "ObjectStorageBucket";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region of the bucket to delete.
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Label of the bucket to delete.
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. This action is irreversible.
  // Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageCancelInput is the input contract for
// linode_object_storage_cancel. confirm is required.
message ObjectStorageCancelInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_cancel"
    method: "POST"
    path: "/object-storage/cancel"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MessageResponse";
  option (linode.mcp.v1.confirm_message) = "This operation cancels Object Storage service for the account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Object Storage cancellation requested successfully";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Must be set to true to confirm Object Storage cancellation. Ignored when
  // dry_run=true.
  bool confirm = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageEndpoint mirrors a Linode Object Storage endpoint. s3_endpoint is
// null until the endpoint is assigned an S3 hostname, so it is an optional string
// (omitted when the API returns null).
message ObjectStorageEndpoint {
  string region = 1;
  string endpoint_type = 2;
  optional string s3_endpoint = 3;
}

// ObjectStorageEndpointListResponse is the linode_object_storage_endpoint_list
// envelope: count and the full proto ObjectStorageEndpoint elements. The tool has
// no filter params, so filter is omitted.
message ObjectStorageEndpointListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ObjectStorageEndpoint endpoints = 3;
}

// ObjectStorageEndpointListInput is the input contract for
// linode_object_storage_endpoint_list.
message ObjectStorageEndpointListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_endpoint_list"
    method: "GET"
    path: "/object-storage/endpoints"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageEndpointListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ObjectStorageQuota mirrors a Linode Object Storage quota. quota_limit is the
// allowed maximum for the metric named by resource_metric.
message ObjectStorageQuota {
  string quota_id = 1;
  string quota_name = 2;
  string endpoint_type = 3;
  string s3_endpoint = 4;
  string description = 5;
  int64 quota_limit = 6;
  string resource_metric = 7;
}

// ObjectStorageQuotaListResponse is the linode_object_storage_quota_list
// envelope: count and the full proto ObjectStorageQuota elements. The tool has no
// filter params, so filter is omitted.
message ObjectStorageQuotaListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ObjectStorageQuota quotas = 3;
}

// ObjectStorageQuotaListInput is the input contract for
// linode_object_storage_quota_list.
message ObjectStorageQuotaListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_quota_list"
    method: "GET"
    path: "/object-storage/quotas"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuotaListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageQuotaGetInput is the input contract for
// linode_object_storage_quota_get. obj_quota_id is a slug-style string id, not
// an integer.
message ObjectStorageQuotaGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_quota_get"
    method: "GET"
    path: "/object-storage/quotas/{obj_quota_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuota";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Object Storage quota ID to retrieve.
  string obj_quota_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageQuotaUsage is the linode_object_storage_quota_usage_get response.
// quota_limit and usage are byte counts for storage-metric quotas, so both are
// int64; the canonical serializer emits them as JSON numbers on both languages.
// usage is optional because the API returns null before any usage is recorded
// (the field is then omitted rather than serialized as 0).
message ObjectStorageQuotaUsage {
  int64 quota_limit = 1;
  optional int64 usage = 2;
}

// ObjectStorageQuotaUsageGetInput is the input contract for
// linode_object_storage_quota_usage_get. obj_quota_id is a slug-style string
// id, not an integer.
message ObjectStorageQuotaUsageGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_quota_usage_get"
    method: "GET"
    path: "/object-storage/quotas/{obj_quota_id}/usage"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuotaUsage";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Object Storage quota ID to retrieve usage for.
  string obj_quota_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageGlobalQuotaListResponse is the
// linode_object_storage_global_quota_list envelope. A global quota is the same
// resource the per-endpoint quota tools return, scoped to the account rather
// than to one S3 endpoint, so the elements are ObjectStorageQuota. The tool has
// no filter params, so filter is never set; it stays declared because the list
// envelope carries the same three members everywhere.
message ObjectStorageGlobalQuotaListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated ObjectStorageQuota global_quotas = 3;
}

// ObjectStorageGlobalQuotaListInput is the input contract for
// linode_object_storage_global_quota_list. The route publishes no page controls
// in the reviewed spec snapshot, so no page/page_size travels here.
message ObjectStorageGlobalQuotaListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_global_quota_list"
    method: "GET"
    path: "/object-storage/global-quotas"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageGlobalQuotaListResponse";
  option (linode.mcp.v1.tool_description) = "Lists Object Storage global quotas on the account.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageGlobalQuotaGetInput is the input contract for
// linode_object_storage_global_quota_get. obj_global_quota_id is a slug-style
// string id, not an integer, the same way obj_quota_id is.
message ObjectStorageGlobalQuotaGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_global_quota_get"
    method: "GET"
    path: "/object-storage/global-quotas/{obj_global_quota_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuota";
  option (linode.mcp.v1.tool_description) = "Gets a single Object Storage global quota by quota ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Object Storage global quota {obj_global_quota_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Object Storage global quota ID to retrieve.
  string obj_global_quota_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageGlobalQuotaUsageGetInput is the input contract for
// linode_object_storage_global_quota_usage_get. The usage shape is the one the
// per-endpoint quota reports, so it answers with ObjectStorageQuotaUsage.
message ObjectStorageGlobalQuotaUsageGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_global_quota_usage_get"
    method: "GET"
