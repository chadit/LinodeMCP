// ObjectStorageQuotaUsage is the linode_object_storage_quota_usage_get response.
// quota_limit and usage are byte counts for storage-metric quotas, so both are
// int64; the canonical serializer emits them as JSON numbers on both languages.
// usage is optional because the API returns null before any usage is recorded
// (the field is then omitted rather than serialized as 0).
message ObjectStorageQuotaUsage {
  int64 quota_limit = 1;
  optional int64 usage = 2;
}

// ObjectStorageQuotaUsageGetInput is the input contract for
// linode_object_storage_quota_usage_get. obj_quota_id is a slug-style string
// id, not an integer.
message ObjectStorageQuotaUsageGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_quota_usage_get"
    method: "GET"
    path: "/object-storage/quotas/{obj_quota_id}/usage"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_OBJECT_STORAGE_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuotaUsage";
  option (linode.mcp.v1.tool_description) = "Gets usage data for a specific Object Storage quota";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Object Storage quota usage for {obj_quota_id}: {error}";

  // The usage route takes a narrower character set than its sibling and words
  // its refusal differently, so the set is stated here rather than shared.
  option (buf.validate.message).cel = {
    id: "object_storage_quota_usage_get.obj_quota_id.required"
    message: "obj_quota_id is required"
    expression: "this.obj_quota_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_quota_usage_get.obj_quota_id.charset"
    message: "obj_quota_id must not contain path separators, query separators, traversal segments, or unsupported characters"
    expression: "this.obj_quota_id.matches('^[a-z0-9.-]+$') && !this.obj_quota_id.contains('..')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Object Storage quota ID to retrieve usage for.
  string obj_quota_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_FREE_TEXT,
    (linode.mcp.v1.reader_message) = {
      absent: "obj_quota_id is required"
      unusable: "obj_quota_id is required"
    }
  ];
}

