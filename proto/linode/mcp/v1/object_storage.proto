  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_OBJECT_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageQuota";
  option (linode.mcp.v1.tool_description) = "Gets details about a single Object Storage quota by ID";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Object Storage quota {obj_quota_id}: {error}";

