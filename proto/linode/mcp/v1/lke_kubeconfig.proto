syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// LKEKubeconfig is the base64-encoded kubeconfig for an LKE cluster.
message LKEKubeconfig {
  string kubeconfig = 1;
}

// LKEKubeconfigGetInput is the input contract for linode_lke_kubeconfig_get.
message LKEKubeconfigGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_kubeconfig_get"
    method: "GET"
    path: "/lke/clusters/{cluster_id}/kubeconfig"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LKE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_LKE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEKubeconfig";
  option (linode.mcp.v1.tool_description) = "Retrieves the kubeconfig file for an LKE cluster (base64-encoded)";
  option (linode.mcp.v1.error_message) = "Failed to retrieve kubeconfig for cluster {cluster_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster (required).
  int32 cluster_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// LKEKubeconfigDeleteResponse is the id-echo envelope
// linode_lke_kubeconfig_delete returns: a confirmation message plus the LKE
// cluster ID whose kubeconfig was deleted and regenerated.
message LKEKubeconfigDeleteResponse {
  string message = 1;
  int32 cluster_id = 2;
}

// LKEKubeconfigDeleteInput is the input contract for
// linode_lke_kubeconfig_delete.
message LKEKubeconfigDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_kubeconfig_delete"
    method: "DELETE"
    path: "/lke/clusters/{cluster_id}/kubeconfig"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LKE_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_LKE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEKubeconfigDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes and regenerates the kubeconfig for an LKE cluster. Existing kubeconfig files will stop working. Pass dry_run=true to preview without regenerating. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This deletes the kubeconfig. Existing kubeconfig files will stop working. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Kubeconfig for LKE cluster {cluster_id} deleted and regenerated successfully";
  option (linode.mcp.v1.resource_type) = "LKEKubeconfig";
  // A replay would regenerate the kubeconfig a second time and invalidate the
  // one the first attempt produced.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the cluster rather than the kubeconfig, so a preview and a
  // plan report cluster metadata without exposing the credential material.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_lke_cluster_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster.
  int32 cluster_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm kubeconfig deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
