syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/options.proto";

// BucketSSL reports whether an Object Storage bucket has a TLS certificate
// configured.
message BucketSSL {
  bool ssl = 1;
}

// ObjectStorageSSLWriteResponse is the {message, ssl} envelope the SSL upload
// tool returns. The upload endpoint echoes the bucket's TLS status, so ssl
// carries the BucketSSL element decoded from that response.
message ObjectStorageSSLWriteResponse {
  string message = 1;
  BucketSSL ssl = 2;
}

// ObjectStorageSSLDeleteResponse is the echo envelope
// linode_object_storage_ssl_delete returns: a confirmation message plus the
// region and bucket label identifying the bucket whose certificate was removed.
// The delete endpoint returns an empty body, so the echo confirms the target.
// The label is keyed "bucket" to match the tool's established response shape.
message ObjectStorageSSLDeleteResponse {
  string message = 1;
  string region = 2;
  string bucket = 3 [(linode.mcp.v1.echo_argument) = "label"];
}

// BucketSSLGetInput is the input contract for linode_object_storage_ssl_get.
message BucketSSLGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_ssl_get"
    method: "GET"
    path: "/object-storage/buckets/{region}/{label}/ssl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.BucketSSL";
  option (linode.mcp.v1.tool_description) = "Checks whether an Object Storage bucket has an SSL/TLS certificate installed";
  option (linode.mcp.v1.error_message) = "Failed to retrieve SSL status for bucket '{label}' in region '{region}': {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (required).
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (required).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ObjectStorageSSLUploadInput is the input contract for
// linode_object_storage_ssl_upload. region, label, certificate, private_key,
// and confirm are all required.
message ObjectStorageSSLUploadInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_ssl_upload"
    method: "POST"
    path: "/object-storage/buckets/{region}/{label}/ssl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageSSLWriteResponse";
  option (linode.mcp.v1.tool_description) = "Uploads an SSL/TLS certificate to an Object Storage bucket. Requires confirm=true to proceed.";
  option (linode.mcp.v1.error_message) = "Failed to upload SSL certificate for bucket '{label}' in region '{region}': {error}";
  option (linode.mcp.v1.confirm_message) = "This uploads an SSL certificate to the bucket. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "SSL certificate uploaded to bucket '{label}' in region '{region}'";

  // region and label are declared here rather than left to the derived path
  // checks so all four rejections keep the order both handlers answered in.
  option (buf.validate.message).cel = {
    id: "object_storage_ssl_upload.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_ssl_upload.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_ssl_upload.certificate.required"
    message: "certificate is required"
    expression: "this.certificate.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "object_storage_ssl_upload.private_key.required"
    message: "private_key is required"
    expression: "this.private_key.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g., 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The PEM-encoded TLS/SSL certificate to upload.
  string certificate = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // The PEM-encoded private key for the certificate.
  string private_key = 5 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // Must be true to proceed. This uploads a certificate to the bucket. Ignored
  // when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ObjectStorageSSLDeleteInput is the input contract for
// linode_object_storage_ssl_delete. region, label, and confirm are required.
message ObjectStorageSSLDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_object_storage_ssl_delete"
    method: "DELETE"
    path: "/object-storage/buckets/{region}/{label}/ssl"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ObjectStorageSSLDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes the SSL/TLS certificate from an Object Storage bucket. Requires confirm=true to proceed. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This removes the SSL certificate from the bucket. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "SSL certificate deleted from bucket '{label}' in region '{region}'";
  option (linode.mcp.v1.resource_type) = "ObjectStorageSSL";
  // A replay would report a certificate the first attempt already removed as one
  // the bucket never had.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_object_storage_ssl_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region where the bucket is located (e.g., 'us-east-1', 'us-southeast-1').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The bucket label (name).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to proceed. This removes the SSL certificate from the bucket.
  // Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
