  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the configuration profile (required).
  int32 config_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Existing configuration profile interface IDs in the desired order, e.g.
  // [101,102,103] (required at the handler level).
