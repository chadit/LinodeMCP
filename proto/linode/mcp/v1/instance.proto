// InstanceRebuildInput is the input contract for linode_instance_rebuild, a
// two-stage destroy: linode_id, image, root_pass, and confirm are required,
// and mode/plan_id drive the plan/apply flow.
message InstanceRebuildInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_rebuild"
    method: "POST"
    path: "/linode/instances/{linode_id}/rebuild"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Rebuilds a Linode instance with a new image. WARNING: This destroys all existing data on the instance. Pass dry_run=true to preview without rebuilding. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This DESTROYS ALL DATA on the instance and rebuilds it. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance {linode_id} rebuilt with image {image}";
  // A replay rebuilds a second time and wipes whatever the first rebuild wrote,
  // including anything the caller restored onto it in between.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.resource_type) = "Instance";
  // The read is the instance a rebuild erases. The walk lists the disks it
  // recreates, which is an extra call no descriptor describes.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  // Every disk is erased side-effect by side-effect, and the image pair says
  // one wording: the named replacement or the bare destruction.
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_instance_disk_list"
    emit: {
      target: WALK_TARGET_SIDE_EFFECTS
      note: "Disk \"{label}\" ({size} MB, {filesystem}) is erased and recreated from the new image."
    }
    warnings: {
      template: "Rebuild replaces the current image \"{state:image}\", destroys all data, and resets the root password."
      when_present: "image"
    }
    warnings: {
      template: "Rebuild destroys all data on the instance and resets the root password."
      when_absent: "image"
    }
    list_error_warning: "Could not list instance disks: {error}"
  };

  // Declared ahead of the body rules so an unaddressed call still hears which
  // instance it failed to name, the order the hand-written handler checked in.
  option (buf.validate.message).cel = {
    id: "instance_rebuild.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.image.required"
    message: "image is required"
    expression: "this.image != ''"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.root_pass.required"
    message: "root_pass is required"
    expression: "this.root_pass != ''"
  };
  // The next three sentences are Go's live wording, which names root_pass
  // because one validator serves every root password the surface takes. ASCII
  // classes because protovalidate-python evaluates matches() through Python's
  // re, which has no \p{Lu}; Go's own check is unicode-aware.
  option (buf.validate.message).cel = {
    id: "instance_rebuild.root_pass.min_length"
    message: "root_pass must be at least 12 characters"
    expression: "this.root_pass == '' || size(this.root_pass) >= 12"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.root_pass.max_length"
    message: "root_pass must not exceed 128 characters"
    expression: "this.root_pass == '' || size(this.root_pass) <= 128"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.root_pass.complexity"
    message: "root_pass must contain uppercase, lowercase, and digits"
    expression: "this.root_pass == '' || (this.root_pass.matches('[A-Z]') && this.root_pass.matches('[a-z]') && this.root_pass.matches('[0-9]'))"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.stackscript_id.positive"
    message: "stackscript_id must be a positive integer"
    expression: "!has(this.stackscript_id) || this.stackscript_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_rebuild.disk_encryption.known"
    message: "disk_encryption must be one of: disabled, enabled"
    expression: "!has(this.disk_encryption) || this.disk_encryption != 0"
  };
  // A string rather than an enum because the values carry slashes, which no
  // proto identifier can spell. The create and clone routes rule the same set
  // the same way.
  option (buf.validate.message).cel = {
    id: "instance_rebuild.maintenance_policy.known"
    message: "maintenance_policy must be one of: linode/migrate, linode/power_off_on"
    expression: "!has(this.maintenance_policy) || this.maintenance_policy in ['linode/migrate','linode/power_off_on']"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to rebuild (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The image to rebuild with (e.g. 'linode/ubuntu24.04'). Use
  // linode_image_list to find valid values.
  string image = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Root password for the rebuilt instance (min 12 chars, must include upper,
  // lower, and digits).
  string root_pass = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // SSH public keys to add to root's authorized_keys (optional).
  repeated string authorized_keys = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Linode usernames whose SSH keys to add (optional).
  repeated string authorized_users = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether to boot the instance after rebuild (optional, defaults to true).
  optional bool booted = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm rebuild. WARNING: This destroys ALL existing data.
  // Ignored when dry_run=true.
  bool confirm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with
  // plan_id re-checks drift and executes. Omit for a single-step call.
  optional string mode = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // StackScript to deploy onto the rebuilt instance (optional).
  optional int32 stackscript_id = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Answers to the StackScript's user-defined fields (optional).
  map<string, string> stackscript_data = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Metadata the rebuilt instance runs on first boot (optional).
  InstanceMetadataOptions metadata = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the rebuilt instance's disks are encrypted at rest (optional).
  optional DiskEncryption.Value disk_encryption = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Maintenance policy for the rebuilt instance, such as linode/migrate
  // (optional).
  optional string maintenance_policy = 16 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Plan type the instance is rebuilt onto, such as 'g6-standard-1'
  // (optional). Omit it to keep the current plan.
  optional string type = 17 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// InstancePasswordResetInput is the input contract for
// linode_instance_password_reset, a two-stage destroy: linode_id, root_pass,
// and confirm are required, and mode/plan_id drive the plan/apply flow.
message InstancePasswordResetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_password_reset"
    method: "POST"
    path: "/linode/instances/{linode_id}/password"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceActionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Resets the root password on a Linode instance. The instance must be powered off. Pass dry_run=true to preview without resetting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This resets the root password on the instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Root password reset for instance {linode_id}";
  option (linode.mcp.v1.resource_type) = "Instance";
  // The read is the instance whose root credential the call replaces. The
  // walk names the downtime, which no descriptor describes.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  // The reboot sentence is constant; the downtime warning reads the fetched
  // status through a sourceless walk.
  option (linode.mcp.v1.preview_sentence) = {
    template: "The instance is powered down and rebooted to apply the new root password."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.dependency_walk) = {
    warnings: {
      template: "Instance is currently running; the reset shuts it down and reboots it, causing downtime."
      when_field: "status"
      when_equals: "running"
    }
  };

  option (buf.validate.message).cel = {
    id: "instance_password_reset.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_password_reset.root_pass.required"
    message: "root_pass is required"
    expression: "this.root_pass != ''"
  };
  // The next three sentences are the surface's one root-password wording, the
  // same trio instance_rebuild and instance_disk_create declare. ASCII classes
  // because protovalidate-python evaluates matches() through Python's re, which
  // has no \p{Lu}.
  option (buf.validate.message).cel = {
    id: "instance_password_reset.root_pass.min_length"
    message: "root_pass must be at least 12 characters"
    expression: "this.root_pass == '' || size(this.root_pass) >= 12"
  };
  option (buf.validate.message).cel = {
    id: "instance_password_reset.root_pass.max_length"
    message: "root_pass must not exceed 128 characters"
    expression: "this.root_pass == '' || size(this.root_pass) <= 128"
  };
  option (buf.validate.message).cel = {
    id: "instance_password_reset.root_pass.complexity"
    message: "root_pass must contain uppercase, lowercase, and digits"
    expression: "this.root_pass == '' || (this.root_pass.matches('[A-Z]') && this.root_pass.matches('[a-z]') && this.root_pass.matches('[0-9]'))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New root password (min 12 chars, must include upper, lower, and digits).
  string root_pass = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // Must be true to confirm password reset. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with
  // plan_id re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceResizeInput is the input contract for linode_instance_resize, an
// opt-in two-stage write: instance_id, type, and confirm are required, and
// mode/plan_id drive the plan/apply flow when enabled in the two_stage config.
message InstanceResizeInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_resize"
    method: "POST"
    path: "/linode/instances/{instance_id}/resize"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceResizeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Resizes a Linode instance to a new plan. WARNING: This causes downtime during the migration process and may affect billing. Pass dry_run=true to preview without resizing. Supports two-stage writes when enabled in the two_stage config: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This operation causes downtime and may affect billing. Set confirm=true to proceed.";
  // Go's hand handler named the instance in its failure and Python's did not;
  // naming it is the reference, so Python widens to match.
  option (linode.mcp.v1.error_message) = "Failed to resize instance {instance_id}: {error}";
  option (linode.mcp.v1.success_message) = "Instance {instance_id} resize to {type} initiated successfully";
  // The preview reads the Linode whose plan the resize replaces; the plan reads
  // the instance and its disks together, since the resize moves both, keeping
  // only the fields a real change would move so a cosmetic instance field
  // cannot refuse an apply. The prose reads the instance either way, which is
  // what lets one wording serve both paths.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
  };
  option (linode.mcp.v1.state_composite) = {
    prose_member: "instance"
    calls: {
      tool: "linode_instance_get"
      member: "instance"
      fields: "type"
    }
    calls: {
      tool: "linode_instance_disk_list"
      member: "disks"
      fields: "id"
      fields: "size"
      fields: "filesystem"
      slot_arguments: { read_slot: "linode_id", argument: "instance_id" }
    }
  };
  // The type it leaves is named beside the one it is headed for, and dropped
  // for a state that carries no type at all.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Instance resizes from type {state:type} to {type}; it reboots and is unavailable during the resize."
    template: "Instance resizes to type {type}; it reboots and is unavailable during the resize."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Resizing changes the monthly price to match the new type."
    line: PREVIEW_LINE_WARNING
  };

  option (buf.validate.message).cel = {
    id: "instance_resize.instance_id.positive"
    message: "instance_id must be a positive integer"
    expression: "this.instance_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_resize.type.required"
    message: "type is required"
    expression: "this.type != ''"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "instance_resize.migration_type.known"
    message: "migration_type must be one of: cold, warm"
    expression: "!has(this.migration_type) || this.migration_type != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to resize (required).
  int32 instance_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The new Linode plan type (e.g., 'g6-standard-1').
  string type = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Automatically resize disks when resizing to a larger plan (optional,
  // default: false).
  optional bool allow_auto_disk_resize = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Migration type: 'cold' (default) or 'warm' (optional).
  optional InstanceMigrationType.Value migration_type = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm resize. This operation causes downtime.
  // Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with
  // plan_id re-checks drift and executes. Omit for a single-step call.
  optional string mode = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceRescueInput is the input contract for linode_instance_rescue.
// linode_id and confirm are required. devices is a free-form slot-to-disk map,
// optional.
message InstanceRescueInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_rescue"
    method: "POST"
    path: "/linode/instances/{linode_id}/rescue"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceActionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Boots a Linode instance into rescue mode for recovery operations.";
  option (linode.mcp.v1.error_message) = "Failed to rescue instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This reboots the instance into rescue mode. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance {linode_id} is booting into rescue mode";
  // The preview reads the instance the reboot would interrupt, so a running one
  // can be warned about before it goes down.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "The instance reboots into rescue mode; its normal boot configuration is bypassed until you reboot out of rescue mode."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The downtime is worth weighing only for a Linode that is up, which is a
  // reading of the resource rather than of the call: a status no arm names
  // drops the line.
  option (linode.mcp.v1.preview_sentence) = {
    matched_by: {
      state: "status"
      arm: {
        equals: "running"
        wording: "Instance is currently running; entering rescue mode reboots it, causing downtime."
      }
    }
    line: PREVIEW_LINE_WARNING
  };

  option (buf.validate.message).cel = {
    id: "instance_rescue.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to boot into rescue mode (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Object mapping device slots to disk/volume IDs, e.g.
  // {"sda":{"disk_id":123},"sdb":{"volume_id":456}} (optional).
  map<string, google.protobuf.Value> devices = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm booting into rescue mode. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

