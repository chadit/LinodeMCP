  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceConfigInterfaceReorderResponse";
  option (linode.mcp.v1.tool_description) = "Reorders interfaces on a Linode configuration profile. WARNING: This changes network interface ordering.";
  option (linode.mcp.v1.error_message) = "Failed to reorder interfaces for configuration profile {config_id} on instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This reorders network interfaces on the configuration profile. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Configuration profile {config_id} interfaces reordered on instance {linode_id}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the profile whose interface order changes.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_config_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Interfaces on configuration profile {config_id} for Linode {linode_id} will be reordered."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "instance_config_interface_reorder.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_config_interface_reorder.config_id.positive"
    message: "config_id must be a positive integer"
    expression: "this.config_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_config_interface_reorder.ids.present"
    message: "ids must include at least one ID"
    expression: "size(this.ids) > 0"
  };
