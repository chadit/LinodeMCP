  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceInterfaceUpgradeInput is the input contract for
// linode_instance_interface_upgrade. linode_id and confirm are required.
// api_dry_run is the Linode API's own validation flag, distinct from the MCP
// dry_run preview.
message InstanceInterfaceUpgradeInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_interface_upgrade"
    method: "POST"
    path: "/linode/instances/{linode_id}/upgrade-interfaces"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceInterfaceUpgradeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Upgrades a Linode's legacy config interfaces to Linode interfaces. WARNING: This irreversibly changes instance network configuration.";
  option (linode.mcp.v1.error_message) = "Failed to upgrade interfaces for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This irreversibly upgrades Linode network interfaces. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Linode {linode_id} interface upgrade initiated";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the instance the upgrade converts. Its route spells the id
  // linode_id where the read spells it instance_id.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments: {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Linode {linode_id} will be upgraded to Linode Interfaces."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // config_id and dry_run come back from the API rather than the call: the
  // route picks the profile when none is named, and its dry_run says whether it
  // validated or applied. interfaces is the upgraded set, which the same decode
  // places. config_id carries the marker because the argument is spelled the
  // same way and the caller has to hear the profile the API actually upgraded.
  option (linode.mcp.v1.response_body_fields) = "api:config_id";
  option (linode.mcp.v1.response_body_fields) = "dry_run";

  option (buf.validate.message).cel = {
    id: "instance_interface_upgrade.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_upgrade.config_id.positive"
    message: "config_id must be a positive integer"
    expression: "!has(this.config_id) || this.config_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Optional configuration profile ID to upgrade.
  optional int32 config_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Pass dry_run to the Linode API to validate the upgrade without applying it
  // (optional). The wire key is "dry_run": the argument cannot take that name,
  // which the MCP preview flag already uses.
  optional bool api_dry_run = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_name) = "dry_run"
  ];
  // Must be true to confirm the interface upgrade request. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

