  option (linode.mcp.v1.tool_description) = "Updates interface settings for a specific Linode instance. Power off the Linode before enabling or disabling Network Helper. WARNING: This changes instance network configuration.";
  option (linode.mcp.v1.error_message) = "Failed to update interface settings for instance {linode_id}: {error}";
