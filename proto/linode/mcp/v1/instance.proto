    template: "An interface will be added to Linode {linode_id}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Declared in the order the hand handler checked them: an arm's own members
  // answer before the count of arms does.
  option (buf.validate.message).cel = {
    id: "instance_interface_add.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_add.vpc.subnet_id.positive"
    message: "vpc.subnet_id must be a positive integer"
    expression: "!has(this.vpc) || this.vpc.subnet_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_add.vlan.vlan_label.required"
    message: "vlan.vlan_label is required"
    expression: "!has(this.vlan) || this.vlan.vlan_label.matches('[^ \\t\\r\\n]')"
