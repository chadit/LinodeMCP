// InstanceConfigCreateInput is the input contract for
// linode_instance_config_create. linode_id, label, devices, and confirm are
// required at the handler level, but devices is an open device-slot map so it
// becomes a map<string, Value> whose required flag the generator drops from the
// advertised schema (runtime still enforces presence). helpers and interfaces
// are the object and object array its update sibling takes.
message InstanceConfigCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_config_create"
    method: "POST"
    path: "/linode/instances/{linode_id}/configs"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceConfigWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a configuration profile on a Linode instance. WARNING: This changes instance boot configuration.";
  option (linode.mcp.v1.error_message) = "Failed to create configuration profile for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a configuration profile on the instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Configuration profile '{label}' (ID: {id}) created on instance {linode_id}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the instance the profile is created on. Its route spells the
  // id linode_id where the read spells it instance_id.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments: {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new configuration profile will be created on instance {linode_id} labeled \"{label}\"."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The device slots the API publishes, each holding one disk or one volume.
  option (linode.mcp.v1.object_walk) = {
    field: "devices"
    absent: "devices is required"
    unusable: "devices must be a JSON object"
    empty: "devices must include at least one device slot"
    members: {
      unknown: "device slot {key} must be one of sda through sdh"
      key: ["sda", "sdb", "sdc", "sdd", "sde", "sdf", "sdg", "sdh"]
      value: {
        kind: VALUE_KIND_OBJECT
        unusable: "device {key} must be an object"
        members: {
          unknown: "invalid devices JSON: unknown field \"{key}\""
          key: ["disk_id", "volume_id"]
          value: {
            kind: VALUE_KIND_INT
            minimum: 1
            unusable: "invalid devices JSON: {parent}.{key} must be an integer"
            refused: "device {parent} {key} must be greater than 0"
          }
          require: {
            name: ["disk_id", "volume_id"]
            any_of: "device {parent} requires disk_id or volume_id"
            at_most_one: "device {parent} can use disk_id or volume_id, not both"
          }
        }
      }
    }
  };
  // The boot helpers. Only the vocabulary is checked: the route reads any of
  // them as a flag and neither language ever judged the value.
  option (linode.mcp.v1.object_walk) = {
    field: "helpers"
    unusable: "helpers must be a JSON object"
    members: {
      unknown: "invalid helpers JSON: unknown field \"{key}\""
      key: ["devtmpfs_automount", "distro", "modules_dep", "network", "updatedb_disabled"]
    }
  };
  // Each legacy interface names a purpose. An entry naming none reads the same
  // as one naming a purpose the API does not publish, which is what both
  // languages' hand-written bodies answered.
  option (linode.mcp.v1.object_walk) = {
    field: "interfaces"
    element: "interfaces must be an array of objects"
    members: {
      member: {
        name: "purpose"
        value: {
          kind: VALUE_KIND_TEXT
          values: "linode.mcp.v1.ConfigInterfacePurpose.Value"
          absent: "{field}[{parent}].{key} must be one of: {values}"
          unusable: "{field}[{parent}].{key} must be one of: {values}"
        }
      }
    }
  };

  option (buf.validate.message).cel = {
    id: "instance_config_create.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  // The label travels in the body untouched, so the whitespace a caller padded
  // it with is refused here rather than trimmed away behind their back.
  option (buf.validate.message).cel = {
    id: "instance_config_create.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "instance_config_create.label.trimmed"
    message: "label must not include leading or trailing whitespace"
    expression: "this.label.matches('(?s)^\\\\S(.*\\\\S)?$')"
  };
  option (buf.validate.message).cel = {
    id: "instance_config_create.memory_limit.positive"
    message: "memory_limit must be a positive integer"
    expression: "!has(this.memory_limit) || this.memory_limit >= 1"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "instance_config_create.run_level.known"
    message: "run_level must be one of: default, single, binbash"
    expression: "!has(this.run_level) || this.run_level != 0"
  };
  option (buf.validate.message).cel = {
    id: "instance_config_create.virt_mode.known"
    message: "virt_mode must be one of: paravirt, fullvirt"
    expression: "!has(this.virt_mode) || this.virt_mode != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Label for the configuration profile (required).
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Object mapping device slots to disk/volume IDs, e.g. {"sda":{"disk_id":123}}
  // (required at the handler level).
  map<string, google.protobuf.Value> devices = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Kernel ID to boot, e.g. linode/latest-64bit (optional).
  optional string kernel = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional comments for the configuration profile.
  optional string comments = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional memory limit in MB.
  optional int32 memory_limit = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Root device to boot, e.g. /dev/sda (optional).
  optional string root_device = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Run level: default, single, or binbash (optional).
  optional ConfigRunLevel.Value run_level = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Virtualization mode: paravirt or fullvirt (optional).
  optional ConfigVirtMode.Value virt_mode = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional helpers object. Spelled the way its update sibling spells it: the
  // route reads an object, and a string argument has no body member to become
  // one.
  map<string, google.protobuf.Value> helpers = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional array of interface objects.
  repeated google.protobuf.Struct interfaces = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm configuration profile creation. Ignored when
  // dry_run=true.
  bool confirm = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

