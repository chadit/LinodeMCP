  InterfaceDefaultRoute default_route = 6 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Firewall to attach to the new interface (optional). The API's own minimum
