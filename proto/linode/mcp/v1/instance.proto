    expression: "!has(this.default_route) || !has(this.default_route.ipv4_interface_id) || this.default_route.ipv4_interface_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_settings_update.default_route.ipv6_interface_id.positive"
