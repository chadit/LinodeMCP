// InstanceBackupRestoreInput is the input contract for
// linode_instance_backup_restore. linode_id, backup_id, target_linode_id, and
// confirm are required.
message InstanceBackupRestoreInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_backup_restore"
    method: "POST"
    path: "/linode/instances/{linode_id}/backups/{backup_id}/restore"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {
    category: TOOL_CATEGORY_COMPUTE_DEEP
    category: TOOL_CATEGORY_COMPUTE
  };
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceBackupRestoreWriteResponse";
  option (linode.mcp.v1.tool_description) = "Restores a backup to a Linode instance. WARNING: When overwrite is true, this destroys all disks and configs on the target instance.";
  option (linode.mcp.v1.error_message) = "Failed to restore backup {backup_id} to instance {target_linode_id}: {error}";
  // overwrite is reported by the member of that name rather than inside the
  // sentence: a flag renders true in Go and True in python, so no template
  // carrying one reads the same in both.
  option (linode.mcp.v1.success_message) = "Backup {backup_id} restore initiated to instance {target_linode_id}";
  // A replay starts a second restore over the disks the first one is still
  // writing, and with overwrite it destroys them again mid-flight.
  option (linode.mcp.v1.retry_disabled) = true;
  // One sentence carries both halves of what the hand handler said in two: the
  // gate cannot re-word itself once overwrite is read, so the destructive half
  // is stated to every caller rather than only the one who asked for it.
  option (linode.mcp.v1.confirm_message) = "This restores a backup to the target instance, and with overwrite=true it DESTROYS all existing disks and configs there. Set confirm=true to proceed.";
  // The preview reads the backup the restore would write onto the target, which
  // is the resource the call is about: the target's own state is what the
  // restore replaces rather than what it copies.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_backup_get"
  };
  // An absent overwrite reads as false, which is what both hand walks did with
  // it, so the two arms carry the same wording.
  option (linode.mcp.v1.preview_sentence) = {
    chosen_by: {
      argument: "overwrite"
      when_true: "All existing disks and configs on target instance {target_linode_id} are destroyed and replaced by the backup."
      when_false: "The backup is restored onto target instance {target_linode_id}; the restore fails if its disks or configs collide."
      when_absent: "The backup is restored onto target instance {target_linode_id}; the restore fails if its disks or configs collide."
    }
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // Only the destructive answer earns a warning, so the other two arms are
  // empty and the line is dropped for them.
  option (linode.mcp.v1.preview_sentence) = {
    chosen_by: {
      argument: "overwrite"
      when_true: "overwrite=true: existing data on target instance {target_linode_id} is permanently lost."
    }
    line: PREVIEW_LINE_WARNING
  };

  option (buf.validate.message).cel = {
    id: "instance_backup_restore.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_backup_restore.backup_id.positive"
    message: "backup_id must be a positive integer"
    expression: "this.backup_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_backup_restore.target_linode_id.positive"
    message: "target_linode_id must be a positive integer"
    expression: "this.target_linode_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance that owns the backup (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the backup to restore (required).
  int32 backup_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the Linode instance to restore the backup to (required). The
  // route spells it linode_id in the body, where the path already carries the
  // Linode that owns the backup.
  int32 target_linode_id = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_name) = "linode_id"
  ];
  // If true, deletes all disks and configs on the target before restoring.
  // Defaults to false (optional).
  optional bool overwrite = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm restore. With overwrite=true, all existing data on
  // the target is destroyed. Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceBackupsEnableInput is the input contract for
// linode_instance_backups_enable. linode_id and confirm are required.
message InstanceBackupsEnableInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_backups_enable"
    method: "POST"
    path: "/linode/instances/{linode_id}/backups/enable"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {
    category: TOOL_CATEGORY_COMPUTE_DEEP
    category: TOOL_CATEGORY_COMPUTE
  };
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceActionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Enables the backup service for a Linode instance. WARNING: This adds a recurring charge to your account based on the instance plan.";
  option (linode.mcp.v1.error_message) = "Failed to enable backups for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "Enabling backups adds a recurring charge to your account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Backup service enabled for instance {linode_id}";
  // The read is the instance backups are turned on for. Its route spells the
  // id linode_id where the read spells it instance_id.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments: {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };

  option (buf.validate.message).cel = {
    id: "instance_backups_enable.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm enabling backups. This adds a recurring billing
  // charge. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceBackupsCancelInput is the input contract for
// linode_instance_backups_cancel, a two-stage destroy: linode_id and confirm
// are required, and mode/plan_id drive the plan/apply flow.
message InstanceBackupsCancelInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_backups_cancel"
    method: "POST"
    path: "/linode/instances/{linode_id}/backups/cancel"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {
    category: TOOL_CATEGORY_COMPUTE_DEEP
    category: TOOL_CATEGORY_COMPUTE
  };
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceActionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Cancels the backup service for a Linode instance. WARNING: This permanently deletes all existing backups for the instance. Pass dry_run=true to preview without canceling. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This permanently deletes all backups for the instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Backup service canceled for instance {linode_id}. All backups have been deleted.";
  option (linode.mcp.v1.resource_type) = "Instance";
  // The read is the Linode whose backup service the cancel ends. No walk:
  // the backups the cancel deletes are not a resource any route lists off
  // the instance.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm cancellation. All existing backups will be
  // permanently deleted. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceDiskDeleteResponse is the id-echo envelope linode_instance_disk_delete
// returns: a confirmation message plus the parent instance and deleted disk IDs.
// The delete endpoint returns an empty body, so the echo confirms the target.
message InstanceDiskDeleteResponse {
  string message = 1;
  int32 linode_id = 2;
  int32 disk_id = 3;
}

// InstanceConfigDeleteResponse is the id-echo envelope
// linode_instance_config_delete returns: a confirmation message plus the parent
// instance and deleted configuration-profile IDs.
message InstanceConfigDeleteResponse {
  string message = 1;
  int32 linode_id = 2;
  int32 config_id = 3;
}

// InstanceConfigInterfaceDeleteResponse is the id-echo envelope
// linode_instance_config_interface_delete returns: a confirmation message plus
// the instance, configuration-profile, and deleted interface IDs.
message InstanceConfigInterfaceDeleteResponse {
  string message = 1;
  int32 linode_id = 2;
  int32 config_id = 3;
  int32 interface_id = 4;
}

// InstanceConfigInterfaceReorderResponse is the echo envelope
// linode_instance_config_interface_reorder returns: a confirmation message, the
// instance and configuration-profile IDs, and the interface IDs in their new
// order. The reorder endpoint returns an empty body, so the echo confirms the
// applied order.
message InstanceConfigInterfaceReorderResponse {
  string message = 1;
  int32 linode_id = 2;
  int32 config_id = 3;
  repeated int32 ids = 4;
}

// InstanceInterfaceDeleteResponse is the id-echo envelope
// linode_instance_interface_delete returns: a confirmation message plus the
// parent instance and deleted interface IDs.
message InstanceInterfaceDeleteResponse {
  string message = 1;
  int32 linode_id = 2;
  int32 interface_id = 3;
}

// InstanceTransfer mirrors GET /linode/instances/{linodeId}/transfer, the
// current billing month's network transfer pool. used is bytes and exceeds
// int32, so it is int64; every field emits as a JSON number.
message InstanceTransfer {
  int32 billable = 1;
  int32 quota = 2;
  int64 used = 3;
}

// InstanceTransferMonth mirrors GET
// /linode/instances/{linodeId}/transfer/{year}/{month}, a specific month's
// totals. This is a distinct shape from InstanceTransfer: the month endpoint
// returns bytes_in/bytes_out/bytes_total (int64 byte counts that exceed int32,
// emitted as JSON numbers), not billable/quota/used.
message InstanceTransferMonth {
  int64 bytes_in = 1;
  int64 bytes_out = 2;
  int64 bytes_total = 3;
}
