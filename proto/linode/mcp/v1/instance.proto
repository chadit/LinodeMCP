// InstanceMetadataOptions is the metadata object an instance create carries.
// Its own message rather than a free-form struct so the one member the API
// accepts stays advertised.
message InstanceMetadataOptions {
  // Base64-encoded cloud-init user data to run on first boot.
  optional string user_data = 1;
}

// InstancePlacementGroupAssignment is the placement_group object an instance
// create carries. Distinct from the PlacementGroup read message, which carries
// members and migrations a write can never send.
message InstancePlacementGroupAssignment {
  // The ID of the placement group to assign the new instance to.
  int32 id = 1;
  // Fail the create rather than assign the instance non-compliantly.
  optional bool compliant_only = 2;
}

// InstanceCreateInterface is one element of the interfaces array an instance
// create posts. It carries what InstanceInterfaceAddInput carries flat, since
// the create reads the same five members inside each element it is given. The
// add tool's own input message is not reused: it declares a route of its own,
// so sharing it would tie two tools' contracts together.
message InstanceCreateInterface {
  // Public interface settings. Set exactly one of public, vpc, or vlan.
  InterfacePublicConfig public = 1;
  // VPC interface settings. Set exactly one of public, vpc, or vlan.
  InterfaceVpcConfig vpc = 2;
  // VLAN interface settings. Set exactly one of public, vpc, or vlan.
  InterfaceVlanConfig vlan = 3;
  // Whether this interface carries the default route for each address family.
  InterfaceDefaultRoute default_route = 4;
  // Firewall to attach to this interface.
  optional int32 firewall_id = 5;
}

// InstanceCreateInput is the input contract for linode_instance_create.
// region, type, firewall_id, and confirm are required.
message InstanceCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_create"
    method: "POST"
    path: "/linode/instances"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new Linode instance under the current Linode Interfaces generation. WARNING: Billing starts immediately upon creation. Requires firewall_id (get one from linode_firewall_list or create with linode_firewall_create). Note: VPC attachment via the current interface model is not yet supported by this tool; use linode_vpc_* tools after create.";
  option (linode.mcp.v1.error_message) = "Failed to create instance: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance '{label}' (ID: {id}) created successfully in {region}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The instance does not exist yet, so there is no state to read: the wordings
  // name the image only when the caller chose one.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new {type} instance will be created in region {region} from image {image}."
    template: "A new {type} instance will be created in region {region}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for the instance starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };
  // Every instance this tool makes runs on the current Interfaces generation,
  // which is what the synthesized interfaces element below describes.
  option (linode.mcp.v1.body_constant) = {
    key: "interface_generation"
    text: "linode"
  };

  option (buf.validate.message).cel = {
    id: "instance_create.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.type.required"
    message: "type is required"
    expression: "this.type.matches('[^ \\t\\r\\n]')"
  };
  // The firewall is this tool's own guardrail rather than the API's, so the
  // sentence names the two tools a caller gets an id from. The field carries no
  // presence, which is what lets one rule answer both the missing id and the
  // unusable one.
  option (buf.validate.message).cel = {
    id: "instance_create.firewall_id.required"
    message: "firewall_id is required for instance creation. Get a firewall ID from linode_firewall_list, or create one with linode_firewall_create."
    expression: "has(this.firewall_id) && this.firewall_id >= 1"
  };
  // The three root-password sentences the whole surface answers, in the
  // wording the disk routes already use. ASCII classes because
  // protovalidate-python evaluates matches() through Python's re, which has no
  // \p{Lu}.
  option (buf.validate.message).cel = {
    id: "instance_create.root_pass.min_length"
    message: "root_pass must be at least 12 characters"
    expression: "!has(this.root_pass) || size(this.root_pass) >= 12"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.root_pass.max_length"
    message: "root_pass must not exceed 128 characters"
    expression: "!has(this.root_pass) || size(this.root_pass) <= 128"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.root_pass.complexity"
    message: "root_pass must contain uppercase, lowercase, and digits"
    expression: "!has(this.root_pass) || (this.root_pass.matches('[A-Z]') && this.root_pass.matches('[a-z]') && this.root_pass.matches('[0-9]'))"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.stackscript_id.positive"
    message: "stackscript_id must be a positive integer"
    expression: "!has(this.stackscript_id) || this.stackscript_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.backup_id.positive"
    message: "backup_id must be a positive integer"
    expression: "!has(this.backup_id) || this.backup_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.disk_encryption.known"
    message: "disk_encryption must be one of: disabled, enabled"
    expression: "!has(this.disk_encryption) || this.disk_encryption != 0"
  };
  option (buf.validate.message).cel = {
    id: "instance_create.maintenance_policy.known"
    message: "maintenance_policy must be one of: linode/migrate, linode/power_off_on"
    expression: "!has(this.maintenance_policy) || this.maintenance_policy in ['linode/migrate','linode/power_off_on']"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The region where the instance will be created (e.g., 'us-east').
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The Linode plan type (e.g., 'g6-nanode-1').
  string type = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A label for the instance (optional).
  optional string label = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The image ID to deploy (e.g., 'linode/debian11'). Required for provisioned
  // instances.
  optional string image = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The root password for the instance. Required if image is provided.
  optional string root_pass = 6 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.preview_redact) = true
  ];
  // Cloud Firewall ID to attach to the public interface. Required under the
  // current Linode Interfaces generation. It travels inside the interfaces
  // element the tool synthesizes, and a caller who spells interfaces out
  // themselves places the firewall inside their own element instead.
  int32 firewall_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the public interface owns the IPv4 default route (optional,
  // default: true). Travels inside the synthesized interfaces element.
  optional bool route_ipv4 = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the public interface owns the IPv6 default route (optional,
  // default: true). Travels inside the synthesized interfaces element.
  optional bool route_ipv6 = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Enable backups for this instance (optional, default: false).
  optional bool backups_enabled = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // SSH public keys to install for the root user (optional). Requires an
  // image.
  repeated string authorized_keys = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether to boot the instance after creation (optional, defaults to true
  // when an image is provided).
  optional bool booted = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm instance creation. This operation incurs
  // billing charges. Ignored when dry_run=true.
  bool confirm = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Tags to apply to the new instance (optional).
  repeated string tags = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // StackScript to deploy with the image (optional).
  optional int32 stackscript_id = 16 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Answers to the StackScript's user-defined fields (optional).
  map<string, string> stackscript_data = 17 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Metadata the instance runs on first boot (optional).
  InstanceMetadataOptions metadata = 18 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Placement group to assign the new instance to (optional).
  InstancePlacementGroupAssignment placement_group = 19 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the instance's disks are encrypted at rest (optional).
  optional DiskEncryption.Value disk_encryption = 20 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Maintenance policy for the instance, such as linode/migrate (optional).
  optional string maintenance_policy = 21 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Linode usernames whose SSH keys to install for the root user (optional).
  // Requires an image.
  repeated string authorized_users = 22 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Existing IPv4 addresses to assign to the new instance (optional).
  repeated string ipv4 = 23 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Backup to restore onto the new instance (optional). Requires the backup's
  // own image rather than the image field.
  optional int32 backup_id = 24 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Size in MB of the boot disk the image is written to (optional). Defaults
  // to the rest of the plan's storage once swap is taken.
  optional int32 boot_size = 25 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Size in MB of the swap disk (optional, default: 512).
  optional int32 swap_size = 26 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Kernel the instance boots, such as linode/latest-64bit (optional).
  optional string kernel = 27 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the Network Helper rewrites the instance's network configuration
  // on boot (optional).
  optional bool network_helper = 28 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the instance gets a private IPv4 address (optional).
  optional bool private_ip = 29 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Display group (optional). Linode deprecated group in favor of tags; new
  // callers should send tags instead.
  optional string group = 31 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    deprecated = true
  ];
  // The interfaces the new instance is created with. Omit it and the tool
  // sends one public interface built from firewall_id, route_ipv4 and
  // route_ipv6, which is the only interface the flat arguments can describe.
  // Supply it and it travels verbatim: an element beside the caller's own
  // would attach networking they never asked for, so the flat arguments are
  // not read into it.
  repeated InstanceCreateInterface interfaces = 30 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_fold) = {
      source: [
        {
          argument: "firewall_id"
          key: "firewall_id"
        },
        {
          argument: "route_ipv4"
          key: "default_route.ipv4"
          absent: "true"
        },
        {
          argument: "route_ipv6"
          key: "default_route.ipv6"
          absent: "true"
        }
      ]
      constant: [
        {
          key: "public"
        }
      ]
    }
  ];
}

// InstanceBackupSchedule is the backups.schedule object an instance update
// carries. Separate from the Schedule read message above because a partial
// update needs the field presence a read shape has no reason to carry.
message InstanceBackupSchedule {
  // Day of the week the weekly backup window starts, e.g. Saturday.
  optional string day = 1;
  // Two-hour window the daily backup runs in, e.g. W22.
  optional string window = 2;
}

// InstanceBackupsUpdate is the backups object an instance update carries.
message InstanceBackupsUpdate {
  // Whether automatic backups are enabled for the instance.
  optional bool enabled = 1;
  // When the automatic backups run.
  optional InstanceBackupSchedule schedule = 2;
}

// InstanceUpdateInput is the input contract for linode_instance_update.
// instance_id and confirm are required. alerts is a free-form threshold object
// and tags is a string array, both optional.
message InstanceUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_update"
    method: "PUT"
    path: "/linode/instances/{instance_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates editable fields on a Linode instance. Pass dry_run=true to preview without updating.";
  option (linode.mcp.v1.error_message) = "instance {instance_id} update failed: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a Linode instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance {id} updated successfully";
  // The read is the instance the change is diffed against.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
  };

  option (buf.validate.message).cel = {
    id: "instance_update.instance_id.positive"
    message: "instance_id must be a positive integer"
    expression: "this.instance_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_update.maintenance_policy.known"
    message: "maintenance_policy must be one of: linode/migrate, linode/power_off_on"
    expression: "!has(this.maintenance_policy) || this.maintenance_policy in ['linode/migrate','linode/power_off_on']"
  };
  // An empty tags, alerts or ipv4 value counts as absent here, where the hand
  // handlers counted either as a field: CEL cannot tell an empty repeated
  // field from a missing one.
  option (buf.validate.message).cel = {
    id: "instance_update.any"
    message: "at least one update field is required: label, group, tags, alerts, maintenance_policy, watchdog_enabled, backups, or ipv4"
    expression: "has(this.label) || has(this.group) || size(this.tags) > 0 || size(this.alerts) > 0 || has(this.maintenance_policy) || has(this.watchdog_enabled) || has(this.backups) || size(this.ipv4) > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the instance to update (required).
  int32 instance_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New Linode label (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Group label (optional). Linode deprecated group in favor of tags; new
  // callers should send tags instead.
  optional string group = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    deprecated = true
  ];
  // Tags to assign to the Linode (optional).
  repeated string tags = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Alert threshold settings (optional).
  map<string, google.protobuf.Value> alerts = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Maintenance policy, such as linode/migrate (optional).
  optional string maintenance_policy = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the Lassie shutdown watchdog is enabled (optional).
  optional bool watchdog_enabled = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm the update. Ignored when dry_run=true.
  bool confirm = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Automatic backup settings for the Linode (optional).
  InstanceBackupsUpdate backups = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // IPv4 addresses assigned to the Linode (optional).
  repeated string ipv4 = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// InstanceDeleteInput is the input contract for linode_instance_delete, a
// two-stage destroy: instance_id and confirm are required, and mode/plan_id
// drive the plan/apply flow.
message InstanceDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_delete"
    method: "DELETE"
    path: "/linode/instances/{instance_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a Linode instance. WARNING: This action is irreversible and all data will be permanently lost. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive and irreversible. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance {instance_id} removed successfully";
  option (linode.mcp.v1.resource_type) = "Instance";
  // A replay would report a Linode the first attempt already removed as one that
  // never existed.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
  };
  // The walk reaches past the instance record for what the delete takes with
  // it: attached volumes, released IPs, firewall attachments, and the billing
  // change, none of which a descriptor describes.
  // Four walks in emission order (volumes detach, public addresses release,
  // firewall attachments drop, then the running warning), and the billing
  // estimate beside them.
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_instance_volume_list"
    slot_arguments: { read_slot: "linode_id", argument: "instance_id" }
    emit: {
      kind: "volume"
      id_field: "id"
      label_field: "label"
      action: "detached"
      note: "{size}GB volume stays; billing continues."
    }
    list_error_warning: "Could not list attached volumes: {error}"
  };
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_instance_ip_list"
    list_member: "ipv4.public"
    slot_arguments: { read_slot: "linode_id", argument: "instance_id" }
    emit: {
      kind: "public_ip"
      label_field: "address"
      action: "released"
    }
    list_error_warning: "Could not list IP addresses: {error}"
  };
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_instance_firewall_list"
    slot_arguments: { read_slot: "linode_id", argument: "instance_id" }
    emit: {
      kind: "firewall"
      id_field: "id"
      label_field: "label"
      action: "removed"
      note: "Firewall stays; this instance is removed from its device list."
    }
    list_error_warning: "Could not list firewalls: {error}"
  };
  option (linode.mcp.v1.dependency_walk) = {
    warnings: {
      template: "Instance is currently running. Delete will not pause for a graceful shutdown."
      when_field: "status"
      when_equals: "running"
    }
  };
  option (linode.mcp.v1.billing_delta) = {
    price_tool: "linode_type_get"
    type_field: "type"
    amount: "-{monthly:.2f}"
    sentence: "Instance billing stops. Attached volume billing continues."
    unknown_sentence: "Could not fetch type pricing for the estimate."
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to delete (required).
  int32 instance_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. This action is irreversible.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with
  // plan_id re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceCloneInput is the input contract for linode_instance_clone.
// linode_id and confirm are required.
message InstanceCloneInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_clone"
    method: "POST"
    path: "/linode/instances/{linode_id}/clone"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Clones a Linode instance. WARNING: This creates a billable resource.";
  option (linode.mcp.v1.error_message) = "Failed to clone instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This clones a Linode instance and creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Instance {linode_id} cloned as '{label}' (ID: {id}) in {region}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the source instance the clone copies. Its route spells the id
  // linode_id where the read spells it instance_id.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments: {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };

  option (buf.validate.message).cel = {
    id: "instance_clone.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_clone.target_linode_id.positive"
    message: "target_linode_id must be a positive integer"
    expression: "!has(this.target_linode_id) || this.target_linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_clone.maintenance_policy.known"
    message: "maintenance_policy must be one of: linode/migrate, linode/power_off_on"
    expression: "!has(this.maintenance_policy) || this.maintenance_policy in ['linode/migrate','linode/power_off_on']"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to clone (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Region for the cloned instance (optional, defaults to same region).
  optional string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Instance type for the clone (optional, defaults to same type).
  optional string type = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Label for the cloned instance (optional).
  optional string label = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Enable backups on the cloned instance (optional).
  optional bool backups_enabled = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Config profile IDs to clone (optional). Defaults to all configs when
  // omitted.
  repeated int32 configs = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Disk IDs to clone (optional). Defaults to all disks when omitted.
  repeated int32 disks = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm instance cloning. This creates a billable
  // resource. Ignored when dry_run=true.
  bool confirm = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Existing Linode to clone onto (optional). Omit to clone into a new
  // Linode. The route spells it linode_id in the body, where the path already
  // carries the Linode being copied.
  optional int32 target_linode_id = 11 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_name) = "linode_id"
  ];
  // Maintenance policy for the clone, such as linode/migrate (optional).
  optional string maintenance_policy = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Metadata the clone runs on first boot (optional).
  InstanceMetadataOptions metadata = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Placement group to assign the clone to (optional).
  InstancePlacementGroupAssignment placement_group = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the clone gets a private IPv4 address (optional).
  optional bool private_ip = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Display group for the clone (optional). Linode deprecated group in favor
  // of tags; new callers should send tags instead.
  optional string group = 16 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    deprecated = true
  ];
}

// InstanceMigrateInput is the input contract for linode_instance_migrate.
// linode_id and confirm are required.
message InstanceMigrateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_migrate"
    method: "POST"
    path: "/linode/instances/{linode_id}/migrate"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceMigrateWriteResponse";
  option (linode.mcp.v1.tool_description) = "Migrates a Linode instance to a new region. If no region is specified, Linode picks the destination.";
  option (linode.mcp.v1.error_message) = "Failed to migrate instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This migrates the instance and causes downtime during migration. Set confirm=true to proceed.";
  // The destination is reported by the region member beside this sentence
  // rather than inside it, since one template cannot say it two ways.
  option (linode.mcp.v1.success_message) = "Migration initiated for instance {linode_id}";
  // The preview reads the Linode whose region the migration would change, which
  // the action route spells linode_id and the read spells instance_id.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_get"
    slot_arguments: {
      read_slot: "instance_id"
      argument: "linode_id"
    }
  };
  // An omitted region is Linode picking the destination, and a read answering
  // no region leaves the origin out rather than naming an empty one.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Instance migrates from region {state:region} to {region}; it is unavailable during the migration."
    template: "Instance migrates to region {region}; it is unavailable during the migration."
    template: "Instance migrates; it is unavailable during the migration."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "instance_migrate.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "instance_migrate.type.known"
    message: "type must be one of: cold, warm"
    expression: "!has(this.type) || this.type != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance to migrate (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Target region for migration (optional, Linode picks if omitted).
  optional string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm migration. The instance will be shut down during
  // migration. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Placement group to move the instance into (optional).
  InstancePlacementGroupAssignment placement_group = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // How the move runs: 'cold' (default) powers the instance off, 'warm' keeps
  // it running. The resize route spells the same choice migration_type.
  optional InstanceMigrationType.Value type = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the move also upgrades the instance to the newest hardware
  // (optional, default: false).
  optional bool upgrade = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

