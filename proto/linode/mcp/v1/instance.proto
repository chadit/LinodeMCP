    path: "/linode/instances/{linode_id}/interfaces/{interface_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceInterfaceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates a network interface on a Linode instance. WARNING: This changes instance network configuration.";
  option (linode.mcp.v1.error_message) = "Failed to update interface {interface_id} on instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a network interface on the Linode instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Interface {interface_id} updated on instance {linode_id} successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the interface the change is diffed against.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_interface_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Interface {interface_id} on Linode {linode_id} will be updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Declared in the order the hand handler checked them: the ids, then whether
  // anything was sent, then each arm's own members, then the count of arms.
  option (buf.validate.message).cel = {
    id: "instance_interface_update.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_update.interface_id.positive"
    message: "interface_id must be a positive integer"
    expression: "this.interface_id >= 1"
  };
  // A field sent as an explicit null reaches this rule as an absent one, so a
  // body of nothing but nulls names no update.
  option (buf.validate.message).cel = {
    id: "instance_interface_update.fields.required"
    message: "at least one of default_route, public, vpc, or vlan is required"
    expression: "has(this.default_route) || has(this.public) || has(this.vlan) || has(this.vpc)"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_update.vpc.subnet_id.positive"
    message: "vpc.subnet_id must be a positive integer"
    expression: "!has(this.vpc) || this.vpc.subnet_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_interface_update.vlan.vlan_label.required"
    message: "vlan.vlan_label is required"
    expression: "!has(this.vlan) || this.vlan.vlan_label.matches('[^ \\t\\r\\n]')"
  };
  // An interface keeps the arm it was created with, so a call naming two of
  // them names no single interface. default_route travels on its own.
  option (buf.validate.message).cel = {
    id: "instance_interface_update.arm.at_most_one"
    message: "exactly one of public, vpc, or vlan is required"
    expression: "(has(this.public) ? 1 : 0) + (has(this.vpc) ? 1 : 0) + (has(this.vlan) ? 1 : 0) <= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the Linode interface (required).
  int32 interface_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Default route settings for the interface (optional).
  InterfaceDefaultRoute default_route = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Public interface settings. Set exactly one of public, vpc, or vlan
  // (optional).
  InterfacePublicConfig public = 5 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // VLAN interface settings. Set exactly one of public, vpc, or vlan
  // (optional).
  InterfaceVlanConfig vlan = 6 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // VPC interface settings. Set exactly one of public, vpc, or vlan (optional).
  InterfaceVpcConfig vpc = 7 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Must be true to confirm interface update. Ignored when dry_run=true.
  bool confirm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceInterfaceSettingsUpdateInput is the input contract for
