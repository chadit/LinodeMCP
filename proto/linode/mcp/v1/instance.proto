// InstanceTransferMonthGetInput is the input contract for
// linode_instance_transfer_month_get. All three fields are required.
message InstanceTransferMonthGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_transfer_month_get"
    method: "GET"
    path: "/linode/instances/{linode_id}/transfer/{year}/{month}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {
    category: TOOL_CATEGORY_COMPUTE_DEEP
    category: TOOL_CATEGORY_COMPUTE
  };
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceTransferMonth";
  option (linode.mcp.v1.tool_description) = "Retrieves network transfer statistics for a Linode instance for a specific month.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve transfer stats for instance {linode_id} in {year:04}-{month:02}: {error}";

  // The same window the stats route carries: the epoch floor and the four-digit
  // ceiling. Each rule holds its peace while an earlier argument is unusable,
  // which is the order the route has always refused a call in.
  option (buf.validate.message).cel = {
    id: "instance_transfer_month_get.year.range"
    message: "year must be an integer between 1970 and 9999"
    expression: "this.linode_id < 1 || (this.year >= 1970 && this.year <= 9999)"
  };
  option (buf.validate.message).cel = {
    id: "instance_transfer_month_get.month.range"
    message: "month must be an integer between 1 and 12"
    expression: "this.linode_id < 1 || this.year < 1970 || this.year > 9999 || (this.month >= 1 && this.month <= 12)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // The year for the transfer stats, from 1970 through 9999 (required).
  int32 year = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID,
    (linode.mcp.v1.reader_message) = {
      absent: "year must be an integer between 1970 and 9999"
      refused: "year must be an integer between 1970 and 9999"
    }
  ];
  // The month for the transfer stats, 1 through 12 (required).
  int32 month = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID,
    (linode.mcp.v1.reader_message) = {
      absent: "month must be an integer between 1 and 12"
      refused: "month must be an integer between 1 and 12"
    }
  ];
}

// InstanceConfigGetInput is the input contract for linode_instance_config_get.
message InstanceConfigGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_config_get"
    method: "GET"
    path: "/linode/instances/{linode_id}/configs/{config_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
