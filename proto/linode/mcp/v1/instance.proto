    message: "exactly one of public, vpc, or vlan is required"
    expression: "(has(this.public) ? 1 : 0) + (has(this.vpc) ? 1 : 0) + (has(this.vlan) ? 1 : 0) == 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Public interface settings. Set exactly one of public, vpc, or vlan.
  InterfacePublicConfig public = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // VPC interface settings. Set exactly one of public, vpc, or vlan.
  InterfaceVpcConfig vpc = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // VLAN interface settings. Set exactly one of public, vpc, or vlan.
  InterfaceVlanConfig vlan = 5 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Whether the new interface carries the default route for each address
