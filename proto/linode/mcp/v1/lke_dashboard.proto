syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// LKEDashboard is the Kubernetes dashboard URL for an LKE cluster.
message LKEDashboard {
  string url = 1;
}

// LKEDashboardGetInput is the input contract for linode_lke_dashboard_get.
message LKEDashboardGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_dashboard_get"
    method: "GET"
    path: "/lke/clusters/{cluster_id}/dashboard"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEDashboard";
  option (linode.mcp.v1.tool_description) = "Retrieves the Kubernetes dashboard URL for an LKE cluster";
  option (linode.mcp.v1.error_message) = "Failed to retrieve dashboard URL for cluster {cluster_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the LKE cluster (required).
  int32 cluster_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}
