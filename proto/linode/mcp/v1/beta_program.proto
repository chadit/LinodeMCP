syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// BetaProgram is one available Linode Beta program. description and ended are
// nullable (omitted when unset).
message BetaProgram {
  string class = 1;
  optional string description = 2;
  optional string ended = 3;
  bool greenlight_only = 4;
  string id = 5;
  string label = 6;
  string more_info = 7;
  string started = 8;
}

// BetaProgramListResponse is the {count, filter?, betas} envelope the
// linode_beta_list tool returns.
message BetaProgramListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated BetaProgram betas = 3;
}

// BetaGetInput is the input contract for linode_beta_get.
message BetaGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_beta_get"
    method: "GET"
    path: "/betas/{beta_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.BetaProgram";
  option (linode.mcp.v1.tool_description) = "Gets one available beta program.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve beta program {beta_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Beta program ID to retrieve (required).
  string beta_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_BETA_SLUG
  ];
}

// BetaListInput is the input contract for linode_beta_list.
message BetaListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_beta_list"
    method: "GET"
    path: "/betas"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.BetaProgramListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available beta programs.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
