syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// BetaProgram is one available Linode Beta program. description and ended are
// nullable (omitted when unset).
message BetaProgram {
  string class = 1;
  optional string description = 2;
  optional string ended = 3;
  bool greenlight_only = 4;
  string id = 5;
  string label = 6;
  string more_info = 7;
  string started = 8;
}

// BetaProgramListResponse is the {count, filter?, betas} envelope the
// linode_beta_list tool returns.
message BetaProgramListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated BetaProgram betas = 3;
}

// BetaGetInput is the input contract for linode_beta_get.
message BetaGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_beta_get"
    method: "GET"
    path: "/betas/{beta_id}"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1; // system param
  // The Beta program ID to retrieve (required).
  string beta_id = 2;
}

// BetaListInput is the input contract for linode_beta_list.
message BetaListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_beta_list"
    method: "GET"
    path: "/betas"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2;
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3;
}
