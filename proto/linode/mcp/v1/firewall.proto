}

// FirewallCreateInput is the input contract for linode_firewall_create.
message FirewallCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_create"
    method: "POST"
    path: "/networking/firewalls"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new Cloud Firewall. The firewall is created with no rules by default.";
  option (linode.mcp.v1.error_message) = "Failed to create firewall: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a Cloud Firewall. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Firewall '{label}' (ID: {id}) created successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The preview names the firewall and the policies it would start with; the
  // firewall does not exist yet, so there is no state to read. A policy the
  // caller omitted reports the value its own fold sends, which is why the
  // wording names the arguments rather than restating ACCEPT here.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new Cloud Firewall \"{label}\" will be created with inbound policy {inbound_policy} and outbound policy {outbound_policy}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "firewall_create.label.required"
    message: "label is required"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "firewall_create.inbound_policy.known"
    message: "inbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.inbound_policy) || this.inbound_policy != 0"
  };
  option (buf.validate.message).cel = {
    id: "firewall_create.outbound_policy.known"
    message: "outbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.outbound_policy) || this.outbound_policy != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // A label for the firewall (must be unique).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Default policy for inbound traffic: 'ACCEPT' or 'DROP' (optional,
  // default: 'ACCEPT').
  optional FirewallPolicy.Value inbound_policy = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Default policy for outbound traffic: 'ACCEPT' or 'DROP' (optional,
  // default: 'ACCEPT').
  optional FirewallPolicy.Value outbound_policy = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm firewall creation. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Tags to apply to the new firewall (optional).
  repeated string tags = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The ruleset the new firewall starts with: an object with inbound and
  // outbound arrays of rule objects plus optional inbound_policy and
  // outbound_policy. The API requires a rules object on create, and the tool
  // always sends one, so this stays optional in the schema: keys omitted here
  // fall back to the flat inbound_policy and outbound_policy fields above.
  // Without it a created firewall carries no rules at all, only default
  // policies. The item shape is free-form for the same reason
  // FirewallRulesUpdateInput keeps free-form rules: decoding through the
  // FirewallRule response type would pad every rule with fields the caller
  // never sent.
  map<string, google.protobuf.Value> rules = 8 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_fold) = {
      source: [
        {
          argument: "inbound_policy"
          key: "inbound_policy"
          absent: "ACCEPT"
        },
        {
          argument: "outbound_policy"
          key: "outbound_policy"
          absent: "ACCEPT"
        }
      ]
    }
  ];
  // Resources the new firewall is applied to: an object with linodes and
  // nodebalancers arrays of IDs (optional).
  map<string, google.protobuf.Value> devices = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// FirewallUpdateInput is the input contract for linode_firewall_update.
message FirewallUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_update"
    method: "PUT"
    path: "/networking/firewalls/{firewall_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates an existing Cloud Firewall. Can modify label, status, and default policies.";
  option (linode.mcp.v1.error_message) = "Failed to modify firewall {firewall_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a Cloud Firewall. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Firewall {firewall_id} modified successfully";
  // The read is the firewall, whose label and status the request alone does not
  // carry.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_firewall_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Label changes from \"{state:label}\" to \"{label}\"."
    template: "Label is set to \"{label}\"."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_unchanged) = {
    state: "label"
    argument: "label"
  };
  // Going disabled stops enforcement and going anything else starts it, which
  // is one line whose verb the value picks and no wording can interpolate.
  option (linode.mcp.v1.preview_sentence) = {
    matched_by: {
      argument: "status"
      arm: {
        equals: "disabled"
        wording: "Firewall status changes to \"{status}\"; this immediately stops enforcing its rules."
      }
      otherwise: "Firewall status changes to \"{status}\"; this immediately starts enforcing its rules."
    }
    line: PREVIEW_LINE_SIDE_EFFECT
    when_changed: {
      state: "status"
      argument: "status"
    }
  };

  // The derived path check answers an absent id in the sentence both hand
  // clients used. The policy pair is a rule instead: an
  // argument naming no member reaches the message as the enum's zero, which is
  // what these tell from an absent one.
  option (buf.validate.message).cel = {
    id: "firewall_update.inbound_policy.known"
    message: "inbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.inbound_policy) || this.inbound_policy != 0"
  };
  option (buf.validate.message).cel = {
    id: "firewall_update.outbound_policy.known"
    message: "outbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.outbound_policy) || this.outbound_policy != 0"
  };
  option (buf.validate.message).cel = {
    id: "firewall_update.status.known"
    message: "status must be one of: enabled, disabled"
    expression: "!has(this.status) || this.status in ['enabled','disabled']"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall to update.
  int32 firewall_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the firewall (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New status: 'enabled' or 'disabled' (optional).
  optional string status = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Default policy for inbound traffic: 'ACCEPT' or 'DROP' (optional).
  optional FirewallPolicy.Value inbound_policy = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Default policy for outbound traffic: 'ACCEPT' or 'DROP' (optional).
  optional FirewallPolicy.Value outbound_policy = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm firewall update. Ignored when dry_run=true.
  bool confirm = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Complete replacement set of tags (optional). Omitting it leaves the
  // firewall's tags unchanged; an empty list removes all of them.
  repeated string tags = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The API reads both default policies inside `rules`, so the two flat
  // arguments travel one level down or it never sees them. omit_when_empty is
  // what keeps a label-only update from sending `rules` at all: this route
  // reads that member as a replacement, unlike the create's, which needs the
  // defaults on every call.
  map<string, google.protobuf.Value> rules = 10 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_fold) = {
      source: [
        {
          argument: "inbound_policy"
          key: "inbound_policy"
        },
        {
          argument: "outbound_policy"
          key: "outbound_policy"
        }
      ]
      omit_when_empty: true
    }
  ];
}

// FirewallDeleteInput is the input contract for linode_firewall_delete.
message FirewallDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_delete"
    method: "DELETE"
    path: "/networking/firewalls/{firewall_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a Cloud Firewall. WARNING: This will remove all firewall rules and unassign all attached devices. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "Firewall";
  option (linode.mcp.v1.success_message) = "Firewall {firewall_id} removed successfully";
  // A replay would report a firewall the first attempt already removed as one
  // that never existed.
  option (linode.mcp.v1.retry_disabled) = true;
  // The walk lists the devices the firewall guards, so a caller sees what
  // stops being protected.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_firewall_get"
  };
  option (linode.mcp.v1.dependency_walk) = {
    list_tool: "linode_firewall_device_list"
    emit: {
      kind_field: "entity.type"
      id_field: "entity.id"
      label_field: "entity.label"
      action: "removed"
      note: "Loses this firewall's rules when the firewall is deleted."
    }
    warnings: {
      template: "{count} resource(s) currently use this firewall and will lose its rules."
      when_any: true
    }
    list_error_warning: "Could not list firewall devices: {error}"
  };

  option (buf.validate.message).cel = {
    id: "firewall_delete.firewall_id.positive"
    message: "firewall_id must be a positive integer"
    expression: "this.firewall_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall to delete.
  int32 firewall_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// FirewallSettingsGetInput is the input contract for
