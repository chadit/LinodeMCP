// InstanceFirewallUpdateInput is the input contract for
// linode_instance_firewall_update. linode_id and confirm are required in the
// generated schema. firewall_ids is required at the handler level but a
// repeated field is never emitted into the generated required set, so its
// required flag is dropped from the advertised schema (runtime still enforces
// presence).
message InstanceFirewallUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_firewall_update"
    method: "PUT"
    path: "/linode/instances/{linode_id}/firewalls"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallListResponse";
  option (linode.mcp.v1.tool_description) = "Replaces the Cloud Firewall assignments for a Linode instance. Pass an empty firewall_ids list to remove all assignments.";
  option (linode.mcp.v1.error_message) = "Failed to update firewall assignments for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This replaces firewall assignments for a Linode instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;
  // The assignments the replacement overwrites are the state, envelope and
  // all, read on the page this call itself publishes so the preview and the
  // answer describe one page.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_firewall_list"
    envelope_state: true
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Firewall assignments for Linode {linode_id} will be replaced."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Entry positivity is all a rule can see of firewall_ids: a list the caller
  // omitted arrives here as the empty one, which passes vacuously.
  option (buf.validate.message).cel = {
    id: "instance_firewall_update.firewall_ids.positive"
    message: "firewall_ids entries must be positive integers"
    expression: "this.firewall_ids.all(f, f >= 1)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Complete list of firewall IDs to assign to the Linode. Use an empty list
  // to remove all firewall assignments.
  repeated int32 firewall_ids = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Must be set to true to confirm firewall assignment changes. Ignored when
  // dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// FirewallDefaultIDs holds the default firewall assignments by resource type:
// the firewall applied to new Linodes, NodeBalancers, public interfaces, and
// VPC interfaces.
message FirewallDefaultIDs {
  int32 linode = 1;
  int32 nodebalancer = 2;
  int32 public_interface = 3;
  int32 vpc_interface = 4;
}

// FirewallSettings mirrors the account-wide default Cloud Firewall assignments.
message FirewallSettings {
  FirewallDefaultIDs default_firewall_ids = 1;
}

// FirewallSettingsWriteResponse is the {message, settings} envelope the
// linode_firewall_settings_update tool returns: a confirmation string plus the
// full default-assignments element the API returned.
message FirewallSettingsWriteResponse {
  string message = 1;
  FirewallSettings settings = 2;
}

// FirewallDeleteResponse is the id-echo envelope linode_firewall_delete
// returns: a confirmation message plus the deleted firewall's ID. The delete
// endpoint returns an empty body, so the id echo confirms the target.
message FirewallDeleteResponse {
  string message = 1;
  int32 firewall_id = 2;
}
