// FirewallRulesUpdateInput is the input contract for
// linode_firewall_rules_update. inbound and outbound are required at the handler
// level, but a repeated field is never emitted into the generated required set,
// so their required flags are dropped from the advertised schema (runtime still
// enforces presence). The hand-built schema advertised bare arrays with no item
// shape, so each is a repeated free-form firewall-rule object.
message FirewallRulesUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_rules_update"
    method: "PUT"
    path: "/networking/firewalls/{firewall_id}/rules"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallRulesWriteResponse";
  option (linode.mcp.v1.tool_description) = "Replaces inbound and outbound rules for a Cloud Firewall.";
  option (linode.mcp.v1.error_message) = "Failed to update firewall {firewall_id} rules: {error}";
  option (linode.mcp.v1.confirm_message) = "This replaces Cloud Firewall rules. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Firewall {firewall_id} rules updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the ruleset the replacement overwrites.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_firewall_rules_get"
  };

  // The path id is checked first, then the optional policies.
  option (buf.validate.message).cel = {
    id: "firewall_rules_update.firewall_id.positive"
    message: "firewall_id must be a positive integer"
    expression: "this.firewall_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "firewall_rules_update.inbound_policy.known"
    message: "inbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.inbound_policy) || this.inbound_policy != 0"
  };
  option (buf.validate.message).cel = {
    id: "firewall_rules_update.outbound_policy.known"
    message: "outbound_policy must be one of: ACCEPT, DROP"
    expression: "!has(this.outbound_policy) || this.outbound_policy != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall whose rules should be replaced.
  int32 firewall_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Array of inbound firewall rule objects. An empty list legally clears the
  // direction, so only the argument map can tell it from an omitted one.
  repeated google.protobuf.Struct inbound = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Array of outbound firewall rule objects.
  repeated google.protobuf.Struct outbound = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Must be set to true to confirm replacing firewall rules. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Default policy for traffic no inbound rule matches: 'ACCEPT' or 'DROP'
  // (optional). Omitting it leaves the firewall's current inbound policy alone.
  optional FirewallPolicy.Value inbound_policy = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Default policy for traffic no outbound rule matches: 'ACCEPT' or 'DROP'
  // (optional). Omitting it leaves the firewall's current outbound policy
  // alone.
  optional FirewallPolicy.Value outbound_policy = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// FirewallSettingsUpdateInput is the input contract for
// linode_firewall_settings_update. default_firewall_ids is required at the
// handler level, but a map field is never emitted into the generated required
// set, so its required flag is dropped from the advertised schema (runtime still
// enforces presence). It is keyed by linode, nodebalancer, public_interface, or
// vpc_interface with positive-int firewall IDs.
message FirewallSettingsUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_settings_update"
    method: "PUT"
    path: "/networking/firewalls/settings"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallSettingsWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates default Cloud Firewall assignments for Linodes, NodeBalancers, public interfaces, and VPC interfaces.";
  option (linode.mcp.v1.error_message) = "Failed to update default firewall settings: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates default Cloud Firewall assignments. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Default firewall settings updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the assignments the update replaces.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_firewall_settings_get"
  };

  // default_firewall_ids is a map, so no rule can see whether the caller sent
  // one, and each refusal names the key it is about. Neither is something CEL
  // over a google.protobuf.Value map can say.
  option (linode.mcp.v1.object_walk) = {
    field: "default_firewall_ids"
    absent: "default_firewall_ids is required"
    unusable: "default_firewall_ids must be a non-empty object"
    empty: "default_firewall_ids must be a non-empty object"
    members: {
      unknown: "{field} contains unsupported key: {key}"
      key: ["linode", "nodebalancer", "public_interface", "vpc_interface"]
      value: {
        kind: VALUE_KIND_INT
        minimum: 1
        unusable: "{field}.{key} must be a positive integer"
      }
    }
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Object of positive firewall IDs keyed by linode, nodebalancer,
  // public_interface, or vpc_interface.
  map<string, google.protobuf.Value> default_firewall_ids = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm default firewall settings update. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

