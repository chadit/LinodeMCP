// FirewallRuleVersionListInput is the input contract for
// linode_firewall_rule_version_list.
message FirewallRuleVersionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_rule_version_list"
    method: "GET"
    path: "/networking/firewalls/{firewall_id}/history"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallRuleVersionListResponse";
  // The route answers one firewall-shaped object whose version sits inside its
  // rules, and the shared FirewallRules message declares no version. Without
  // the hoist the snapshot answers version 0, which reads as a real one.
  option (linode.mcp.v1.list_envelope) = {
    shape: SHAPE_SINGLETON
    lift: {
      member: "version"
      source: "rules.version"
    }
  };
  option (linode.mcp.v1.tool_description) = "Retrieves the rule-version history payload for a Cloud Firewall.";
  option (buf.validate.message).cel = {
