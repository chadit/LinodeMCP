syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// Resolver is the DNS resolver block nested in a Region.
message Resolver {
  string ipv4 = 1;
  string ipv6 = 2;
}

// Region mirrors a Linode region (datacenter). capabilities is repeated (emitted
// as []).
message Region {
  string id = 1;
  string label = 2;
  string country = 3;
  repeated string capabilities = 4;
  string status = 5;
  Resolver resolvers = 6;
  string site_type = 7;
}

// RegionListResponse is the envelope linode_region_list returns: a count, an
// optional echoed filter, and the full proto Region elements.
message RegionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Region regions = 3;
}

// RegionGetInput is the input contract for linode_region_get.
message RegionGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_region_get"
    method: "GET"
    path: "/regions/{region_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.Region";
  option (linode.mcp.v1.tool_description) = "Gets one Linode region by region ID";
  option (linode.mcp.v1.error_message) = "Failed to retrieve region {region_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the region to retrieve, such as us-east (required).
  string region_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_REGION_SLUG
  ];
}

// RegionListInput is the input contract for linode_region_list. Both filters
// are client-side.
message RegionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_region_list"
    method: "GET"
    path: "/regions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.RegionListResponse";
  option (linode.mcp.v1.tool_description) = "Lists all available Linode regions (datacenters) with optional filtering by country or capabilities";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter regions by country code (e.g., 'us', 'de', 'jp').
  optional string country = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter regions by capability (e.g., 'Linodes', 'Block Storage', 'GPU
  // Linodes').
  optional string capability = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY,
    (linode.mcp.v1.list_filter) = {
      match: MATCH_MEMBER
      field: "capabilities"
    }
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// RegionAvailabilityListInput is the input contract for
// linode_region_availability_list.
message RegionAvailabilityListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_region_availability_list"
    method: "GET"
    path: "/regions/availability"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.RegionAvailabilityListResponse";
  option (linode.mcp.v1.tool_description) = "Lists compute instance type availability across Linode regions";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// RegionAvailabilityGetInput is the input contract for
// linode_region_availability_get.
message RegionAvailabilityGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_region_availability_get"
    method: "GET"
    path: "/regions/{region_id}/availability"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.RegionAvailabilityListResponse";
  option (linode.mcp.v1.tool_description) = "Lists compute instance type availability for a Linode region";
  option (linode.mcp.v1.list_envelope) = {shape: SHAPE_BARE};
  option (linode.mcp.v1.error_message) = "Failed to retrieve availability for region {region_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region slug to inspect, for example 'us-east'.
  string region_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_REGION_SLUG
  ];
}

// RegionAvailability mirrors a single compute-type availability entry for a
// region: whether a given plan is available in that region.
message RegionAvailability {
  string region = 1;
  string plan = 2;
  bool available = 3;
}

// RegionAvailabilityListResponse is the linode_region_availability_list envelope:
// count and the full proto RegionAvailability elements. The tool has no filter
// params, so filter is omitted.
message RegionAvailabilityListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated RegionAvailability region_availabilities = 3;
}
