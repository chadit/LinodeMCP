syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/options.proto";

// LKEVersion is one Kubernetes version available for LKE.
message LKEVersion {
  string id = 1;
}

// LKEVersionListResponse is the {count, filter?, versions} envelope the
// linode_lke_version_list tool returns.
message LKEVersionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated LKEVersion versions = 3;
}

// LKEVersionGetInput is the input contract for linode_lke_version_get.
message LKEVersionGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_version_get"
    method: "GET"
    path: "/lke/versions/{version}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEVersion";
  option (linode.mcp.v1.tool_description) = "Retrieves details of a specific Kubernetes version available for LKE";
  option (linode.mcp.v1.error_message) = "Failed to retrieve LKE version '{version}': {error}";

  // The version is spliced into the path, so anything that would escape its
  // segment is refused before the call is made.
  option (buf.validate.message).cel = {
    id: "lke_version_get.version.required"
    message: "version is required"
    expression: "this.version != ''"
  };
  option (buf.validate.message).cel = {
    id: "lke_version_get.version.path_safe"
    message: "version must be a Kubernetes version ID"
    expression: "!this.version.contains('/') && !this.version.contains('?') && !this.version.contains('..')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Kubernetes version ID (required).
  string version = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// LKEVersionListInput is the input contract for linode_lke_version_list.
message LKEVersionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_version_list"
    method: "GET"
    path: "/lke/versions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKEVersionListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available Kubernetes versions for LKE clusters";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
