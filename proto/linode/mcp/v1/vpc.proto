syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// Vpc mirrors the Linode Virtual Private Cloud object. Field order and JSON names
// match what both implementations emit today.
message Vpc {
  int32 id = 1;
  string label = 2;
  string description = 3;
  string region = 4;
  repeated VpcSubnet subnets = 5;
  string created = 6;
  string updated = 7;
}

// VpcSubnet is a subnet within a VPC.
message VpcSubnet {
  int32 id = 1;
  string label = 2;
  string ipv4 = 3;
  repeated VpcSubnetLinode linodes = 4;
  string created = 5;
  string updated = 6;
}

// VpcSubnetLinode is a Linode assigned to a VPC subnet.
message VpcSubnetLinode {
  int32 id = 1;
  repeated VpcSubnetLinodeInterface interfaces = 2;
}

// VpcSubnetLinodeInterface is a network interface on a Linode within a subnet.
message VpcSubnetLinodeInterface {
  int32 id = 1;
  bool active = 2;
  int32 config_id = 3;
}

// VpcListResponse is the envelope linode_vpc_list returns: a count, an optional
// echoed filter, and the full proto Vpc elements.
message VpcListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Vpc vpcs = 3;
}

// VpcWriteResponse is the {message, vpc} envelope the VPC write tools (create,
// update) return.
message VpcWriteResponse {
  string message = 1;
  Vpc vpc = 2;
}

// VpcDeleteResponse is the id-echo envelope linode_vpc_delete returns: a
// confirmation message plus the deleted VPC's ID. The delete endpoint returns
// an empty body, so the id echo confirms the target.
message VpcDeleteResponse {
  string message = 1;
  int32 vpc_id = 2;
}

// VpcGetInput is the input contract for linode_vpc_get.
message VpcGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_get"
    method: "GET"
    path: "/vpcs/{vpc_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.Vpc";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC to retrieve (required).
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// VpcSubnetWriteResponse is the {message, subnet} envelope the VPC subnet write
// tools (create, update) return.
message VpcSubnetWriteResponse {
  string message = 1;
  VpcSubnet subnet = 2;
}

// VpcSubnetListResponse is the envelope linode_vpc_subnet_list returns: a count,
// an optional echoed filter, and the full proto VpcSubnet elements for a VPC.
message VpcSubnetListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated VpcSubnet subnets = 3;
}

// VpcSubnetGetInput is the input contract for linode_vpc_subnet_get.
message VpcSubnetGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_subnet_get"
    method: "GET"
    path: "/vpcs/{vpc_id}/subnets/{subnet_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcSubnet";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC (required).
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the subnet to retrieve (required).
  int32 subnet_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// VPCIP mirrors one IP address associated with a VPC, from GET /vpcs/ips and
// GET /vpcs/{vpc_id}/ips. The nullable fields (address, address_range,
// linode_id, config_id, gateway, prefix) are optional and omitted when the API
// returns null.
message VPCIP {
  optional string address = 1;
  optional string address_range = 2;
  int32 vpc_id = 3;
  int32 subnet_id = 4;
  string region = 5;
  optional int32 linode_id = 6;
  optional int32 config_id = 7;
  int32 interface_id = 8;
  bool active = 9;
  string nat_1_1 = 10;
  optional string gateway = 11;
  optional int32 prefix = 12;
  string subnet_mask = 13;
}

// VPCIPListResponse is the envelope linode_vpc_ip_all_list and
// linode_vpc_ip_list return: a count, an optional echoed filter, and the full
// proto VPCIP elements. Neither tool filters, so filter is omitted.
message VPCIPListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated VPCIP ips = 3;
}

// VpcSubnetDeleteResponse is the id-echo envelope linode_vpc_subnet_delete
// returns: a confirmation message plus the parent VPC and deleted subnet IDs.
// The delete endpoint returns an empty body, so the echo confirms the target.
message VpcSubnetDeleteResponse {
  string message = 1;
  int32 vpc_id = 2;
  int32 subnet_id = 3;
}

// VpcListInput is the input contract for linode_vpc_list.
message VpcListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_list"
    method: "GET"
    path: "/vpcs"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter VPCs by label containing this string (case-insensitive).
  optional string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter VPCs by region (exact match, case-insensitive).
  optional string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// VpcSubnetCreateItem is one entry in a linode_vpc_create request's subnets
// array: an initial subnet given by its label and IPv4 CIDR range. It carries
// the same fields the create-subnet request body uses (label, ipv4).
message VpcSubnetCreateItem {
  // Label for the subnet.
  string label = 1;
  // IPv4 range for the subnet in CIDR notation (e.g. 10.0.0.0/24).
  string ipv4 = 2;
}

// VpcCreateInput is the input contract for linode_vpc_create. subnets is an
// OPTIONAL array, so it is not required and the named item message preserves
// the advertised {label, ipv4} item shape.
message VpcCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_create"
    method: "POST"
    path: "/vpcs"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This creates a billable VPC resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "VPC '{label}' (ID: {id}) created in {region}";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the VPC (1-64 characters).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region for the VPC (e.g. us-east). Use linode_region_list to find valid
  // values.
  string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Description for the VPC (optional).
  optional string description = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Initial subnets to create with the VPC, each {label, ipv4} (optional).
  repeated VpcSubnetCreateItem subnets = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm VPC creation. This creates a billable resource.
  // Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VpcUpdateInput is the input contract for linode_vpc_update.
message VpcUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_update"
    method: "PUT"
    path: "/vpcs/{vpc_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This modifies the VPC configuration. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "VPC {vpc_id} modified successfully";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC to update.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the VPC (optional).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New description for the VPC (optional).
  optional string description = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm VPC update. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VpcDeleteInput is the input contract for linode_vpc_delete.
message VpcDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_delete"
    method: "DELETE"
    path: "/vpcs/{vpc_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This is irreversible. All subnets in the VPC will also be deleted. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "VPC";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC to delete.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm deletion. This action is irreversible and deletes
  // all subnets. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VPCIPAllListInput is the input contract for linode_vpc_ip_all_list.
message VPCIPAllListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_ip_all_list"
    method: "GET"
    path: "/vpcs/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VPCIPListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// VPCIPListInput is the input contract for linode_vpc_ip_list.
message VPCIPListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_ip_list"
    method: "GET"
    path: "/vpcs/{vpc_id}/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VPCIPListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// VpcSubnetListInput is the input contract for linode_vpc_subnet_list.
message VpcSubnetListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_subnet_list"
    method: "GET"
    path: "/vpcs/{vpc_id}/subnets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcSubnetListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// VpcSubnetCreateInput is the input contract for linode_vpc_subnet_create.
message VpcSubnetCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_subnet_create"
    method: "POST"
    path: "/vpcs/{vpc_id}/subnets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcSubnetWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This creates a new subnet in the VPC. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Subnet '{label}' (ID: {id}) created in VPC {vpc_id}";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC to add the subnet to.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Label for the subnet.
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // IPv4 range for the subnet in CIDR notation (e.g. 10.0.0.0/24).
  string ipv4 = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm subnet creation. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VpcSubnetUpdateInput is the input contract for linode_vpc_subnet_update.
message VpcSubnetUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_subnet_update"
    method: "PUT"
    path: "/vpcs/{vpc_id}/subnets/{subnet_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcSubnetWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This modifies the subnet configuration. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Subnet {subnet_id} in VPC {vpc_id} modified successfully";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC containing the subnet.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the subnet to update.
  int32 subnet_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the subnet.
  string label = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm subnet update. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VpcSubnetDeleteInput is the input contract for linode_vpc_subnet_delete.
message VpcSubnetDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_vpc_subnet_delete"
    method: "DELETE"
    path: "/vpcs/{vpc_id}/subnets/{subnet_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VpcSubnetDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This is irreversible. The subnet will be permanently deleted. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "VPCSubnet";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the VPC containing the subnet.
  int32 vpc_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the subnet to delete.
  int32 subnet_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm subnet deletion. This action is irreversible.
  // Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
