  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// IPv6RangeGetInput is the input contract for linode_ipv6_range_get.
message IPv6RangeGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_ipv6_range_get"
    method: "GET"
    path: "/networking/ipv6/ranges/{range}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPv6Range";
  option (linode.mcp.v1.tool_description) = "Gets one IPv6 range by CIDR prefix.";
  // Trimmed before the prefix is parsed, which both languages have always
  // done: the parser would refuse a padded range the caller spelled right.
  option (linode.mcp.v1.normalize_fields) = {
    field: "range"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  option (linode.mcp.v1.error_message) = "Failed to retrieve IPv6 range: {error}";

  // Normalize has trimmed the prefix already, so a value failing these is one
  // the caller spelled wrong rather than one that arrived padded.
  option (buf.validate.message).cel = {
    id: "ipv6_range_get.range.non_blank"
    message: "range must be a non-empty string"
    expression: "this.range.matches('[^ \\t\\r\\n]')"
  };
  // isIpPrefix(6, true) is the masked check both hand clients made: an explicit
  // /bits suffix, an IPv6 network, and no host bits set below the length.
  option (buf.validate.message).cel = {
    id: "ipv6_range_get.range.prefix"
    message: "range must be a valid IPv6 prefix"
    expression: "this.range.isIpPrefix(6, true)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // IPv6 range prefix, for example 2001:0db8::/64.
  string range = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// IPv6RangeCreateInput is the input contract for linode_ipv6_range_create.
message IPv6RangeCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_ipv6_range_create"
    method: "POST"
    path: "/networking/ipv6/ranges"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPv6RangeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates an IPv6 range. WARNING: This changes networking configuration and may affect routing.";
  option (linode.mcp.v1.error_message) = "Failed to create IPv6 range: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates an IPv6 range and changes networking configuration. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IPv6 range created";
  option (linode.mcp.v1.retry_disabled) = true;
  // The prefix length and where the range would be routed. The two targets are
  // mutually exclusive, which the argument checks have already held.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new IPv6 range with prefix length /{prefix_length} will be allocated and routed to {route_target}."
    template: "A new IPv6 range with prefix length /{prefix_length} will be allocated and routed to instance {linode_id}."
    template: "A new IPv6 range with prefix length /{prefix_length} will be allocated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Fail-fast runs these in the order they are written, which is the order the
  // hand builders checked in: each argument on its own first, then the pair.
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.prefix_length.choice"
    message: "prefix_length must be 56 or 64"
    expression: "this.prefix_length == 56 || this.prefix_length == 64"
  };
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "!has(this.linode_id) || this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.route_target.non_blank"
    message: "route_target must be a non-empty string"
    expression: "!has(this.route_target) || this.route_target.matches('[^ \\t\\r\\n]')"
  };
  // isIp(6) permits an RFC 6874 zone id and the API routes to no interface of
  // this server's, so the zone is refused here rather than sent: '%' appears in
  // an IPv6 literal for nothing else.
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.route_target.address"
    message: "route_target must be a valid IPv6 address"
    expression: "!has(this.route_target) || (this.route_target.isIp(6) && !this.route_target.contains('%'))"
  };
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.target.present"
    message: "linode_id or route_target is required"
    expression: "has(this.linode_id) || has(this.route_target)"
  };
  option (buf.validate.message).cel = {
    id: "ipv6_range_create.target.exclusive"
    message: "linode_id and route_target are mutually exclusive"
    expression: "!has(this.linode_id) || !has(this.route_target)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The IPv6 prefix length for the created range: 56 or 64.
  int32 prefix_length = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional Linode ID to assign the new range to.
  optional int32 linode_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional route target for the new IPv6 range.
  optional string route_target = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm IPv6 range creation. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// IPv6RangeDeleteInput is the input contract for linode_ipv6_range_delete.
message IPv6RangeDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_ipv6_range_delete"
    method: "DELETE"
    path: "/networking/ipv6/ranges/{range}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPv6RangeDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes an IPv6 range. WARNING: This changes networking configuration and may affect routing. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This deletes an IPv6 range and changes networking configuration. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IPv6 range deleted";
  option (linode.mcp.v1.resource_type) = "IPv6Range";
  // Go's client has never replayed this DELETE while Python's did. Declaring it
  // here is what makes the two answer a transport failure the same way, and a
  // delete is the direction where not replaying is the safe half.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the range itself, which the preview reports and a two-stage
  // plan hashes for drift.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_ipv6_range_get"
  };

  // Fail-fast runs these in order, so the presence sentence has to come first:
  // the prefix rule below would otherwise answer for an absent range.
  option (buf.validate.message).cel = {
    id: "ipv6_range_delete.range.present"
    message: "range is required"
    expression: "this.range.matches('[^ \\t\\r\\n]')"
  };
  // isIpPrefix(6, true) is the masked check both hand clients made: an IPv6
  // network whose bits below the prefix length are all zero.
  option (buf.validate.message).cel = {
    id: "ipv6_range_delete.range.prefix"
    message: "range must be a valid IPv6 prefix"
    expression: "this.range.isIpPrefix(6, true)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // IPv6 range prefix, for example 2001:0db8::/64.
  string range = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm IPv6 range deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceIPDeleteResponse is the id-echo envelope linode_instance_ip_delete
// returns: a confirmation message plus the parent instance ID and the removed
// address. The delete endpoint returns an empty body, so the echo confirms the
// target.
message InstanceIPDeleteResponse {
  string message = 1;
  int32 linode_id = 2;
  string address = 3;
}

// IPv6SLAAC mirrors a Linode instance's SLAAC or link-local IPv6 address.
message IPv6SLAAC {
  string address = 1;
  string gateway = 2;
  string subnet_mask = 3;
  int32 prefix = 4;
  string type = 5;
  string rdns = 6;
  string region = 7;
}

// InstanceIPv4 holds the IPv4 address categories for a Linode instance: the
// public, private, shared, and reserved address lists.
message InstanceIPv4 {
  repeated IPAddress public = 1;
  repeated IPAddress private = 2;
  repeated IPAddress shared = 3;
  repeated IPAddress reserved = 4;
}

// InstanceIPv6 holds a Linode instance's IPv6 addresses: the SLAAC and
// link-local addresses (nullable, omitted when unset) plus the global, range,
// and pool lists. ranges and pools are omitted by the API when empty.
message InstanceIPv6 {
  IPv6SLAAC slaac = 1;
  IPv6SLAAC link_local = 2;
  repeated IPv6Range global = 3;
  repeated IPv6Range ranges = 4;
  repeated IPv6Range pools = 5;
}

// InstanceIPsResponse is the linode_instance_ip_list response: the full IPv4 and
// IPv6 address configuration for one Linode instance. The endpoint returns a
// nested object (not a {count, key} list envelope), so this models the whole
// structure rather than a flat repeated field. ipv4 and ipv6 are nullable
// (omitted when the API does not return them).
message InstanceIPsResponse {
  InstanceIPv4 ipv4 = 1;
  InstanceIPv6 ipv6 = 2;
}

// IPAddressGetInput is the input contract for linode_networking_ip_get.
message IPAddressGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_ip_get"
    method: "GET"
    path: "/networking/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPAddress";
  option (linode.mcp.v1.tool_description) = "Gets details for one account-level IP address.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve networking IP {address}: {error}";

  // The account route names a non-string and a blank address together, where
  // its instance sibling reads both as absent.
  option (buf.validate.message).cel = {
    id: "networking_ip_get.address.non_blank"
    message: "address must be a non-empty string"
    expression: "this.address.matches('(?s)^.*\\\\S.*$')"
  };
  // isIp permits an RFC 6874 zone id, which names an interface on the caller's
  // host and addresses nothing on the account, so it is refused alongside.
  option (buf.validate.message).cel = {
    id: "networking_ip_get.address.ip"
    message: "address must be a valid IP address"
    expression: "this.address.isIp() && !this.address.contains('%')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The IP address to retrieve (required).
  string address = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

