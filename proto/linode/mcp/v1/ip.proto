syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// InstanceIPType is the address family requested by the IP allocate tools
// (linode_instance_ip_allocate and linode_networking_ip_allocate). Values are
// the exact lowercase Linode API strings authored from the live OpenAPI spec.
// See the enum-wrapper convention in nodebalancer_config.proto. Only the
// allocate INPUT type is this enum; the IPAddress.type read field stays a plain
// string because the API returns richer values there (ipv4/public, ipv6/range,
// and so on).
message InstanceIPType {
  enum Value {
    unspecified = 0;
    // The allocate endpoints (POST .../ips, POST /networking/ips) accept only
    // ipv4; ipv6 is assigned via ranges, not allocation. The old code accepted
    // ipv6 here (rejected downstream by the API); the sync-enums gate caught it.
    ipv4 = 1;
  }
}

// IPAddress mirrors a Linode networking IP address. vpc_nat_1_1 is nullable
// (omitted when unset).
message IPAddress {
  string address = 1;
  string gateway = 2;
  string subnet_mask = 3;
  int32 prefix = 4;
  string type = 5;
  bool public = 6;
  string rdns = 7;
  int32 linode_id = 8;
  string region = 9;
  optional string vpc_nat_1_1 = 10;
}

// IPAddressWriteResponse is the {message, ip} envelope the networking IP update
// and allocate tools return.
message IPAddressWriteResponse {
  string message = 1;
  IPAddress ip = 2;
}

// IPAssignment is one address-to-Linode binding in an IP assign request: the IP
// address and the Linode that receives it.
message IPAssignment {
  string address = 1;
  int32 linode_id = 2;
}

// NetworkingIPShareWriteResponse is the {message, linode_id, ips} echo the IP
// share tools return. The share endpoint returns an opaque body, so the echo
// reports the primary Linode and the shared address list from the request.
message NetworkingIPShareWriteResponse {
  string message = 1;
  int32 linode_id = 2;
  repeated string ips = 3;
}

// NetworkingIPAssignWriteResponse is the {message, region, assignments} echo the
// IP assign tools return. The assign endpoint returns an opaque body, so the
// echo reports the region and the assignment list from the request.
message NetworkingIPAssignWriteResponse {
  string message = 1;
  string region = 2;
  repeated IPAssignment assignments = 3;
}

// NetworkingIPListResponse is the linode_networking_ip_list envelope: count and
// the full proto IPAddress elements. The tool has no page/page_size or filter
// param (only skip_ipv6_rdns), so filter is omitted.
message NetworkingIPListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated IPAddress ips = 3;
}

// IPv6Pool mirrors an IPv6 pool on the account: a CIDR range, its region, and
// the prefix length.
message IPv6Pool {
  string range = 1;
  string region = 2;
  int32 prefix = 3;
}

// IPv6PoolListResponse is the linode_ipv6_pool_list envelope: count and the full
// proto IPv6Pool elements. The tool paginates and has no filter param, so filter
// is omitted.
message IPv6PoolListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated IPv6Pool ipv6_pools = 3;
}

// IPv6Range mirrors an IPv6 range on the account. The list element carries
// range, region, prefix, and the route target it forwards to; the single-range
// detail GET drops route_target and instead reports is_bgp and the Linode IDs
// the range is bound to. The two shapes share this one message: route_target is
// implicit-presence so it serializes as "" on the detail GET, is_bgp is optional
// so a genuine false still serializes, and linodes is repeated so the list
// element emits it as [].
message IPv6Range {
  string range = 1;
  string region = 2;
  int32 prefix = 3;
  string route_target = 4;
  optional bool is_bgp = 5;
  repeated int32 linodes = 6;
}

// IPv6RangeListResponse is the linode_ipv6_range_list envelope: count and the
// full proto IPv6Range elements. The tool paginates and has no filter param, so
// filter is omitted.
message IPv6RangeListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated IPv6Range ipv6_ranges = 3;
}

// IPv6RangeWriteResponse is the {message, range} envelope the
// linode_ipv6_range_create tool returns: a confirmation string plus the full
// IPv6Range element the API returned.
message IPv6RangeWriteResponse {
  string message = 1;
  IPv6Range range = 2;
}

// IPv6RangeDeleteResponse is the confirmation envelope linode_ipv6_range_delete
// returns: a message plus the deleted range. The delete endpoint returns an
// empty body, so the response echoes the range CIDR.
message IPv6RangeDeleteResponse {
  string message = 1;
  string range = 2;
}

// ReservedIPAssignedEntity identifies the resource currently using a reserved
// address. The API returns null when the address is unassigned; the Python
// handler restores that explicit null after proto serialization.
message ReservedIPAssignedEntity {
  int64 id = 1;
  string label = 2;
  string type = 3;
  string url = 4;
}

// ReservedIPVPCNAT describes a 1:1 VPC NAT association. The API returns null
// when no association exists; the Python handler restores that explicit null
// after proto serialization.
message ReservedIPVPCNAT {
  string address = 1;
  int64 subnet_id = 2;
  int64 vpc_id = 3;
}

// ReservedIPAddress mirrors the complete reserved public IPv4 response.
// Nullable scalars use proto presence and typed relationship messages preserve
// integer IDs; the handler restores documented explicit nulls in field order.
message ReservedIPAddress {
  string address = 1;
  ReservedIPAssignedEntity assigned_entity = 2;
  optional string gateway = 3;
  optional int64 interface_id = 4;
  optional int64 linode_id = 5;
  int32 prefix = 6;
  bool public = 7;
  optional string rdns = 8;
  string region = 9;
  bool reserved = 10;
  string subnet_mask = 11;
  repeated string tags = 12;
  string type = 13;
  ReservedIPVPCNAT vpc_nat_1_1 = 14;
}

// ReservedIPListResponse is the project list envelope for the paginated
// reserved-IP collection.
message ReservedIPListResponse {
  int32 count = 1;
  repeated ReservedIPAddress reserved_ips = 2;
}

// ReservedIPPrice preserves nullable hourly/monthly values from the pricing
// response rather than imposing defaults on a billing value the API omitted.
message ReservedIPPrice {
  google.protobuf.Value hourly = 1;
  google.protobuf.Value monthly = 2;
}

// ReservedIPRegionPrice is a regional price override.
message ReservedIPRegionPrice {
  string id = 1;
  google.protobuf.Value hourly = 2;
  google.protobuf.Value monthly = 3;
}

// ReservedIPType is one reserved-IP pricing type returned by the API.
message ReservedIPType {
  string id = 1;
  string label = 2;
  ReservedIPPrice price = 3;
  repeated ReservedIPRegionPrice region_prices = 4;
  int64 transfer = 5;
}

// ReservedIPTypeListResponse is the project list envelope for pricing types.
message ReservedIPTypeListResponse {
  int32 count = 1;
  repeated ReservedIPType reserved_ip_types = 2;
}

// ReservedIPDeleteResponse confirms an empty successful unreserve response.
message ReservedIPDeleteResponse {
  string message = 1;
  string address = 2;
}

// ReservedIPCreateInput is the input contract for
// linode_networking_reserved_ip_create.
message ReservedIPCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_create"
    method: "POST"
    path: "/networking/reserved/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPAddress";
  option (linode.mcp.v1.tool_description) = "Reserves a public IPv4 address in a region. Pass dry_run=true to preview without reserving or starting billing.";
  option (linode.mcp.v1.confirm_message) = "This reserves a public IPv4 address and starts billing. Set confirm=true to proceed.";
  option (linode.mcp.v1.error_message) = "Failed to reserve public IPv4 address: {error}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The API sends these as an explicit null on a freshly reserved address, and
  // a caller cannot tell "no gateway" from "the API said nothing" without them.
  option (linode.mcp.v1.explicit_null_fields) = "assigned_entity";
  option (linode.mcp.v1.explicit_null_fields) = "gateway";
  option (linode.mcp.v1.explicit_null_fields) = "interface_id";
  option (linode.mcp.v1.explicit_null_fields) = "linode_id";
  option (linode.mcp.v1.explicit_null_fields) = "rdns";
  option (linode.mcp.v1.explicit_null_fields) = "vpc_nat_1_1";
  // The preview carries the billing delta a reservation starts, which no
  // declared sentence can express.
  option (linode.mcp.v1.tool_hooks) = "preview";

  // An absent region and one the body builder stood an empty string in for
  // answer the same sentence, which is what lets both be one rule.
  option (buf.validate.message).cel = {
    id: "networking_reserved_ip_create.region.required"
    message: "region is required"
    expression: "this.region != ''"
  };
  option (buf.validate.message).cel = {
    id: "networking_reserved_ip_create.region.slug"
    message: "region must be a lowercase region slug"
    expression: "this.region.matches('^[a-z0-9][a-z0-9-]*[a-z0-9]$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Region in which to reserve the public IPv4 address.
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Existing tags to apply to the reserved address.
  repeated string tags = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm reservation and billing. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ReservedIPListInput is the input contract for
// linode_networking_reserved_ip_list.
message ReservedIPListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_list"
    method: "GET"
    path: "/networking/reserved/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPListResponse";
  option (linode.mcp.v1.tool_description) = "Lists reserved public IPv4 addresses on the account.";
  option (linode.mcp.v1.error_message) = "Failed to list reserved IPv4 addresses: {error}";
  // The same six the create, the get and the update restore, here on every
  // address in the page: an unassigned reservation carries all six as an
  // explicit null, and a caller cannot tell "no gateway" from "the API said
  // nothing" without them.
  option (linode.mcp.v1.explicit_null_fields) = "assigned_entity";
  option (linode.mcp.v1.explicit_null_fields) = "gateway";
  option (linode.mcp.v1.explicit_null_fields) = "interface_id";
  option (linode.mcp.v1.explicit_null_fields) = "linode_id";
  option (linode.mcp.v1.explicit_null_fields) = "rdns";
  option (linode.mcp.v1.explicit_null_fields) = "vpc_nat_1_1";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ReservedIPGetInput is the input contract for
// linode_networking_reserved_ip_get.
message ReservedIPGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_get"
    method: "GET"
    path: "/networking/reserved/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPAddress";
  option (linode.mcp.v1.tool_description) = "Gets a reserved public IPv4 address";
  option (linode.mcp.v1.error_message) = "Failed to get reserved IPv4 address: {error}";
  // The same six the create and the update restore. The API sends them as an
  // explicit null on an address with nothing attached, and a caller cannot tell
  // "no gateway" from "the API said nothing" without them.
  option (linode.mcp.v1.explicit_null_fields) = "assigned_entity";
  option (linode.mcp.v1.explicit_null_fields) = "gateway";
  option (linode.mcp.v1.explicit_null_fields) = "interface_id";
  option (linode.mcp.v1.explicit_null_fields) = "linode_id";
  option (linode.mcp.v1.explicit_null_fields) = "rdns";
  option (linode.mcp.v1.explicit_null_fields) = "vpc_nat_1_1";
  // The route carries the address as a path segment, so it must be a bare IPv4
  // literal. A present but malformed one answers the second sentence, which is
  // what separates it from the absent case above it.
  option (buf.validate.message).cel = {
    id: "networking_reserved_ip_get.address.required"
    message: "address is required"
    expression: "this.address != ''"
  };
  option (buf.validate.message).cel = {
    id: "networking_reserved_ip_get.address.ipv4"
    message: "address must be a valid IPv4 address"
    expression: "this.address.isIp(4)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Reserved public IPv4 address to retrieve.
  string address = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// ReservedIPUpdateInput is the input contract for
// linode_networking_reserved_ip_update. tags is required by the handler;
// repeated proto fields cannot appear in generated required arrays.
message ReservedIPUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_update"
    method: "PUT"
    path: "/networking/reserved/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPAddress";
  option (linode.mcp.v1.tool_description) = "Replaces all tags on a reserved public IPv4 address. Pass dry_run=true to preview without updating.";
  option (linode.mcp.v1.confirm_message) = "This replaces all tags on the reserved IP. Set confirm=true to proceed.";
  option (linode.mcp.v1.error_message) = "Failed to replace reserved IPv4 tags: {error}";
  // The API sends these as an explicit null on an address with nothing attached,
  // and a caller cannot tell "no gateway" from "the API said nothing" without
  // them.
  option (linode.mcp.v1.explicit_null_fields) = "assigned_entity";
  option (linode.mcp.v1.explicit_null_fields) = "gateway";
  option (linode.mcp.v1.explicit_null_fields) = "interface_id";
  option (linode.mcp.v1.explicit_null_fields) = "linode_id";
  option (linode.mcp.v1.explicit_null_fields) = "rdns";
  option (linode.mcp.v1.explicit_null_fields) = "vpc_nat_1_1";
  // The read is the address, so the tags being replaced are reported as
  // current state.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_networking_reserved_ip_get"
  };

  // Fail-fast runs these in order, so the presence sentence comes first: the
  // address rule below would otherwise answer for an absent address.
  option (buf.validate.message).cel = {
    id: "reserved_ip_update.address.present"
    message: "address is required"
    expression: "this.address.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "reserved_ip_update.address.ipv4"
    message: "address must be a valid IPv4 address"
    expression: "this.address.isIp(4)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Reserved public IPv4 address whose tags will be replaced.
  string address = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Complete replacement set of existing tags. An empty list removes all tags.
  repeated string tags = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // An absent list is a refusal no rule can tell from the empty one that
    // clears every tag.
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Must be true to confirm replacing tags. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ReservedIPTypeListInput is the input contract for
// linode_networking_reserved_ip_type_list.
message ReservedIPTypeListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_type_list"
    method: "GET"
    path: "/networking/reserved/ips/types"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPTypeListResponse";
  option (linode.mcp.v1.tool_description) = "Lists reserved public IPv4 pricing information";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ReservedIPDeleteInput is the input contract for
// linode_networking_reserved_ip_delete.
message ReservedIPDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_reserved_ip_delete"
    method: "DELETE"
    path: "/networking/reserved/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ReservedIPDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Permanently unreserves a public IPv4 address and stops billing. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This permanently unreserves the IP and it cannot be recovered. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Reserved IP {address} unreserved successfully";
  option (linode.mcp.v1.resource_type) = "ReservedIP";
  // Neither client has ever retried this DELETE, so a replay cannot unreserve
  // an address the first attempt already released.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_networking_reserved_ip_get"
  };

  // Fail-fast runs these in order, so the presence sentence has to come first:
  // the address rule below would otherwise answer for an absent address.
  option (buf.validate.message).cel = {
    id: "reserved_ip_delete.address.present"
    message: "address is required"
    expression: "this.address.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "reserved_ip_delete.address.ipv4"
    message: "address must be a valid IPv4 address"
    expression: "this.address.isIp(4)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Reserved public IPv4 address to unreserve permanently.
  string address = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm unreserving the address. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by mode:"plan", supplied with mode:"apply".
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

