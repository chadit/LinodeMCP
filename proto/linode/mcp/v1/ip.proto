// InstanceIPAllocateInput is the input contract for
// linode_instance_ip_allocate. linode_id, type, public, and confirm are all
// required. public carries proto3 `optional` so a rule can tell a caller who
// omitted it from one who sent false, which drops its required flag from the
// advertised schema (recorded in the required-flag-loss log); the rule below
// still requires it.
message InstanceIPAllocateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_ip_allocate"
    method: "POST"
    path: "/linode/instances/{linode_id}/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPAddressWriteResponse";
  option (linode.mcp.v1.tool_description) = "Allocates a new IP address for a Linode instance. WARNING: Additional IPs may incur charges.";
  option (linode.mcp.v1.error_message) = "Failed to allocate IP for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This allocates a new IP address which may incur charges. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IP {address} allocated for instance {linode_id}";
  option (linode.mcp.v1.retry_disabled) = true;

  option (buf.validate.message).cel = {
    id: "instance_ip_allocate.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "instance_ip_allocate.type.required"
    message: "type must be one of: ipv4"
    expression: "this.type != 0"
  };
  // The API publishes no default, so a body written without public would pick
  // one on the caller's behalf.
  option (buf.validate.message).cel = {
    id: "instance_ip_allocate.public.required"
    message: "public is required"
    expression: "has(this.public)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The type of IP address to allocate: ipv4 or ipv6.
  InstanceIPType.Value type = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the IP address should be public (true) or private (false).
  optional bool public = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm IP allocation. Additional IPs may incur charges.
  // Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // An address already reserved on the account to assign to this Linode
  // (optional). Omitting it allocates a new address instead.
  optional string address = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// InstanceIPUpdateInput is the input contract for linode_instance_ip_update.
// linode_id, address, rdns, and confirm are required. rdns carries proto3
// `optional` so an explicit null can travel, which drops it out of the
