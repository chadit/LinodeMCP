  option (linode.mcp.v1.confirm_message) = "This assigns IPv4 addresses to Linodes. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.error_message) = "Failed to assign networking IPv4s: {error}";
  option (linode.mcp.v1.success_message) = "Networking IPv4 assignments updated";
  option (buf.validate.message).cel = {
    id: "networking_ipv4_assign.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "networking_ipv4_assign.assignments.required"
    message: "assignments must contain at least one assignment"
    expression: "size(this.assignments) > 0"
  };
  option (buf.validate.message).cel = {
    id: "networking_ipv4_assign.assignments.address"
    message: "assignments entries must carry an address"
    expression: "this.assignments.all(a, a.address.matches('[^ \\t\\r\\n]'))"
