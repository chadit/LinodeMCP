  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NetworkingIPListResponse";
  option (linode.mcp.v1.tool_description) = "Lists IP addresses on the account. Set skip_ipv6_rdns to true to skip IPv6 reverse DNS lookups.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve items: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Skip IPv6 reverse DNS lookups (optional). The route forwards it as a query
  // argument, so no path check reaches it and the flag reads the argument map.
  optional bool skip_ipv6_rdns = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_BOOL
  ];
}

// IPAddressUpdateInput is the input contract for linode_networking_ip_update.
message IPAddressUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_ip_update"
    method: "PUT"
    path: "/networking/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPAddressWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates reverse DNS for one account-level IP address.";
  option (linode.mcp.v1.error_message) = "Failed to update networking IP {address} RDNS: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates reverse DNS for an IP address. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Networking IP {address} RDNS updated";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the address whose reverse DNS the update replaces.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_networking_ip_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Reverse DNS (rDNS) is set to \"{rdns}\"."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The address answers first when both it and the replacement are missing,
  // which is why the rdns rule holds its peace until the address reads.
  option (buf.validate.message).cel = {
    id: "networking_ip_update.address.non_blank"
    message: "address must be a non-empty string"
    expression: "this.address.matches('(?s)^.*\\\\S.*$')"
  };
  // isIp permits an RFC 6874 zone id, which names an interface on the caller's
  // host and addresses nothing on the account, so it is refused alongside.
  option (buf.validate.message).cel = {
    id: "networking_ip_update.address.ip"
    message: "address must be a valid IP address"
    expression: "this.address.isIp() && !this.address.contains('%')"
  };
  option (buf.validate.message).cel = {
    id: "networking_ip_update.rdns.non_blank"
    message: "rdns is required"
    expression: "!this.address.isIp() || this.rdns.matches('(?s)^.*\\\\S.*$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The IPv4 or IPv6 address to update.
  string address = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_FREE_TEXT,
    (linode.mcp.v1.reader_message) = {
      absent: "address must be a non-empty string"
      unusable: "address must be a non-empty string"
    }
  ];
  // The reverse DNS value to set.
  string rdns = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_TEXT,
    (linode.mcp.v1.reader_message) = {
      absent: "rdns is required"
      unusable: "rdns must be a string"
    }
  ];
  // Must be true to confirm changing reverse DNS. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Whether the address stays reserved on the account when it is unassigned
  // (optional). Omitting it leaves the address's current reservation alone.
  optional bool reserved = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// IPAddressAllocateInput is the input contract for
// linode_networking_ip_allocate. public is a required boolean beyond confirm,
// so it stays a plain (non-optional) bool.
message IPAddressAllocateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_ip_allocate"
    method: "POST"
    path: "/networking/ips"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IPAddressWriteResponse";
  option (linode.mcp.v1.tool_description) = "Allocates an account-level IP address. WARNING: Additional IPs may incur charges.";
  option (linode.mcp.v1.error_message) = "Failed to allocate networking IP: {error}";
  option (linode.mcp.v1.confirm_message) = "This allocates a new IP address which may incur charges. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IP {address} allocated for Linode {linode_id}";
  option (linode.mcp.v1.retry_disabled) = true;
  option (buf.validate.message).cel = {
    id: "networking_ip_allocate.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode that receives the new IP address.
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The type of IP address to allocate: ipv4 or ipv6.
  InstanceIPType.Value type = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_ENUM_MEMBER,
    // A vocabulary of one still reads as a list here, because that is the
    // sentence this tool has always answered a family it cannot allocate.
    (linode.mcp.v1.reader_message) = {
      absent: "type must be a non-empty string"
      refused: "type must be one of: ipv4"
    }
  ];
  // Whether the IP address should be public.
  bool public = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_BOOL,
    // A caller who sent no flag is told the flag is missing, where one who sent
    // something that is not a flag is told what a flag is.
    (linode.mcp.v1.reader_message) = {absent: "public is required"}
  ];
  // Must be true to confirm IP allocation. Additional IPs may incur charges.
  // Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// NetworkingIPAssignmentItem is one address-to-Linode binding submitted by the
// IP assign tools: the IP address and the Linode that should receive it. It
// mirrors the linode.IPAssignment request struct (address, linode_id), so the
// generated array item preserves the object shape rather than regressing to a
// bare Struct.
message NetworkingIPAssignmentItem {
  // The IP address to assign.
  string address = 1;
  // The ID of the Linode that receives the address.
  int32 linode_id = 2;
}

// NetworkingIPAssignInput is the input contract for linode_networking_ip_assign.
// assignments is required at the handler level, but a repeated message field
// can never land in the generated required array, so the advertised required
// set is [confirm, region] (see the required-flag-loss log).
message NetworkingIPAssignInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_ip_assign"
    method: "POST"
    path: "/networking/ips/assign"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NetworkingIPAssignWriteResponse";
  option (linode.mcp.v1.tool_description) = "Assigns IP addresses to Linodes in a region. WARNING: This changes IP ownership assignments.";
  option (linode.mcp.v1.confirm_message) = "This assigns IP addresses to Linodes. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.error_message) = "Failed to assign networking IPs: {error}";
  option (linode.mcp.v1.success_message) = "Networking IP assignments updated";
  option (buf.validate.message).cel = {
    id: "networking_ip_assign.region.required"
    message: "region is required"
    expression: "this.region.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "networking_ip_assign.assignments.required"
    message: "assignments must contain at least one assignment"
    expression: "size(this.assignments) > 0"
  };
  option (buf.validate.message).cel = {
    id: "networking_ip_assign.assignments.address"
    message: "assignments entries must carry an address"
    expression: "this.assignments.all(a, a.address.matches('[^ \\t\\r\\n]'))"
  };
  option (buf.validate.message).cel = {
    id: "networking_ip_assign.assignments.linode_id"
    message: "assignments entries must carry a positive linode_id"
    expression: "this.assignments.all(a, a.linode_id >= 1)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The region for the IP assignments.
  string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Assignment objects, each with an address and the Linode that receives it.
  repeated NetworkingIPAssignmentItem assignments = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm IP reassignment. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// NetworkingIPv4AssignInput is the input contract for
// linode_networking_ipv4_assign. Same shape as NetworkingIPAssignInput, reusing
// the shared NetworkingIPAssignmentItem; assignments is required at the handler
// level but drops from the generated required set (see the loss log).
