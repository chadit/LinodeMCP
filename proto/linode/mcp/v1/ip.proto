    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Must be true to confirm the RDNS update. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceIPDeleteInput is the input contract for linode_instance_ip_delete,
// a two-stage destroy: linode_id, address, and confirm are required, and
// mode/plan_id drive the plan/apply flow.
message InstanceIPDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_ip_delete"
    method: "DELETE"
    path: "/linode/instances/{linode_id}/ips/{address}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.InstanceIPDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Removes an IP address from a Linode instance. WARNING: This permanently removes the IP and is irreversible. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This permanently removes the IP address and is irreversible. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IP {address} removed from instance {linode_id}";
  option (linode.mcp.v1.resource_type) = "InstanceIP";
  // A replay would report an address the first attempt already released as one
  // the instance never had.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_instance_ip_get"
  };

  // A malformed address would be spliced into the path and ask the API to
  // release something nobody named. Empty is left to the path reader, which
  // answers that the address is required.
  // isIp permits an RFC 6874 zone id, which names an interface on the caller's
  // host and addresses nothing on the Linode, so it is refused alongside.
  option (buf.validate.message).cel = {
    id: "instance_ip_delete.address.ip"
    message: "address must be a valid IP address"
    expression: "this.address == '' || (this.address.isIp() && !this.address.contains('%'))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The IP address to remove (e.g. 203.0.113.1).
  string address = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm IP removal. This action is irreversible. Ignored
  // when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with
  // plan_id re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// NetworkingIPListInput is the input contract for linode_networking_ip_list.
message NetworkingIPListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_networking_ip_list"
    method: "GET"
    path: "/networking/ips"
