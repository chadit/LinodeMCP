// IamIdpConfigExcludedUserUpdateInput is the input contract for
// linode_iam_idp_config_excluded_user_update. The call replaces the whole list
// rather than adding to it, so an empty usernames clears it and leaves every
// user on SSO enforcement.
message IamIdpConfigExcludedUserUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_iam_idp_config_excluded_user_update"
    method: "PUT"
    path: "/iam/idp-configs/{idp_config_id}/users-excluded"
  };
  option (linode.mcp.v1.tool_api_surface) = API_SURFACE_V4BETA;
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IamIdpConfigUserListResponse";
  option (linode.mcp.v1.tool_description) = "Replaces the list of users excluded from SSO enforcement. Pass an empty usernames list to clear it, which puts every user behind the identity provider. Requires confirm=true. Pass dry_run=true to preview without updating.";
  option (linode.mcp.v1.confirm_message) = "This replaces the emergency access list for single sign-on. Set confirm=true to proceed.";
  option (linode.mcp.v1.error_message) = "Failed to update excluded users for IDP configuration '{idp_config_id}': {error}";
  // A replay reapplies a list the first call may already have changed.
  option (linode.mcp.v1.retry_disabled) = true;

  option (buf.validate.message).cel = {
    id: "iam_idp_config_excluded_user_update.idp_config_id.required"
    message: "idp_config_id is required"
    expression: "this.idp_config_id.matches('[^ \\t\\r\\n]')"
  };
  // Entry emptiness is all a rule can see of usernames: the empty list is the
  // documented way to clear the exclusions, and proto3 collapses an omitted
  // repeated field onto it.
  option (buf.validate.message).cel = {
    id: "iam_idp_config_excluded_user_update.usernames.entries"
    message: "usernames entries must not be blank"
    expression: "this.usernames.all(u, u.matches('[^ \\t\\r\\n]'))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // IDP configuration ID whose excluded users should be replaced.
  string idp_config_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Complete list of usernames to exclude. Use an empty list to clear the
  // exclusions.
  repeated string usernames = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm replacing the excluded users. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

