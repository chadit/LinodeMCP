// IamIdpConfigCertificateDeleteInput is the input contract for
// linode_iam_idp_config_certificate_delete.
//
// It declares no fetch_state hook and no read shares its route: the API
// publishes three certificate routes and none of them reads one certificate.
// The list above is the parent of this path, and its elements carry the id this
// route's trailing segment names, so the preview and the plan hash read the
// certificate out of that page.
message IamIdpConfigCertificateDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_iam_idp_config_certificate_delete"
    method: "DELETE"
    path: "/iam/idp-configs/{idp_config_id}/certificates/{certificate_id}"
  };
  option (linode.mcp.v1.tool_api_surface) = API_SURFACE_V4BETA;
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IamIdpConfigCertificateDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes one SAML signing certificate from an external identity provider (SSO) configuration, by idp_config_id and certificate_id. Assertions signed with it stop verifying, and removing the last one ends SSO login for every user the configuration covered. Requires confirm=true. Pass dry_run=true to preview without deleting.";
  option (linode.mcp.v1.confirm_message) = "This deletes a signing certificate from the single sign-on configuration, and assertions signed with it stop verifying. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "IDP certificate '{certificate_id}' deleted from configuration '{idp_config_id}'";
  option (linode.mcp.v1.error_message) = "Failed to delete IDP certificate '{certificate_id}' from configuration '{idp_config_id}': {error}";
  // A replay would report a certificate the first attempt already removed as one
  // the configuration never carried.
  option (linode.mcp.v1.retry_disabled) = true;

  option (buf.validate.message).cel = {
    id: "iam_idp_config_certificate_delete.idp_config_id.required"
    message: "idp_config_id is required"
    expression: "this.idp_config_id.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "iam_idp_config_certificate_delete.certificate_id.required"
    message: "certificate_id is required"
    expression: "this.certificate_id.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // IDP configuration ID the certificate belongs to.
  string idp_config_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Certificate ID to delete, the id the certificate list route reports.
  string certificate_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm deleting the certificate. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

