syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/common.proto";
import "linode/mcp/v1/options.proto";

// Volume mirrors the Linode block storage volume object. Field order and JSON
// names match what both implementations emit today, so protojson output is
// byte-compatible with the existing tool response.
message Volume {
  int32 id = 1;
  string label = 2;
  string status = 3;
  int32 size = 4;
  string region = 5;
  // linode_id and linode_label are nullable on the wire; under EmitDefaultValues
  // they are omitted when unset (the API sends null when the volume is detached).
  optional int32 linode_id = 6;
  optional string linode_label = 7;
  string filesystem_path = 8;
  repeated string tags = 9;
  string created = 10;
  string updated = 11;
  string hardware_type = 12;
}

// VolumeGetResponse wraps a single volume under "volume", matching the existing
// linode_volume_get output shape.
message VolumeGetResponse {
  Volume volume = 1;
}

// VolumeListResponse mirrors the linode_volume_list wrapper: a count, an
// optional filter echo, and the volumes. This is the project's own envelope,
// not the Linode {data,page,pages,results} list shape.
message VolumeListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Volume volumes = 3;
}

// VolumeWriteResponse is the {message, volume} envelope the volume write tools
// (create, update, resize, clone, attach) return: a human-readable confirmation
// plus the affected volume. For attach, the attached Linode is available on the
// volume itself (volume.linode_id), so no separate field is echoed.
message VolumeWriteResponse {
  string message = 1;
  Volume volume = 2;
}

// VolumeDeleteResponse is the id-echo envelope linode_volume_delete returns: a
// confirmation message plus the deleted volume's ID. The delete endpoint
// returns an empty body, so the id echo confirms the target.
message VolumeDeleteResponse {
  string message = 1;
  int32 volume_id = 2;
}

// VolumeDetachResponse is the id-echo envelope linode_volume_detach returns: a
// confirmation message plus the detached volume's ID. The detach endpoint
// returns an empty body, so the id echo confirms the target.
message VolumeDetachResponse {
  string message = 1;
  int32 volume_id = 2;
}

// VolumeGetInput is the input contract for linode_volume_get.
message VolumeGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_get"
    method: "GET"
    path: "/volumes/{volume_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeGetResponse";
  option (linode.mcp.v1.tool_description) = "Gets details for a single block storage volume by ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve volume {volume_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to retrieve (required).
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// VolumeListInput is the input contract for linode_volume_list. region and
// label_contains are client-side filters.
message VolumeListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_list"
    method: "GET"
    path: "/volumes"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeListResponse";
  option (linode.mcp.v1.tool_description) = "Lists all block storage volumes for the authenticated user with optional filtering by region or label";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter volumes by region (e.g., 'us-east', 'eu-west').
  optional string region = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter volumes where label contains this string (case-insensitive).
  optional string label_contains = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// VolumeTypeListInput is the input contract for linode_volume_type_list.
message VolumeTypeListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_type_list"
    method: "GET"
    path: "/volumes/types"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeTypeListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available Linode block storage volume types and pricing";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeCreateInput is the input contract for linode_volume_create. A plain
// (non-optional) field is required in the generated schema; an optional field
// is not. label and confirm are required; the rest are optional.
message VolumeCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_create"
    method: "POST"
    path: "/volumes"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a new block storage volume. WARNING: Billing starts immediately. Use linode_region_list to find valid regions.";
  option (linode.mcp.v1.error_message) = "Failed to create volume: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable resource. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume '{label}' (ID: {id}) created successfully in {region}";
  option (linode.mcp.v1.retry_disabled) = true;
  // The size-free wordings answer the call that leaves sizing to the API, which
  // takes its own default rather than the zero the older prose reported.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new {size} GB volume \"{label}\" will be created in region {region}."
    template: "A new {size} GB volume \"{label}\" will be created."
    template: "A new volume \"{label}\" will be created in region {region}."
    template: "A new volume \"{label}\" will be created."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // A detached volume is legal, so this whole line is dropped when the call
  // names no instance to attach to.
  option (linode.mcp.v1.preview_sentence) = {
    template: "The volume is attached to instance {linode_id} on creation."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for the volume starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };
  // This preview predates the request echo and its callers still read the
  // shorter shape.
  option (linode.mcp.v1.preview_omits_body) = true;

  // The rules run in the order written, which is the order this tool has always
  // answered in: the label, then where the volume lands, then how big it is.
  option (buf.validate.message).cel = {
    id: "volume_create.label.required"
    message: "label is required"
    expression: "this.label != ''"
  };
  option (buf.validate.message).cel = {
    id: "volume_create.placement.required"
    message: "either region or linode_id is required"
    expression: "this.region != '' || this.linode_id != 0"
  };
  // An absent size takes the API default, so the bounds hold their peace at
  // zero rather than reporting a volume nobody asked to size.
  option (buf.validate.message).cel = {
    id: "volume_create.size.minimum"
    message: "volume size must be at least 10 GB"
    expression: "this.size == 0 || this.size >= 10"
  };
  option (buf.validate.message).cel = {
    id: "volume_create.size.maximum"
    message: "volume size cannot exceed 10240 GB (10 TB)"
    expression: "this.size <= 10240"
  };
  option (buf.validate.message).cel = {
    id: "volume_create.label.length"
    message: "label must not exceed 64 characters"
    expression: "size(this.label) <= 64"
  };
  option (buf.validate.message).cel = {
    id: "volume_create.label.charset"
    message: "label contains an invalid character; use letters, digits, '_', '-', or '.'"
    expression: "this.label.matches('^[A-Za-z0-9_.-]*$')"
  };
  // A config the caller supplied names a Linode config, so zero and below is a
  // value no config carries rather than one left to the API.
  option (buf.validate.message).cel = {
    id: "volume_create.config_id.minimum"
    message: "config_id must be an integer greater than or equal to 1"
    expression: "!has(this.config_id) || this.config_id >= 1"
  };
  // An encryption argument naming no member arrives as the enum's zero, the
  // same as an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "volume_create.encryption.known"
    message: "encryption must be one of: disabled, enabled"
    expression: "!has(this.encryption) || this.encryption != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // A label for the volume (must be unique within your account).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region where the volume will be created. Required unless attaching to a Linode.
  optional string region = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Size in GB (10-10240). Default is 20GB.
  optional int32 size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Linode ID to attach the volume to (optional). If provided, region is inferred.
  optional int32 linode_id = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm volume creation. This operation incurs
  // billing charges. Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Tags to apply to the new volume (optional).
  repeated string tags = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // ID of the Linode config the volume should be attached to (optional,
  // requires linode_id).
  optional int32 config_id = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the volume is encrypted at rest: disabled or enabled (optional,
  // defaults to enabled).
  optional DiskEncryption.Value encryption = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// VolumeCloneInput is the input contract for linode_volume_clone. volume_id,
// label, and confirm are required.
message VolumeCloneInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_clone"
    method: "POST"
    path: "/volumes/{volume_id}/clone"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Clones an existing block storage volume. WARNING: Billing starts immediately for the cloned volume. Pass dry_run=true to preview without cloning.";
  option (linode.mcp.v1.error_message) = "Failed to clone volume {volume_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation creates a billable cloned volume. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} cloned successfully as \"{label}\"";
  // A clone POST mints a new volume with its own id, so replaying it after a
  // transient failure leaves a second billable copy nobody asked for.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the source volume, which the request carries only as an id. It
  // answers a wrapper around the body the API sends, so the fetch projects
  // through that member.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  // A volume carrying no id is one the read did not name, whatever the reason,
  // so the copy is described without a source that does not exist.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Volume {state:id} (\"{state:label}\") will be cloned to a new volume labeled \"{label}\"."
    template: "A new volume labeled \"{label}\" will be created from the source volume."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Billing for the cloned volume starts immediately on creation."
    line: PREVIEW_LINE_WARNING
  };
  // This preview predates the request echo and its callers still read the
  // shorter shape.
  option (linode.mcp.v1.preview_omits_body) = true;

  // Both rules hold their peace until the id is usable and the label is
  // non-empty, because those two are the readers' to answer: an unusable id
  // arrives as the zero a missing one does, and an absent label as the empty
  // string. Rules run before the readers, so a rule answering for them would
  // take their turn.
  option (buf.validate.message).cel = {
    id: "volume_clone.label.length"
    message: "label must not exceed 64 characters"
    expression: "this.volume_id < 1 || this.label == '' || size(this.label) <= 64"
  };
  option (buf.validate.message).cel = {
    id: "volume_clone.label.charset"
    message: "label contains an invalid character; use letters, digits, '_', '-', or '.'"
    expression: "this.volume_id < 1 || this.label == '' || this.label.matches('^[A-Za-z0-9_.-]*$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the source volume to clone.
  int32 volume_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // A label for the cloned volume.
  string label = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_TEXT
  ];
  // Must be set to true to confirm volume cloning. This operation incurs
  // billing charges. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeAttachInput is the input contract for linode_volume_attach. volume_id,
// linode_id, and confirm are required.
message VolumeAttachInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_attach"
    method: "POST"
    path: "/volumes/{volume_id}/attach"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {
    scope: TOOL_SCOPE_VOLUMES_READ_WRITE
    scope: TOOL_SCOPE_LINODES_READ_WRITE
  };
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Attaches a block storage volume to a Linode instance. The volume and instance must be in the same region.";
  option (linode.mcp.v1.error_message) = "Failed to attach volume {volume_id} to Linode {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This attaches a block storage volume to an instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} attached to Linode {linode_id} successfully";
  // The read is the volume the attach moves, and it answers a wrapper around
  // the body the API sends, so the fetch projects through that member.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Volume {volume_id} attaches to instance {linode_id}; the volume must be in the same region as the instance."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // This preview predates the request echo and its callers still read the
  // shorter shape.
  option (linode.mcp.v1.preview_omits_body) = true;

  option (buf.validate.message).cel = {
    id: "volume_attach.volume_id.required"
    message: "volume_id is required"
    expression: "this.volume_id != 0"
  };
  option (buf.validate.message).cel = {
    id: "volume_attach.linode_id.required"
    message: "linode_id is required"
    expression: "this.linode_id != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to attach.
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the Linode instance to attach the volume to.
  int32 linode_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The Linode config ID to attach to (optional).
  optional int32 config_id = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the volume should remain attached across instance reboots (optional).
  optional bool persist_across_boots = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm attaching the volume. Ignored when dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeDetachInput is the input contract for linode_volume_detach. volume_id
// and confirm are required.
message VolumeDetachInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_detach"
    method: "POST"
    path: "/volumes/{volume_id}/detach"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {
    scope: TOOL_SCOPE_VOLUMES_READ_WRITE
    scope: TOOL_SCOPE_LINODES_READ_WRITE
  };
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeDetachResponse";
  option (linode.mcp.v1.tool_description) = "Detaches a block storage volume from a Linode instance. The volume data is preserved. Pass dry_run=true to preview without detaching.";
  option (linode.mcp.v1.error_message) = "Failed to detach volume {volume_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This detaches a block storage volume from an instance. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} detached successfully";
  // The read is the volume, since the attachment is the part a caller cannot
  // see from a request naming only the volume.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  // A state carrying no attachment reads as unattached whatever the reason: the
  // read has already failed loudly if it failed at all.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Volume {state:id} detaches from instance {state:linode_id}; its data is preserved and billing continues."
    template: "Volume is not attached to any instance; detach is a no-op."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to detach.
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm detaching the volume. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeResizeInput is the input contract for linode_volume_resize. volume_id,
// size, and confirm are required.
message VolumeResizeInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_resize"
    method: "POST"
    path: "/volumes/{volume_id}/resize"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Resizes a block storage volume. WARNING: Volumes can only be resized UP. This operation may incur additional billing.";
  option (linode.mcp.v1.error_message) = "Failed to resize volume {volume_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This operation may increase billing. Volumes cannot be downsized. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} resize to {size} GB initiated successfully";
  // The read is the volume, whose current size is what says whether the resize
  // grows it at all.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  // A read answering no size leaves the starting size out rather than naming a
  // zero.
  option (linode.mcp.v1.preview_sentence) = {
    template: "Volume resizes from {state:size} GB to {size} GB."
    template: "Volume resizes to {size} GB."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "A volume can only grow; the new size must be larger than the current size."
    line: PREVIEW_LINE_WARNING
  };
  // This preview predates the request echo and its callers still read the
  // shorter shape.
  option (linode.mcp.v1.preview_omits_body) = true;

  option (buf.validate.message).cel = {
    id: "volume_resize.volume_id.required"
    message: "volume_id is required"
    expression: "this.volume_id != 0"
  };
  // A resize names the new size, so an absent one is a size below the floor
  // rather than a value left to the API.
  option (buf.validate.message).cel = {
    id: "volume_resize.size.minimum"
    message: "volume size must be at least 10 GB"
    expression: "this.size >= 10"
  };
  option (buf.validate.message).cel = {
    id: "volume_resize.size.maximum"
    message: "volume size cannot exceed 10240 GB (10 TB)"
    expression: "this.size <= 10240"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to resize.
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New size in GB (must be larger than current size).
  int32 size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm resize. Volumes cannot be downsized. Ignored
  // when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeUpdateInput is the input contract for linode_volume_update. volume_id
// and confirm are required; label and tags are optional (repeated fields are
// never required in the generated schema).
message VolumeUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_update"
    method: "PUT"
    path: "/volumes/{volume_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates a block storage volume's label or tags.";
  // Go and Python worded this failure differently before the contract carried
  // it. The Python wording wins the verb because every other declared failure
  // on the surface opens with it, and the Go id is kept because naming the
  // volume is what tells one failed update from another.
  option (linode.mcp.v1.error_message) = "Failed to update volume {volume_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a block storage volume. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} updated successfully";
  // The read is the volume, whose label the request alone does not carry. It
  // answers a wrapper around the body the API sends, so the fetch projects
  // through that member.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Label changes from \"{state:label}\" to \"{label}\"."
    template: "Label is set to \"{label}\"."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.preview_unchanged) = {
    state: "label"
    argument: "label"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "The volume's tag set is replaced with the provided tags."
    line: PREVIEW_LINE_SIDE_EFFECT
    when_present: "tags"
  };
  // This preview predates the request echo and its callers still read the
  // shorter shape.
  option (linode.mcp.v1.preview_omits_body) = true;
  // An update naming neither field would change nothing, and only the
  // argument map can see that tags was supplied: an empty array clears the
  // volume's tags, which is a change worth making, and presence on a repeated
  // field is not something a rule can see.
  option (linode.mcp.v1.require_any_of) = {
    fields: "label"
    fields: "tags"
  };

  option (buf.validate.message).cel = {
    id: "volume_update.volume_id.positive"
    message: "volume_id must be a positive integer"
    expression: "this.volume_id >= 1"
  };
  // The label shape sentences the update has always answered. A wrong-type
  // label never builds the message, so the body builder answers that case.
  option (buf.validate.message).cel = {
    id: "volume_update.label.length"
    message: "label must not exceed 64 characters"
    expression: "!has(this.label) || size(this.label) <= 64"
  };
  option (buf.validate.message).cel = {
    id: "volume_update.label.charset"
    message: "label contains an invalid character; use letters, digits, '_', '-', or '.'"
    expression: "!has(this.label) || this.label.matches('^[A-Za-z0-9_.-]*$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to update.
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the volume (1-32 chars, alphanumeric, hyphens, underscores).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Replacement tags for the volume (optional).
  repeated string tags = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm the update. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// VolumeDeleteInput is the input contract for linode_volume_delete, an opted-in
// two-stage destroy: volume_id and confirm are required, and mode/plan_id drive
// the plan/apply flow.
message VolumeDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_volume_delete"
    method: "DELETE"
    path: "/volumes/{volume_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_VOLUMES_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_BLOCK_STORAGE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a block storage volume. WARNING: This action is irreversible and all data will be permanently lost. The volume must be detached first. Pass dry_run=true to preview without deleting. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive and irreversible. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Volume {volume_id} removed successfully";
  option (linode.mcp.v1.resource_type) = "Volume";
  // A replay would report a volume the first attempt already removed as one that
  // never existed.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read answers a wrapper around the volume the API's own body is, so the
  // fetch projects through the member rather than the envelope.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_volume_get"
    payload_member: "volume"
  };
  // The walk names the instance the data comes off, which is what makes an
  // irreversible delete worth previewing. The enrichment reads the instance
  // for the label the volume record sometimes omits, filling its slot off
  // the fetched state's linode_id.
  option (linode.mcp.v1.dependency_walk) = {
    state_scalar: "linode_id"
    emit: {
      kind: "instance"
      id_field: "linode_id"
      label_field: "linode_label"
      label_fallback: "{enrich:label}"
      action: "detached"
      note: "Volume is attached; it detaches from this instance before deletion."
    }
    warnings: {
      template: "Volume is currently attached to an instance; it will be detached as part of deletion."
      when_any: true
    }
    enrich: {
      tool: "linode_instance_get"
      fields: "label"
      slot_arguments: { read_slot: "instance_id", argument: "linode_id" }
    }
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the volume to delete.
  int32 volume_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. This action is irreversible.
  // Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// InstanceVolumeListInput is the input contract for
// linode_instance_volume_list.
message InstanceVolumeListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_instance_volume_list"
    method: "GET"
    path: "/linode/instances/{linode_id}/volumes"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_LINODES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_COMPUTE};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.VolumeListResponse";
  option (linode.mcp.v1.tool_description) = "Lists volumes attached to a Linode instance with optional pagination.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the Linode instance (required).
  int32 linode_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
