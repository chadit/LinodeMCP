syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/longview.proto";
import "linode/mcp/v1/options.proto";

// DatabaseTypeEngine is one engine pricing entry nested in a database type.
message DatabaseTypeEngine {
  int32 quantity = 1;
  Price price = 2;
}

// DatabaseTypeEngines groups the per-engine pricing for a database type. mysql
// and postgresql are repeated (emitted as []).
message DatabaseTypeEngines {
  repeated DatabaseTypeEngine mysql = 1;
  repeated DatabaseTypeEngine postgresql = 2;
}

// DatabaseType mirrors a Managed Database node type (plan).
message DatabaseType {
  string id = 1;
  string label = 2;
  string class = 3;
  int32 disk = 4;
  int32 memory = 5;
  int32 vcpus = 6;
  bool deprecated = 7;
  DatabaseTypeEngines engines = 8;
}

// DatabaseTypeListResponse is the linode_database_type_list envelope: count and
// the full proto DatabaseType elements. Pagination does not echo a filter.
message DatabaseTypeListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated DatabaseType database_types = 3;
}

// DatabaseTypeGetInput is the input contract for linode_database_type_get.
message DatabaseTypeGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_type_get"
    method: "GET"
    path: "/databases/types/{type_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DATABASES};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseType";
  option (linode.mcp.v1.tool_description) = "Retrieves a single Managed Database node type by ID.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve Managed Database type: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the database type to retrieve (required).
  string type_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_FRAGMENT_SAFE_TEXT,
    // A type id nobody sent reads the same as one sent as a number here, and
    // the refusal names the fragment marker among the classes.
    (linode.mcp.v1.reader_message) = {
      absent: "type_id must be a non-empty string"
      refused: "type_id must not contain separators, query, fragment, or traversal segments"
    }
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// DatabaseTypeListInput is the input contract for linode_database_type_list.
message DatabaseTypeListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_type_list"
    method: "GET"
    path: "/databases/types"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DATABASES};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.DatabaseTypeListResponse";
  option (linode.mcp.v1.tool_description) = "Lists available Managed Database node types with optional pagination.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// DatabaseMySQLConfigGetInput is the input contract for
// linode_database_mysql_config_get.
message DatabaseMySQLConfigGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_database_mysql_config_get"
    method: "GET"
    path: "/databases/mysql/config"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_DATABASES_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_DATABASES};
  option (linode.mcp.v1.tool_description) = "Lists MySQL Managed Database advanced parameters.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve MySQL Managed Database advanced parameters: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

