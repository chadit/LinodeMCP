syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// SupportTicketAttachment is one file attached to a support ticket.
message SupportTicketAttachment {
  string filename = 1;
  int32 id = 2;
  int32 size = 3;
}

// SupportTicketEntity is the resource a support ticket is about. id is a
// passthrough value (the API returns an int or string depending on entity type).
message SupportTicketEntity {
  google.protobuf.Value id = 1;
  string label = 2;
  string type = 3;
  string url = 4;
}

// SupportTicket mirrors a Linode support ticket. attachments is repeated (emitted
// as []); closed is nullable (omitted when unset); entity is omitted when unset.
message SupportTicket {
  repeated SupportTicketAttachment attachments = 1;
  bool closable = 2;
  optional string closed = 3;
  string description = 4;
  SupportTicketEntity entity = 5;
  string gravatar_id = 6;
  int32 id = 7;
  string opened = 8;
  string opened_by = 9;
  string status = 10;
  string summary = 11;
  string updated = 12;
  string updated_by = 13;
}

// SupportTicketListResponse is the linode_support_ticket_list envelope: count
// and the full proto SupportTicket elements. The tool paginates and has no
// filter params, so filter is omitted.
message SupportTicketListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated SupportTicket support_tickets = 3;
}

// SupportTicketGetInput is the input contract for linode_support_ticket_get.
message SupportTicketGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_get"
    method: "GET"
    path: "/support/tickets/{ticket_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicket";
  option (linode.mcp.v1.tool_description) = "Gets one support ticket by ticket_id.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve support ticket {ticket_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the support ticket to retrieve (required).
  int32 ticket_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// SupportTicketReply mirrors one reply from
// GET /support/tickets/{ticket_id}/replies. All fields are present scalars.
message SupportTicketReply {
  string created = 1;
  string created_by = 2;
  string description = 3;
  string gravatar_id = 4;
  int32 id = 5;
  string updated = 6;
  string updated_by = 7;
}

// SupportTicketReplyListResponse is the linode_support_ticket_reply_list
// envelope: count and the full proto SupportTicketReply elements. The tool
// paginates and has no filter params, so filter is omitted.
message SupportTicketReplyListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated SupportTicketReply support_ticket_replies = 3;
}

// SupportTicketWriteResponse is the {message, ticket} envelope the support
// ticket create tool returns: a confirmation string plus the full SupportTicket
// element the API returns for the opened ticket.
message SupportTicketWriteResponse {
  string message = 1;
  SupportTicket ticket = 2;
}

// SupportTicketReplyWriteResponse is the {message, reply} envelope the support
// ticket reply create tool returns: a confirmation string plus the full
// SupportTicketReply element the API returns for the new reply.
message SupportTicketReplyWriteResponse {
  string message = 1;
  SupportTicketReply reply = 2;
}

// SupportTicketIDResponse is the {message, ticket_id} id-echo the support ticket
// attachment create and close tools return; those endpoints return no resource
// body to echo, so the response carries the affected ticket id.
message SupportTicketIDResponse {
  string message = 1;
  int32 ticket_id = 2;
}

// SupportTicketListInput is the input contract for linode_support_ticket_list.
message SupportTicketListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_list"
    method: "GET"
    path: "/support/tickets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketListResponse";
  option (linode.mcp.v1.tool_description) = "Lists support tickets for the authenticated account.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// SupportTicketCreateInput is the input contract for
// linode_support_ticket_create. summary, description, and confirm are
// required; the entity references are optional and mutually independent.
message SupportTicketCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_create"
    method: "POST"
    path: "/support/tickets"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketWriteResponse";
  option (linode.mcp.v1.tool_description) = "Opens a support ticket for the authenticated account.";
  option (linode.mcp.v1.error_message) = "Failed to create support ticket: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a support ticket. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Support ticket opened successfully";
  // A replayed attempt would open a second ticket nobody hears about, so Go
  // never retried this POST and Python stops here.
  option (linode.mcp.v1.retry_disabled) = true;
  // The free-text values are trimmed before anything reads them, which is
  // what Python has always sent.
  option (linode.mcp.v1.normalize_fields) = {
    field: "summary"
    field: "description"
    field: "bucket"
    field: "region"
    field: "vlan"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The ticket being opened, which the body otherwise leaves in a JSON blob.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new support ticket \"{summary}\" will be opened."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The rules below are evaluated in the order they are written: the two
  // required values first, then the optional references in field order.
  // summary and description are plain proto3 strings, so absent and
  // whitespace-only both arrive as "" and answer the same sentence.
  option (buf.validate.message).cel = {
    id: "support_ticket_create.summary.required"
    message: "summary is required"
    expression: "this.summary.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.description.required"
    message: "description is required"
    expression: "this.description.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.bucket.non_blank"
    message: "bucket must be a non-empty string"
    expression: "!has(this.bucket) || this.bucket.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.database_id.positive"
    message: "database_id must be a positive integer"
    expression: "!has(this.database_id) || this.database_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.domain_id.positive"
    message: "domain_id must be a positive integer"
    expression: "!has(this.domain_id) || this.domain_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.firewall_id.positive"
    message: "firewall_id must be a positive integer"
    expression: "!has(this.firewall_id) || this.firewall_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "!has(this.linode_id) || this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.lkecluster_id.positive"
    message: "lkecluster_id must be a positive integer"
    expression: "!has(this.lkecluster_id) || this.lkecluster_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.longviewclient_id.positive"
    message: "longviewclient_id must be a positive integer"
    expression: "!has(this.longviewclient_id) || this.longviewclient_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.nodebalancer_id.positive"
    message: "nodebalancer_id must be a positive integer"
    expression: "!has(this.nodebalancer_id) || this.nodebalancer_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.region.non_blank"
    message: "region must be a non-empty string"
    expression: "!has(this.region) || this.region.matches('[^ \\t\\r\\n]')"
  };
  // severity stays an int on the wire, so its legal set is a range rule rather
  // than an enum: an enum would send "3" where the API expects 3.
  option (buf.validate.message).cel = {
    id: "support_ticket_create.severity.range"
    message: "severity must be one of: 1, 2, 3"
    expression: "!has(this.severity) || (this.severity >= 1 && this.severity <= 3)"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.vlan.non_blank"
    message: "vlan must be a non-empty string"
    expression: "!has(this.vlan) || this.vlan.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.volume_id.positive"
    message: "volume_id must be a positive integer"
    expression: "!has(this.volume_id) || this.volume_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_create.vpc_id.positive"
    message: "vpc_id must be a positive integer"
    expression: "!has(this.vpc_id) || this.vpc_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Short summary for the support ticket.
  string summary = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Detailed support ticket description.
  string description = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Object Storage bucket related to the ticket (optional).
  optional string bucket = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Database ID related to the ticket (optional).
  optional int32 database_id = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Domain ID related to the ticket (optional).
  optional int32 domain_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Firewall ID related to the ticket (optional).
  optional int32 firewall_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Linode ID related to the ticket (optional).
  optional int32 linode_id = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // LKE cluster ID related to the ticket (optional).
  optional int32 lkecluster_id = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Longview client ID related to the ticket (optional).
  optional int32 longviewclient_id = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the ticket concerns a Managed service issue (optional).
  optional bool managed_issue = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // NodeBalancer ID related to the ticket (optional).
  optional int32 nodebalancer_id = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region related to the ticket (optional).
  optional string region = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Support ticket severity level 1, 2, or 3 (optional).
  optional int32 severity = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // VLAN related to the ticket (optional).
  optional string vlan = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Volume ID related to the ticket (optional).
  optional int32 volume_id = 16 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // VPC ID related to the ticket (optional).
  optional int32 vpc_id = 17 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm support ticket creation. Ignored when
  // dry_run=true.
  bool confirm = 18 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 19 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// SupportTicketCloseInput is the input contract for
// linode_support_ticket_close.
message SupportTicketCloseInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_close"
    method: "POST"
    path: "/support/tickets/{ticket_id}/close"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketIDResponse";
  option (linode.mcp.v1.tool_description) = "Closes one support ticket by ID. Pass dry_run=true to preview without closing.";
  option (linode.mcp.v1.error_message) = "Failed to close support ticket {ticket_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This closes a support ticket. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Support ticket closed successfully";
  // Go never retried this POST. Closing twice is arguably harmless, but the
  // three support writes answer retry the same way rather than one each.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the ticket a caller sees before closing it.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_support_ticket_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Support ticket {ticket_id} will be closed."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "support_ticket_close.ticket_id.positive"
    message: "ticket_id must be a positive integer"
    expression: "this.ticket_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Support ticket ID to close.
  int32 ticket_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm closing the support ticket. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// SupportTicketReplyListInput is the input contract for
// linode_support_ticket_reply_list.
message SupportTicketReplyListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_reply_list"
    method: "GET"
    path: "/support/tickets/{ticket_id}/replies"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketReplyListResponse";
  option (linode.mcp.v1.tool_description) = "Lists replies for one support ticket by ticket_id.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Support ticket ID whose replies should be listed.
  int32 ticket_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// SupportTicketReplyCreateInput is the input contract for
// linode_support_ticket_reply_create.
message SupportTicketReplyCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_reply_create"
    method: "POST"
    path: "/support/tickets/{ticket_id}/replies"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketReplyWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a reply on an existing support ticket.";
  option (linode.mcp.v1.error_message) = "Failed to create support ticket reply: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a support ticket reply. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Support ticket reply created successfully";
  // A replayed attempt would post the reply twice, so Go never retried this
  // POST and Python stops here.
  option (linode.mcp.v1.retry_disabled) = true;
  // The description is trimmed before anything reads it, which is what
  // Python has always sent.
  option (linode.mcp.v1.normalize_fields) = {
    field: "description"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the ticket the reply joins, which is the conversation the
  // request body does not carry.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_support_ticket_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "A reply will be posted to support ticket {ticket_id}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The path id is answered before the body value, which is the order both
  // languages report a call breaking both.
  option (buf.validate.message).cel = {
    id: "support_ticket_reply_create.ticket_id.positive"
    message: "ticket_id must be a positive integer"
    expression: "this.ticket_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_reply_create.description.required"
    message: "description is required"
    expression: "this.description.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Support ticket ID to reply to.
  int32 ticket_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Reply description to add to the support ticket.
  string description = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm support ticket reply creation. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// SupportTicketAttachmentCreateInput is the input contract for
// linode_support_ticket_attachment_create.
message SupportTicketAttachmentCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_support_ticket_attachment_create"
    method: "POST"
    path: "/support/tickets/{ticket_id}/attachments"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.SupportTicketIDResponse";
  option (linode.mcp.v1.tool_description) = "Creates an attachment on an existing support ticket.";
  option (linode.mcp.v1.error_message) = "Failed to create support ticket attachment: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a support ticket attachment. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Support ticket attachment created successfully";
  // Go never retried this POST, and the three support writes answer retry the
  // same way rather than one each.
  option (linode.mcp.v1.retry_disabled) = true;
  // The path is trimmed before anything reads it, so a path of spaces
  // answers "file is required" rather than reaching the absolute-path rule.
  option (linode.mcp.v1.normalize_fields) = {
    field: "file"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the ticket the file lands on. The file itself is neither
  // opened nor stat'd: a preview makes no call.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_support_ticket_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "A file attachment will be uploaded to support ticket {ticket_id}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The route consumes multipart/form-data assembled from the file's CONTENTS,
  // so the derived JSON body advertises the path without ever being what
  // travels.
  option (linode.mcp.v1.execute_transport) = {
    multipart {
      file_argument: "file"
      part_name: "file"
    }
  };

  // Ordered: the ticket before the file, then the file's presence before its
  // shape, so a caller hears about one thing at a time in the order they would
  // fix them.
  option (buf.validate.message).cel = {
    id: "support_ticket_attachment_create.ticket_id.positive"
    message: "ticket_id must be a positive integer"
    expression: "this.ticket_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_attachment_create.file.required"
    message: "file is required"
    expression: "this.file.matches('[^ \\t\\r\\n]')"
  };
  // Absoluteness is decided by the path text rather than by the host the server
  // happens to run on: both hand-written checks asked their own OS, so the same
  // call was legal on one platform and refused on another.
  option (buf.validate.message).cel = {
    id: "support_ticket_attachment_create.file.absolute"
    message: "file must be a local, absolute path"
    expression: "this.file.startsWith('/') || this.file.matches('^[A-Za-z]:')"
  };
  option (buf.validate.message).cel = {
    id: "support_ticket_attachment_create.file.extension"
    message: "file must have an accepted extension: .gif, .jpg, .jpeg, .pjpg, .pjpeg, .tif, .tiff, .png, .pdf, or .txt"
    expression: "this.file.matches('(?i)\\\\.(gif|jpe?g|pjpe?g|tiff?|png|pdf|txt)$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Support ticket ID to attach the file to.
  int32 ticket_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Absolute path to the local file to upload. Its contents become the
  // multipart body; the path itself never reaches the API.
  string file = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm support ticket attachment creation. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
