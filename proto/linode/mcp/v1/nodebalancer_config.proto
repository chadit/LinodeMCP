  option (linode.mcp.v1.confirm_message) = "This updates a NodeBalancer config. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "NodeBalancer config {id} updated successfully for NodeBalancer {nodebalancer_id}";
  option (linode.mcp.v1.retry_disabled) = true;
