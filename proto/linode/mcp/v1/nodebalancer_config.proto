// NodeBalancerConfigDeleteInput is the input contract for
// linode_nodebalancer_config_delete. This destroy does not use the two-stage
// flow, so there is no mode/plan_id (matches the registered schema).
message NodeBalancerConfigDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_config_delete"
    method: "DELETE"
    path: "/nodebalancers/{nodebalancer_id}/configs/{config_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerConfigDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer whose config should be deleted.
  int32 nodebalancer_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the NodeBalancer config to delete.
  int32 config_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm config deletion. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// NodeBalancerConfigRebuildInput is the input contract for
// linode_nodebalancer_config_rebuild. Rebuild replaces the config and its whole
// backend node set in one call, so it takes the same body as config create
// rather than only the two path IDs: whatever the body omits is reset to the
// API default rather than preserved. nodes is required by the API, but a
// repeated field is never emitted into the generated required set, so its
// required flag is dropped from the advertised schema (both handlers still
// enforce presence at runtime).
message NodeBalancerConfigRebuildInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_nodebalancer_config_rebuild"
    method: "POST"
    path: "/nodebalancers/{nodebalancer_id}/configs/{config_id}/rebuild"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.NodeBalancerConfigWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This rebuilds a NodeBalancer config. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Rebuilt config {config_id} for NodeBalancer {nodebalancer_id} successfully";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the NodeBalancer whose config should be rebuilt.
  int32 nodebalancer_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the NodeBalancer config to rebuild.
  int32 config_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm NodeBalancer config rebuild. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Optional TCP port this config listens on, from 1 through 65535.
  optional int32 port = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional protocol: http, https, tcp, or udp.
  optional NodeBalancerProtocol.Value protocol = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional balancing algorithm: roundrobin, leastconn, source, or ring_hash.
  optional NodeBalancerAlgorithm.Value algorithm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional session stickiness: none, table, http_cookie, session, or
  // source_ip (valid set depends on protocol).
  optional NodeBalancerStickiness.Value stickiness = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional health check mode: none, connection, http, or http_body.
  optional NodeBalancerCheck.Value check = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional health check interval in seconds.
  optional int32 check_interval = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional health check timeout in seconds.
  optional int32 check_timeout = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional health check attempt count.
  optional int32 check_attempts = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional HTTP health check path.
  optional string check_path = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional expected HTTP health check body.
  optional string check_body = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional health check port for UDP configs, from 1 through 65535.
  optional int32 udp_check_port = 16 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The complete backend node set the rebuilt config should have (required),
  // each an object with label, address, and optional weight, mode, and
  // subnet_id. Nodes absent from this list are removed from the config.
  repeated NodeBalancerConfigNodeItem nodes = 17 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}
