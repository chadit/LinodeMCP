// MonitorStreamDestinationCreateInput is the input contract for
// linode_monitor_stream_destination_create. details is a free-form object
// because its members are the ones the chosen type calls for, the same way the
// stream and alert-channel details are.
message MonitorStreamDestinationCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_stream_destination_create"
    method: "POST"
    path: "/monitor/streams/destinations"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorStreamDestinationWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a logs destination that monitoring streams can deliver to. Requires confirm=true. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.confirm_message) = "This creates a monitor stream destination. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Monitor stream destination '{label}' created";
  option (linode.mcp.v1.error_message) = "Failed to create monitor stream destination: {error}";
  // A replayed POST would create a second destination pointing at the same sync
  // point, so this one is not retried.
