syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// Tag mirrors the Linode tag object. The entity-ID lists are repeated fields,
// emitted as [] when empty (vs the Go struct's omitempty).
message Tag {
  string label = 1;
  repeated int32 domains = 2;
  repeated int32 linodes = 3;
  repeated int32 nodebalancers = 4;
  repeated int32 volumes = 5;
}

// TagWriteResponse is the {message, tag} envelope the linode_tag_create tool
// returns.
message TagWriteResponse {
  string message = 1;
  Tag tag = 2;
}

// TagListResponse is the {count, filter?, tags} envelope the linode_tag_list
// tool returns.
message TagListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated Tag tags = 3;
}

// TaggedObject mirrors one resource returned by GET /tags/{tag_label}. The API
// returns a different embedded resource per type (linode, domain, nodebalancer,
// volume, ...), so data is a google.protobuf.Struct that round-trips whatever
// the API embeds.
message TaggedObject {
  string type = 1;
  string label = 2;
  google.protobuf.Struct data = 3;
}

// TaggedObjectListResponse is the {count, filter?, tagged_objects} envelope the
// linode_tag_object_list tool returns. The tool paginates and has no filter
// param, so filter is omitted.
message TaggedObjectListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated TaggedObject tagged_objects = 3;
}

// TagListInput is the input contract for linode_tag_list.
message TagListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_tag_list"
    method: "GET"
    path: "/tags"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.TagListResponse";
  option (linode.mcp.v1.tool_description) = "Lists tags visible to the authenticated account.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// TagCreateInput is the input contract for linode_tag_create. label and
// confirm are required; the resource-ID arrays are optional.
message TagCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_tag_create"
    method: "POST"
    path: "/tags"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.TagWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a Linode tag and optionally applies it to existing resources. Pass dry_run=true to preview without creating the tag.";
  option (linode.mcp.v1.error_message) = "Failed to create tag: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a Linode tag. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Tag '{label}' created successfully";
  // Both languages have trimmed the label before sending it since the tool
  // was written, so the rule below judges the value that reaches the API.
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The tag the call would create; a create has no resource to read.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new tag \"{label}\" will be created."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "tag_create.label.required"
    message: "label is required"
    expression: "this.label != ''"
  };
  // Every id names a resource the tag is applied to, so zero and below is a
  // value no resource carries.
  option (buf.validate.message).cel = {
    id: "tag_create.domains.positive"
    message: "domains must be an array of positive integers"
    expression: "this.domains.all(id, id >= 1)"
  };
  option (buf.validate.message).cel = {
    id: "tag_create.linodes.positive"
    message: "linodes must be an array of positive integers"
    expression: "this.linodes.all(id, id >= 1)"
  };
  option (buf.validate.message).cel = {
    id: "tag_create.nodebalancers.positive"
    message: "nodebalancers must be an array of positive integers"
    expression: "this.nodebalancers.all(id, id >= 1)"
  };
  option (buf.validate.message).cel = {
    id: "tag_create.volumes.positive"
    message: "volumes must be an array of positive integers"
    expression: "this.volumes.all(id, id >= 1)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The tag label.
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional domain IDs to tag.
  repeated int32 domains = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional Linode IDs to tag.
  repeated int32 linodes = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional NodeBalancer IDs to tag.
  repeated int32 nodebalancers = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional volume IDs to tag.
  repeated int32 volumes = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm tag creation. Ignored when dry_run=true.
  bool confirm = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Optional reserved public IPv4 addresses to tag.
  repeated string reserved_ipv4_addresses = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// TagDeleteInput is the input contract for linode_tag_delete, a two-stage
// destroy addressed by tag label (tags have no numeric ID).
message TagDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_tag_delete"
    method: "DELETE"
    path: "/tags/{tag_label}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MessageResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a tag from all objects on the account. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "confirm must be true to delete a tag";
  option (linode.mcp.v1.success_message) = "Tag '{tag_label}' deleted successfully";
  option (linode.mcp.v1.resource_type) = "Tag";
  // Go has never retried this route, so a replay cannot re-run the delete
  // against a tag the first attempt already removed.
  option (linode.mcp.v1.retry_disabled) = true;
  // The objects carrying the tag are the state, envelope and all: the preview
  // reports the page and the walk names each object, while the envelope's own
  // total keeps a truncated first page from understating the blast radius.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_tag_object_list"
    envelope_state: true
  };
  option (linode.mcp.v1.dependency_walk) = {
    state_member: "data"
    emit: {
      kind_field: "type"
      kind_fallback: "resource"
      id_field: "data.id"
      action: "removed"
      note: "Loses this tag; the resource itself is not deleted."
    }
    warnings: {
      template: "Deleting this tag removes it from {max_results} tagged object(s); the objects are not deleted."
      when_any: true
    }
    warnings: {
      template: "Only the first {count} tagged object(s) are itemized in this preview."
      when_truncated: true
    }
  };

  // A label carrying these would address a route the caller never named: '?'
  // opens a query, '#' a fragment, and '..' climbs a segment.
  option (buf.validate.message).cel = {
    id: "tag_delete.tag_label.path_safe"
    message: "tag_label must not contain '?', '#', or '..'"
    expression: "!this.tag_label.contains('?') && !this.tag_label.contains('#') && !this.tag_label.contains('..')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Tag label to delete.
  string tag_label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm tag deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// TaggedObjectListInput is the input contract for linode_tag_object_list.
// Pairs with TaggedObjectListResponse.
message TaggedObjectListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_tag_object_list"
    method: "GET"
    path: "/tags/{tag_label}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.TaggedObjectListResponse";
  option (linode.mcp.v1.tool_description) = "Lists Linode objects that have the supplied tag label.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve items: {error}";

  // A tag label is the one path segment that may carry a slash, so it joins no
  // segment reader: "prod/web" is a label callers use and the client
  // percent-encodes it into one segment. The rules say what it must not carry
  // rather than what it must be, because free text has no shape to name.
  option (buf.validate.message).cel = {
    id: "tag_object_list.tag_label.non_blank"
    message: "tag_label must be a non-empty string"
    expression: "this.tag_label.matches('(?s)^.*\\\\S.*$')"
  };
  option (buf.validate.message).cel = {
    id: "tag_object_list.tag_label.url_safe"
    message: "tag_label must not contain '?', '#', or '..'"
    expression: "!this.tag_label.contains('?') && !this.tag_label.contains('#') && !this.tag_label.contains('..')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Tag label to list objects for.
  string tag_label = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_FREE_TEXT,
    (linode.mcp.v1.reader_message) = {
      absent: "tag_label must be a non-empty string"
      unusable: "tag_label must be a non-empty string"
    }
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}
