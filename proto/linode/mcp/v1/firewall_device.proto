syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "linode/mcp/v1/options.proto";

// FirewallDeviceType is the kind of resource a firewall device assignment
// attaches to. Values are the exact lowercase Linode API strings, authored from
// the live OpenAPI spec (POST /networking/firewalls/{firewallId}/devices). See
// the enum-wrapper convention in nodebalancer_config.proto.
message FirewallDeviceType {
  enum Value {
    unspecified = 0;
    linode = 1;
    nodebalancer = 2;
    linode_interface = 3;
  }
}

// FirewallDeviceEntity is the resource a firewall device is attached to.
// parent_entity is a nullable self-reference (omitted when unset).
message FirewallDeviceEntity {
  int32 id = 1;
  string label = 2;
  string type = 3;
  string url = 4;
  FirewallDeviceEntity parent_entity = 5;
}

// FirewallDevice mirrors one device attached to a Linode firewall.
message FirewallDevice {
  int32 id = 1;
  FirewallDeviceEntity entity = 2;
  string created = 3;
  string updated = 4;
}

// FirewallDeviceListResponse is the linode_firewall_device_list envelope: a
// count, an optional filter echo, and the devices attached to one firewall.
message FirewallDeviceListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated FirewallDevice devices = 3;
}

// FirewallDeviceGetInput is the input contract for linode_firewall_device_get.
message FirewallDeviceGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_device_get"
    method: "GET"
    path: "/networking/firewalls/{firewall_id}/devices/{device_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallDevice";
  option (linode.mcp.v1.tool_description) = "Gets one device assigned to a Cloud Firewall.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve device {device_id} on firewall {firewall_id}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall (required).
  int32 firewall_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // The ID of the firewall device to retrieve (required).
  int32 device_id = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID,
    // The device sentence is the client's own: it names the id in lower case
    // and without the argument prefix the firewall id takes.
    (linode.mcp.v1.reader_message) = {
      absent: "device id must be a positive integer"
      refused: "device id must be a positive integer"
    }
  ];
}

// FirewallDeviceListInput is the input contract for
// linode_firewall_device_list.
message FirewallDeviceListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_device_list"
    method: "GET"
    path: "/networking/firewalls/{firewall_id}/devices"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallDeviceListResponse";
  option (linode.mcp.v1.tool_description) = "Lists devices assigned to a Cloud Firewall.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall whose assigned devices should be listed.
  int32 firewall_id = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// FirewallDeviceCreateInput is the input contract for
// linode_firewall_device_create.
message FirewallDeviceCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_device_create"
    method: "POST"
    path: "/networking/firewalls/{firewall_id}/devices"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallDeviceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Assigns a Linode, Linode interface, or NodeBalancer device to a Cloud Firewall.";
  option (linode.mcp.v1.error_message) = "Failed to assign firewall device: {error}";
  option (linode.mcp.v1.confirm_message) = "This assigns a device to a Cloud Firewall. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Firewall device assigned successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The entity and the firewall it joins, which the body carries as bare ids.
  option (linode.mcp.v1.preview_sentence) = {
    template: "The {type} {id} will be attached to firewall {firewall_id}."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The rules are evaluated in the order written: the path id first, then the
  // body. type is a required enum, so an argument naming no member arrives as
  // the enum's zero exactly as an absent one does, and the two sentences the
  // hand-written tools kept apart ("device type is required" and the one-of)
  // collapse into the one-of, which is the informative half.
  option (buf.validate.message).cel = {
    id: "firewall_device_create.firewall_id.positive"
    message: "firewall_id must be a positive integer"
    expression: "this.firewall_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "firewall_device_create.id.positive"
    message: "id must be a positive integer"
    expression: "this.id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "firewall_device_create.type.known"
    message: "type must be one of: linode, nodebalancer, linode_interface"
    expression: "this.type != 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall to assign the device to.
  int32 firewall_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The positive ID of the Linode, Linode interface, or NodeBalancer to
  // assign.
  int32 id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Device type. Must be linode, nodebalancer, or linode_interface.
  FirewallDeviceType.Value type = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm firewall device assignment. Ignored when
  // dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// FirewallDeviceDeleteInput is the input contract for
// linode_firewall_device_delete.
message FirewallDeviceDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_firewall_device_delete"
    method: "DELETE"
    path: "/networking/firewalls/{firewall_id}/devices/{device_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_FIREWALL_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_NETWORKING};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.FirewallDeviceDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Removes one device assignment from a Cloud Firewall. Pass dry_run=true to preview without removing. Supports two-stage writes: mode=\"plan\" returns a plan_id; mode=\"apply\" with that plan_id re-checks for drift, then executes.";
  option (linode.mcp.v1.confirm_message) = "This removes a device assignment from a Cloud Firewall. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Firewall device removed successfully";
  option (linode.mcp.v1.resource_type) = "FirewallDevice";
  // A replayed removal would unassign a device the first attempt already
  // detached, and the entity may have been reassigned in between, so this route
  // is never retried. Go's hand client already refused to replay it; the
  // declaration is what carries that refusal to every language.
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.state_route) = {
    tool: "linode_firewall_device_get"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the firewall whose device assignment should be removed.
  int32 firewall_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The ID of the firewall device assignment to remove.
  int32 device_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm firewall device removal. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// FirewallDeviceWriteResponse is the {message, device} envelope the
// linode_firewall_device_create tool returns: a confirmation string plus the
// full FirewallDevice element the API returned when the device was assigned.
message FirewallDeviceWriteResponse {
  string message = 1;
  FirewallDevice device = 2;
}

// FirewallDeviceDeleteResponse is the id-echo envelope
// linode_firewall_device_delete returns: a confirmation message plus the parent
// firewall and removed device IDs. The delete endpoint returns an empty body,
// so the echo confirms the target.
message FirewallDeviceDeleteResponse {
  string message = 1;
  int32 firewall_id = 2;
  int32 device_id = 3;
}
