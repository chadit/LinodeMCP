// IamDelegationProfileChildAccountTokenCreateInput is the input contract for
// linode_iam_delegation_profile_child_account_token_create. This route replaces
// the deprecated POST /account/child-accounts/{euuid}/token.
//
// The route takes no body: the child account named in the path is the whole
// request.
message IamDelegationProfileChildAccountTokenCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_iam_delegation_profile_child_account_token_create"
    method: "POST"
    path: "/iam/delegation/profile/child-accounts/{euuid}/token"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.IamDelegationChildAccountTokenWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a short-lived token for calling one child account the authenticated user is delegated into. Requires confirm=true. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.confirm_message) = "This creates a delegate user token for a child account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Delegate user token created for child account '{euuid}'";
  option (linode.mcp.v1.warning_message) = "IMPORTANT: The token below is shown ONLY ONCE. Save it now - it cannot be retrieved later.";
  option (linode.mcp.v1.error_message) = "Failed to create a delegate user token for child account '{euuid}': {error}";
  // Converged with the deprecated child-account token create this route
  // replaces: a replayed POST mints a second live token the caller never sees
  // the secret for.
  option (linode.mcp.v1.retry_disabled) = true;

  option (buf.validate.message).cel = {
    id: "iam_delegation_profile_child_account_token_create.euuid.required"
    message: "euuid is required"
    expression: "this.euuid.matches('[^ \\t\\r\\n]')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // External unique identifier of the child account.
  string euuid = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm creating a delegate user token. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

