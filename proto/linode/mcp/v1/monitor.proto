syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// MonitorService mirrors a Linode Monitor supported service type.
message MonitorService {
  string label = 1;
  string service_type = 2;
}

// MonitorServiceGetInput is the input contract for linode_monitor_service_get.
message MonitorServiceGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_get"
    method: "GET"
    path: "/monitor/services/{service_type}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorService";
  option (linode.mcp.v1.tool_description) = "Gets details for one supported monitoring service type by service_type.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve monitor service {service_type}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The monitoring service type to retrieve (required).
  string service_type = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_SERVICE_TYPE_SLUG
  ];
}

// MonitorServiceListInput is the input contract for
// linode_monitor_service_list.
message MonitorServiceListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_list"
    method: "GET"
    path: "/monitor/services"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceListResponse";
  option (linode.mcp.v1.tool_description) = "Lists supported monitoring service types.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

