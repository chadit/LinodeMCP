  // Optional alert trigger conditions object.
  map<string, google.protobuf.Value> trigger_conditions = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm cloning an alert definition. Ignored when
  // dry_run=true.
  bool confirm = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Optional service entity IDs for an entity-scope clone.
  repeated string entity_ids = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional region IDs for a region-scope clone.
  repeated string regions = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

