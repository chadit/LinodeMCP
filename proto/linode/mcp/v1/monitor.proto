  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceDashboardListResponse";
  option (linode.mcp.v1.tool_description) = "Lists dashboards for one supported monitoring service type by service_type.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
