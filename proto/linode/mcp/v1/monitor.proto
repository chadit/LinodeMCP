syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "google/protobuf/struct.proto";
import "linode/mcp/v1/options.proto";

// MonitorService mirrors a Linode Monitor supported service type.
message MonitorService {
  string label = 1;
  string service_type = 2;
}

// MonitorServiceGetInput is the input contract for linode_monitor_service_get.
message MonitorServiceGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_get"
    method: "GET"
    path: "/monitor/services/{service_type}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorService";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The monitoring service type to retrieve (required).
  string service_type = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// MonitorServiceListInput is the input contract for
// linode_monitor_service_list.
message MonitorServiceListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_list"
    method: "GET"
    path: "/monitor/services"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// MonitorServiceDashboardListInput is the input contract for
// linode_monitor_service_dashboard_list.
message MonitorServiceDashboardListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_dashboard_list"
    method: "GET"
    path: "/monitor/services/{service_type}/dashboards"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceDashboardListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug whose dashboards should be listed.
  string service_type = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

