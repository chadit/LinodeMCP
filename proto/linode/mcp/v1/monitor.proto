  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceAlertDefinitionListResponse";
  option (linode.mcp.v1.tool_description) = "Lists alert definitions for one supported monitoring service type by service_type.";

