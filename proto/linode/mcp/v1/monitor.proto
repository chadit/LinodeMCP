  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertChannelDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes one monitoring alert channel by channel_id, which stops delivery for every alert that uses it. Requires confirm=true. Pass dry_run=true to preview without deleting.";
  option (linode.mcp.v1.confirm_message) = "This deletes a monitor alert channel and stops delivery for the alerts that use it. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Monitor alert channel {channel_id} deleted";
  option (linode.mcp.v1.error_message) = "Failed to delete monitor alert channel {channel_id}: {error}";
  // A replay would report a channel the first attempt already removed as one
  // that never existed.
  option (linode.mcp.v1.retry_disabled) = true;

  option (buf.validate.message).cel = {
    id: "monitor_alert_channel_delete.channel_id.positive"
    message: "channel_id must be a positive integer"
    expression: "this.channel_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Alert channel ID to delete.
  int32 channel_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm deleting an alert channel. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// MonitorServiceListResponse is the linode_monitor_service_list envelope: count
// and the full proto MonitorService elements. The tool has no filter param, so
// filter is omitted.
message MonitorServiceListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorService services = 3;
}

// MonitorAlertDefinition mirrors a Linode Monitor alert definition. criteria,
// rule_criteria, and trigger_conditions are arbitrary JSON objects the API
// returns verbatim, so they are modeled as google.protobuf.Struct.
message MonitorAlertDefinition {
  int32 id = 1;
  string label = 2;
  string type = 3;
  string service_type = 4;
  string description = 5;
  int32 severity = 6;
  string status = 7;
  google.protobuf.Struct criteria = 8;
  google.protobuf.Struct rule_criteria = 9;
  google.protobuf.Struct trigger_conditions = 10;
  repeated int32 channel_ids = 11;
  repeated string entity_ids = 12;
  // Fields used to group alert data.
  repeated string group_by = 13;
  // Classification describing where the alert definition applies.
  string scope = 14;
  // Region IDs targeted by a region-scope alert definition.
  repeated string regions = 15;
}

// MonitorAlertDefinitionListResponse is the
// linode_monitor_alert_definition_list envelope: count and the full proto
// MonitorAlertDefinition elements. The tool paginates and has no filter param,
// so filter is omitted.
message MonitorAlertDefinitionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorAlertDefinition alert_definitions = 3;
}

// MonitorServiceAlertDefinitionListResponse is the
// linode_monitor_service_alert_definition_list envelope: count and the full
// proto MonitorAlertDefinition elements for one service type. The tool keys off
// a required service_type path-id and has no filter param, so filter is omitted.
// It reuses the MonitorAlertDefinition element but is a distinct list-response
// message from the top-level linode_monitor_alert_definition_list.
message MonitorServiceAlertDefinitionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorAlertDefinition alert_definitions = 3;
}

// MonitorServiceMetricQueryResponse is the
// linode_monitor_service_metric_query envelope: a confirmation message, the
// queried service type, and the metrics payload. The metrics endpoint returns
// an arbitrary JSON object the API leaves untyped, so metrics is modeled as
// google.protobuf.Struct to round-trip any shape identically on both languages.
message MonitorServiceMetricQueryResponse {
  string message = 1;
  string service_type = 2;
  google.protobuf.Struct metrics = 3;
}

// MonitorAlertDefinitionWriteResponse is the
// linode_monitor_service_alert_definition_create, _clone, and _update
// envelope: a confirmation message plus the full MonitorAlertDefinition
// element decoded from the API body.
message MonitorAlertDefinitionWriteResponse {
  string message = 1;
  MonitorAlertDefinition alert_definition = 2;
}

// MonitorAlertDefinitionDeleteResponse is the
// linode_monitor_service_alert_definition_delete envelope: a confirmation
// message plus the service type and alert ID the delete acted on. The delete
// endpoint returns an empty body, so these id echoes confirm the target.
message MonitorAlertDefinitionDeleteResponse {
  string message = 1;
  string service_type = 2;
  int32 alert_id = 3;
}

// MonitorMetricDefinition mirrors a Linode Monitor metric definition as returned
// by the per-service metric-definitions endpoint.
message MonitorMetricDefinition {
  string label = 1;
  string metric = 2;
  string metric_type = 3;
}

// MonitorServiceMetricDefinitionListResponse is the
// linode_monitor_service_metric_definition_list envelope: count and the full
// proto MonitorMetricDefinition elements for one service type. The tool keys off
// a required service_type path-id and has no filter param, so filter is omitted.
message MonitorServiceMetricDefinitionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorMetricDefinition metric_definitions = 3;
}

// MonitorAlertChannelType is the delivery mechanism an alert channel uses. See
// the enum-wrapper convention in nodebalancer_config.proto.
message MonitorAlertChannelType {
  enum Value {
    unspecified = 0;
    email = 1;
  }
}

// MonitorAlertChannelEmailContent is the email delivery settings of an alert
// channel. The API computes it, so it never travels in a request body.
message MonitorAlertChannelEmailContent {
  repeated string email_addresses = 1;
}

// MonitorAlertChannelContent is the read-only delivery settings of an alert
// channel.
message MonitorAlertChannelContent {
  MonitorAlertChannelEmailContent email = 1;
}

// MonitorAlertChannelEmailDetails is the writable email delivery settings of an
// alert channel.
message MonitorAlertChannelEmailDetails {
  string recipient_type = 1;
  repeated string usernames = 2;
}

// MonitorAlertChannelDetails is the writable half of a channel's delivery
// settings, distinct from the content the API computes from it.
message MonitorAlertChannelDetails {
  MonitorAlertChannelEmailDetails email = 1;
}

// MonitorAlertChannelAlertSummary is the count-and-link summary a channel
// carries for the alerts using it; the entries themselves live behind /alerts.
message MonitorAlertChannelAlertSummary {
  int32 alert_count = 1;
  string type = 2;
  string url = 3;
}

// MonitorAlertChannelAlert is one alert entry from a channel's /alerts route.
message MonitorAlertChannelAlert {
  int32 id = 1;
  string label = 2;
  string type = 3;
  string url = 4;
  string service_type = 5;
}

// MonitorAlertChannel mirrors a Linode Monitor alert channel. alerts is one
// summary object, not a list: a repeated field here fails to decode every
// non-empty channel the API returns.
message MonitorAlertChannel {
  int32 id = 1;
  string label = 2;
  string type = 3;
  string channel_type = 4;
  MonitorAlertChannelContent content = 5;
  MonitorAlertChannelAlertSummary alerts = 6;
  string created = 7;
  string created_by = 8;
  string updated = 9;
  string updated_by = 10;
  MonitorAlertChannelDetails details = 11;
}

// MonitorAlertChannelListResponse is the linode_monitor_alert_channel_list
// envelope: count and the full proto MonitorAlertChannel elements. The tool has
// no filter param, so filter is omitted.
message MonitorAlertChannelListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorAlertChannel alert_channels = 3;
}

// MonitorAlertChannelAlertListResponse is the
// linode_monitor_alert_channel_alert_list envelope: count and the alerts using
// one channel. The tool has no filter param, so filter is omitted.
message MonitorAlertChannelAlertListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorAlertChannelAlert alerts = 3;
}

// MonitorAlertChannelWriteResponse is the linode_monitor_alert_channel_create
// and _update envelope: a confirmation message plus the channel the API
// returned.
message MonitorAlertChannelWriteResponse {
  string message = 1;
  MonitorAlertChannel alert_channel = 2;
}

// MonitorAlertChannelDeleteResponse is the linode_monitor_alert_channel_delete
// envelope: a confirmation message plus the channel ID the delete acted on. The
// route answers with an empty body, so the echo is what confirms the target.
message MonitorAlertChannelDeleteResponse {
  string message = 1;
  int32 channel_id = 2;
}

// MonitorDashboard mirrors a Linode Monitor dashboard. The live API returns the
// scalar metadata (id, label, type, service_type) plus a widgets array whose
// per-widget fields the API returns verbatim and the upstream type leaves
// untyped. Each widget is modeled as google.protobuf.Struct so any widget shape
// round-trips identically on both languages without guessing field names, the
// same way MonitorAlertDefinition handles arbitrary JSON.
message MonitorDashboard {
  int32 id = 1;
  string label = 2;
  string type = 3;
  string service_type = 4;
  repeated google.protobuf.Struct widgets = 5;
}

// MonitorDashboardListResponse is the linode_monitor_dashboard_list envelope:
// count and the full proto MonitorDashboard elements. The tool paginates and has
// no filter param, so filter is omitted.
message MonitorDashboardListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorDashboard dashboards = 3;
}

// MonitorServiceDashboardListResponse is the
// linode_monitor_service_dashboard_list envelope: count and the full proto
// MonitorDashboard elements for one service type. The tool keys off a required
// service_type path-id and has no filter param, so filter is omitted. It reuses
// the MonitorDashboard element but is a distinct list-response message from the
// top-level linode_monitor_dashboard_list.
message MonitorServiceDashboardListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorDashboard dashboards = 3;
}

// MonitorAlertDefinitionEntity is one resource an alert definition watches.
//
// id is a google.protobuf.Value because the API types it per entity kind: an
// integer for a Managed Database node, a string for an Object Storage hostname.
// The same passthrough carries AccountEventEntity.id for the same reason; do not
// narrow it to a string, which would fail to decode every integer id.
message MonitorAlertDefinitionEntity {
  google.protobuf.Value id = 1;
  string label = 2;
  string type = 3;
  string url = 4;
}

// MonitorAlertDefinitionEntityListResponse is the
// linode_monitor_service_alert_definition_entity_list envelope: count and the
// full proto MonitorAlertDefinitionEntity elements. The tool has no filter
// param, so filter is omitted.
message MonitorAlertDefinitionEntityListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated MonitorAlertDefinitionEntity entities = 3;
}

// MonitorAlertDefinitionEntityListInput is the input contract for
// linode_monitor_service_alert_definition_entity_list. The route publishes no
// page controls in the reviewed spec snapshot, so no page/page_size travels here
// even though the answer arrives in a paginated envelope.
message MonitorAlertDefinitionEntityListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_alert_definition_entity_list"
    method: "GET"
    path: "/monitor/services/{service_type}/alert-definitions/{alert_id}/entities"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertDefinitionEntityListResponse";
  option (linode.mcp.v1.tool_description) = "Lists the entities one alert definition watches, by service_type and alert_id.";
  option (linode.mcp.v1.error_message) = "Failed to list entities for alert definition {alert_id}: {error}";

  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_entity_list.service_type.required"
    message: "service_type is required"
    expression: "this.service_type.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_entity_list.alert_id.positive"
    message: "alert_id must be a positive integer"
    expression: "this.alert_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug the alert definition belongs to.
  string service_type = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Alert definition ID whose entities should be listed.
  int32 alert_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}
