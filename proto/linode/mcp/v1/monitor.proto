// MonitorServiceMetricQueryInput is the input contract for
// linode_monitor_service_metric_query. The route reads rather than changes
// anything, so it takes no confirm and sends the empty body its only POST-tier
// sibling sends. It advertises service_type alone (the ground-truth dump
// confirms).
message MonitorServiceMetricQueryInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_metric_query"
    method: "POST"
    path: "/monitor/services/{service_type}/metrics"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {none: true};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceMetricQueryResponse";
  option (linode.mcp.v1.tool_description) = "Gets metrics for one supported monitoring service type by service_type.";
  option (linode.mcp.v1.success_message) = "Monitor service metrics read for '{service_type}'";
  option (linode.mcp.v1.error_message) = "Failed to retrieve monitor service metrics for '{service_type}': {error}";
  option (linode.mcp.v1.retry_disabled) = true;

  // The same slug rule the sibling delete carries, word for word: one
  // service-type slug filling a path segment.
  option (buf.validate.message).cel = {
    id: "monitor_service_metric_query.service_type.slug"
    message: "service_type must be a single non-empty service type slug"
    expression: "this.service_type.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug whose metrics should be retrieved.
  string service_type = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// MonitorAlertDefinitionGetInput is the input contract for
// linode_monitor_service_alert_definition_get (service-scoped alert
// definition, addressed by service_type + alert_id).
message MonitorAlertDefinitionGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_alert_definition_get"
    method: "GET"
    path: "/monitor/services/{service_type}/alert-definitions/{alert_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertDefinition";
  option (linode.mcp.v1.tool_description) = "Gets one alert definition for one supported monitoring service type by service_type and alert_id.";
  option (linode.mcp.v1.error_message) = "Failed to retrieve alert definition {alert_id} for monitor service {service_type}: {error}";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug whose alert definition should be
  // retrieved.
  string service_type = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_SERVICE_TYPE_SLUG
  ];
  // Alert definition ID to retrieve.
  int32 alert_id = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_POSITIVE_ID
  ];
}

// MonitorAlertDefinitionDeleteInput is the input contract for
// linode_monitor_service_alert_definition_delete. Plain confirm destroy.
// Pairs with MonitorAlertDefinitionDeleteResponse.
message MonitorAlertDefinitionDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_alert_definition_delete"
    method: "DELETE"
    path: "/monitor/services/{service_type}/alert-definitions/{alert_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertDefinitionDeleteResponse";
  option (linode.mcp.v1.tool_description) = "Deletes one alert definition for a supported monitoring service type by service_type and alert_id. Requires confirm=true. Pass dry_run=true to preview without deleting.";
  option (linode.mcp.v1.confirm_message) = "This deletes a monitor alert definition. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Monitor service alert definition {alert_id} deleted for '{service_type}'";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the alert definition, which is what the preview reports.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_monitor_service_alert_definition_get"
  };

  // One service-type slug: lowercase letters and digits, hyphens only between
  // them, and no surrounding whitespace, since the value fills a path segment.
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_delete.service_type.slug"
    message: "service_type must be a single non-empty service type slug"
    expression: "this.service_type.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug whose alert definition should be
  // deleted.
  string service_type = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Alert definition ID to delete.
  int32 alert_id = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm deleting an alert definition. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// MonitorAlertScope is the breadth an alert definition applies to. The API
// documents exactly one value today, but declares it as a closed set rather
// than free-form text, so it is wrapped like the other closed sets (see
// FirewallTemplateSlug in firewall.proto for the same situation).
message MonitorAlertScope {
  enum Value {
    unspecified = 0;
    account = 1;
  }
}

// MonitorServiceTokenCreateInput is the input contract for
// linode_monitor_service_token_create. entity_ids is a required array of
// positive integer entity IDs in the hand-built schema, but repeated fields
// are never emitted into the generated required set, so it converts to an
// optional-in-schema field enforced by the handler at runtime.
message MonitorServiceTokenCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_token_create"
    method: "POST"
    path: "/monitor/services/{service_type}/token"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorServiceTokenCreateResponse";
  option (linode.mcp.v1.tool_description) = "Creates a token for one supported monitoring service type. The token is returned only once and cannot be retrieved later; capture both `token` and `expiry` from the response. Requires confirm=true. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.confirm_message) = "This creates a monitor service token. Set confirm=true to proceed.";
  option (linode.mcp.v1.retry_disabled) = true;
  // The slug addresses a path segment, so a value the route cannot carry never
  // reaches the wire.
  option (linode.mcp.v1.error_message) = "Failed to create monitor service token for '{service_type}': {error}";

  option (buf.validate.message).cel = {
    id: "monitor_service_token_create.entity_ids.non_empty_positive"
    message: "entity_ids must be a non-empty array of positive integers"
    expression: "size(this.entity_ids) >= 1 && this.entity_ids.all(id, id >= 1)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug for the token.
  string service_type = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_SERVICE_TYPE_SLUG
  ];
  // Service entity IDs to include in the token (non-empty positive integers).
  repeated int32 entity_ids = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm creating a monitor service token. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Optional string the token request carries alongside entity_ids. The API
  // documents it only as an untyped string with no described meaning, so it is
  // passed through verbatim rather than interpreted.
  optional string add = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// MonitorServiceTokenCreateResponse is the linode_monitor_service_token_create
// success body: the bare token object the Monitor API returns, passed through
// unwrapped so the caller can capture the token for the metrics query host.
message MonitorServiceTokenCreateResponse {
  // Bearer token for querying the monitor metrics API.
  string token = 1;
  // Token expiry timestamp.
  string expiry = 2;
}

// MonitorServiceAlertDefinitionCreateInput is the input contract for
// linode_monitor_service_alert_definition_create. rule_criteria and
// trigger_conditions are free-form objects (map), channel_ids is a required
// int array, and entity_ids is a string array; the required map/array fields
// drop out of the generated required set (handler still enforces them).
message MonitorServiceAlertDefinitionCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_alert_definition_create"
    method: "POST"
    path: "/monitor/services/{service_type}/alert-definitions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertDefinitionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates an alert definition for one supported monitoring service type. Requires confirm=true. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.confirm_message) = "This creates a monitor alert definition. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Monitor service alert definition created for '{service_type}'";
  option (linode.mcp.v1.retry_disabled) = true;
  // The label is trimmed before anything reads it, so the non-blank rule
  // below judges the value the request carries.
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  option (linode.mcp.v1.error_message) = "Failed to create monitor alert definition for '{service_type}': {error}";

  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.label.non_blank"
    message: "label must be a non-empty string"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.severity.known"
    message: "severity must be one of: 0, 1, 2, 3"
    expression: "this.severity >= 0 && this.severity <= 3"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.rule_criteria.non_empty"
    message: "rule_criteria must be a non-empty object"
    expression: "size(this.rule_criteria) >= 1"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.trigger_conditions.non_empty"
    message: "trigger_conditions must be a non-empty object"
    expression: "size(this.trigger_conditions) >= 1"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.channel_ids.non_empty_positive"
    message: "channel_ids must be a non-empty array of positive integers"
    expression: "size(this.channel_ids) >= 1 && this.channel_ids.all(id, id >= 1)"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.entity_ids.items"
    message: "entity_ids must be an array of non-empty strings"
    expression: "this.entity_ids.all(entity, entity.matches('[^ \\t\\r\\n]'))"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, and this tool has always answered both the same way.
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.scope.known"
    message: "scope must be one of: account"
    expression: "this.scope != 0"
  };
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_create.group_by.items"
    message: "group_by must be an array of non-empty strings"
    expression: "this.group_by.all(field, field.matches('[^ \\t\\r\\n]'))"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Supported monitoring service type slug for the alert definition.
  string service_type = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_SERVICE_TYPE_SLUG
  ];
  // Alert definition label.
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Alert severity: 0 severe, 1 medium, 2 low, or 3 info.
  int32 severity = 4 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // 0 is a legal severity, so an absent argument and a severe one reach the
    // range rule above as the same number; only the map read tells them apart.
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT
  ];
  // Alert rule criteria object.
  map<string, google.protobuf.Value> rule_criteria = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Alert trigger conditions object.
  map<string, google.protobuf.Value> trigger_conditions = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Alert channel IDs (non-empty positive integers).
  repeated int32 channel_ids = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional alert definition description.
  optional string description = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional service entity IDs.
  repeated string entity_ids = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm creating an alert definition. Ignored when
  // dry_run=true.
  bool confirm = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The breadth the alert applies to: account (required).
  MonitorAlertScope.Value scope = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Optional fields used to group alert data.
  repeated string group_by = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

// MonitorServiceAlertDefinitionCloneInput is the input contract for
// linode_monitor_service_alert_definition_clone. label is the only required
// request-body field; the remaining clone overrides are optional.
message MonitorServiceAlertDefinitionCloneInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_monitor_service_alert_definition_clone"
    method: "POST"
    path: "/monitor/services/{service_type}/alert-definitions/{alert_id}/clone"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_MONITOR_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_MONITOR};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MonitorAlertDefinitionWriteResponse";
  option (linode.mcp.v1.tool_description) = "Clones one alert definition for a supported monitoring service type. Requires confirm=true. Pass dry_run=true to preview without cloning.";
  option (linode.mcp.v1.confirm_message) = "This clones a monitor alert definition. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Monitor alert definition {alert_id} cloned";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the definition being copied, which is what the overrides in
  // the request body do not say.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_monitor_service_alert_definition_get"
  };
  option (linode.mcp.v1.error_message) = "Failed to clone monitor alert definition {alert_id} for '{service_type}': {error}";

  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_clone.label.non_blank"
    message: "label must be a non-empty string"
    expression: "this.label.matches('[^ \\t\\r\\n]')"
  };
  // An explicitly empty list passes and travels: a clone that overrides the
  // source's channels with none is the caller asking for exactly that.
  option (buf.validate.message).cel = {
    id: "monitor_service_alert_definition_clone.channel_ids.positive"
