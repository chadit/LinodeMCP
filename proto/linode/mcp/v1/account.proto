// linode_account_payment_method_make_default.
message AccountPaymentMethodMakeDefaultInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_payment_method_make_default"
    method: "POST"
    path: "/account/payment-methods/{payment_method_id}/make-default"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountPaymentMethodIDResponse";
  option (linode.mcp.v1.tool_description) = "Sets a payment method as the authenticated account default.";
  option (linode.mcp.v1.error_message) = "Failed to make payment method {payment_method_id} the default: {error}";
  option (linode.mcp.v1.confirm_message) = "This changes the default payment method. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Payment method set as default successfully";
  // The read is the payment method that becomes the default.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_account_payment_method_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "The selected account payment method becomes the default."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (buf.validate.message).cel = {
    id: "account_payment_method_make_default.payment_method_id.positive"
    message: "payment_method_id must be a positive integer"
    expression: "this.payment_method_id > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Payment method ID (required).
  int32 payment_method_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm changing the default payment method. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// AccountPromoCreditAddInput is the input contract for
// linode_account_promo_credit_add.
message AccountPromoCreditAddInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_promo_credit_add"
    method: "POST"
    path: "/account/promo-codes"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_ONLY};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountPromoResponse";
  option (linode.mcp.v1.tool_description) = "Applies a promo credit to the authenticated account.";
  option (linode.mcp.v1.error_message) = "Failed to apply the promo code: {error}";
  option (linode.mcp.v1.confirm_message) = "This applies a promo credit to the account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Account promo credit applied successfully";
  // What a code does once applied; the credit it carries is not readable first.
  option (linode.mcp.v1.preview_sentence) = {
    template: "The promo code is applied to the account and may add account credit."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // A code travels in the body untouched, so the whitespace a caller pasted
  // around it is refused here rather than sent.
  option (buf.validate.message).cel = {
    id: "account_promo_credit_add.promo_code.required"
    message: "promo_code is required"
    expression: "this.promo_code != ''"
  };
  option (buf.validate.message).cel = {
    id: "account_promo_credit_add.promo_code.non_blank"
    message: "promo_code must be a non-empty string"
    expression: "this.promo_code.matches('(?s)^.*\\\\S.*$')"
  };
  option (buf.validate.message).cel = {
    id: "account_promo_credit_add.promo_code.trimmed"
    message: "promo_code must not include leading or trailing whitespace"
    expression: "this.promo_code.matches('(?s)^\\\\S(.*\\\\S)?$')"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Promo code to apply to the account (required).
  string promo_code = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm applying a promo credit. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// AccountSettingsManagedEnableInput is the input contract for
// linode_account_settings_managed_enable. confirm is the only required field.
message AccountSettingsManagedEnableInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_settings_managed_enable"
    method: "POST"
    path: "/account/settings/managed-enable"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.MessageResponse";
  option (linode.mcp.v1.tool_description) = "Enables Linode Managed for the account. Pass dry_run=true to preview without enabling.";
  option (linode.mcp.v1.error_message) = "Failed to enable Linode Managed: {error}";
  option (linode.mcp.v1.confirm_message) = "This enables Linode Managed for the account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Linode Managed enabled successfully";
