// AccountPaymentCreateInput is the input contract for
// linode_account_payment_create. usd and confirm are required; usd stays a
// string because the API takes a decimal-string amount.
message AccountPaymentCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_payment_create"
    method: "POST"
    path: "/account/payments"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountPaymentWriteResponse";
  option (linode.mcp.v1.tool_description) = "Makes a payment on the authenticated account.";
  option (linode.mcp.v1.error_message) = "Failed to create the payment: {error}";
  option (linode.mcp.v1.confirm_message) = "This makes an account payment. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Account payment created successfully";
  // A replayed attempt would charge the account twice, so neither language
  // retried this POST before it was declared.
  option (linode.mcp.v1.retry_disabled) = true;
  // usd is the value both languages have always put on the wire, trimmed. An
  // explicit-null payment_method_id is omitted by the body builder, which is
  // what Python's hand-written body used to do. preview carries the sentence
  // Python had and Go did not: the money leaves the account.
  option (linode.mcp.v1.normalize_fields) = {
    field: "usd"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The money leaving is the consequence; the request carries only an amount.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A payment is created on the Linode account."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // An amount the caller left out reads as the empty string here, so the rule
  // stands aside for it and the reader on the field answers "usd is required".
  // The accepted set is the amount the API bills: a positive number of dollars
  // and at most two cents digits, which is the narrower of the two the hand
  // handlers took.
  option (buf.validate.message).cel = {
    id: "account_payment_create.usd.amount"
    message: "usd must be a positive dollar amount with up to two decimals"
    expression: "this.usd == '' || (this.usd.matches('^[0-9]+([.][0-9]{1,2})?$') && !this.usd.matches('^0+([.]0{1,2})?$'))"
  };
  option (buf.validate.message).cel = {
    id: "account_payment_create.payment_method_id.positive"
    message: "payment_method_id must be a positive integer"
    expression: "!has(this.payment_method_id) || this.payment_method_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Payment method ID to charge (optional).
  optional int32 payment_method_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Payment amount in USD, as a decimal string (e.g. "25.50") (required).
  string usd = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_TEXT
  ];
  // Must be true to confirm making an account payment. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

