  // it on.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_account_settings_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Linode Managed is enabled for this account."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Must be true to confirm enabling Linode Managed. Ignored when
  // dry_run=true.
  bool confirm = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// AccountSettingsUpdateInput is the input contract for
// linode_account_settings_update. Only confirm is required; every setting is
// optional.
message AccountSettingsUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_settings_update"
    method: "PUT"
    path: "/account/settings"
  };

  option (buf.validate.message).cel = {
    id: "account_settings_update.maintenance_policy.known"
    message: "maintenance_policy must be one of: linode/migrate, linode/power_off_on"
    expression: "!has(this.maintenance_policy) || this.maintenance_policy in ['linode/migrate','linode/power_off_on']"
  };
  option (buf.validate.message).cel = {
    id: "account_settings_update.interfaces_for_new_linodes.known"
    message: "interfaces_for_new_linodes must be one of: legacy_config_only, legacy_config_default_but_linode_allowed, linode_default_but_legacy_config_allowed, linode_only"
    expression: "!has(this.interfaces_for_new_linodes) || this.interfaces_for_new_linodes in ['legacy_config_only','legacy_config_default_but_linode_allowed','linode_default_but_legacy_config_allowed','linode_only']"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountSettingsWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates account-wide settings such as backups, network helper, object storage, interfaces, and maintenance policy.";
  option (linode.mcp.v1.error_message) = "Failed to update account settings: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates account-wide settings. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Account settings updated successfully";
  // A replayed PUT would reapply settings the first attempt may already have
  // changed, so neither language retried it before it was declared.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the settings the change is diffed against.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_account_settings_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Linode account settings are updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // A setting the message does not declare is dropped before the rules run, so
  // the argument map is the only place a caller's typo is still visible.
  option (linode.mcp.v1.refuse_unknown_arguments) = {
    message: "Unsupported account settings field(s): {fields}"
  };
  option (linode.mcp.v1.require_any_of) = {
    fields: "backups_enabled"
    fields: "network_helper"
    fields: "interfaces_for_new_linodes"
    fields: "maintenance_policy"
    fields: "object_storage"
    message: "at least one account settings field is required"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Whether backups are enabled by default for new Linodes (optional).
  optional bool backups_enabled = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_BOOL
  ];
  // Default interface generation mode for new Linodes (optional).
  optional string interfaces_for_new_linodes = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // The map read is the only answer left for a value the caller did not send
    // as a string, because a body field that is not one stops the message being
    // built. The string member rather than the text one so a blank reaches the
    // CEL rule that names the modes the account offers.
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_STRING
  ];
  reserved 4;
  reserved "longview_subscription";
  // Default maintenance policy for the account (optional).
  optional string maintenance_policy = 5 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // The map read is the only answer left for a value the caller did not send
    // as a string, because a body field that is not one stops the message being
    // built. The string member rather than the text one so a blank reaches the
    // CEL rule that names the policies the account offers.
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_STRING
  ];
  reserved 6;
  reserved "managed";
  // Whether Network Helper is enabled by default (optional).
  optional bool network_helper = 7 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_BOOL
  ];
  // Object Storage subscription status or tier (optional).
  optional string object_storage = 8 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // The map read is the only answer left for a value the caller did not send
    // as a string, because a body field that is not one stops the message being
    // built. The string member rather than the text one because no rule holds
    // this field to a value: a blank travels to the route.
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_STRING
  ];
  // Must be true to confirm account settings update. Ignored when
  // dry_run=true.
  bool confirm = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// AccountUpdateInput is the input contract for linode_account_update. Only
// confirm is required; every billing/contact field is optional.
message AccountUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_update"
    method: "PUT"
    path: "/account"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates account billing and contact information. Pass dry_run=true to preview without updating.";
  option (linode.mcp.v1.error_message) = "Failed to update account: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates account billing/contact information. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Account updated successfully";
  // A replayed PUT would reapply billing and contact values the first attempt
  // may already have changed, so neither language retried it before it was
  // declared.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the account the change is diffed against. No prose: both
  // languages reported the fetch alone.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_account_get"
  };
  // A PUT naming no billing or contact field would change nothing. The
  // sentence is declared because it names the family rather than listing
  // twelve fields.
  option (linode.mcp.v1.require_any_of) = {
    fields: "address_1"
    fields: "address_2"
    fields: "city"
    fields: "company"
    fields: "country"
    fields: "email"
    fields: "first_name"
    fields: "last_name"
    fields: "phone"
    fields: "state"
    fields: "tax_id"
    fields: "zip"
    message: "at least one account field is required"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // First line of the account billing address (optional).
  optional string address_1 = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Second line of the account billing address (optional).
  optional string address_2 = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // City for the account address (optional).
  optional string city = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Company name assigned to the account (optional).
  optional string company = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Two-letter ISO 3166 country code (optional).
  optional string country = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Email address assigned to the account (optional).
  optional string email = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // First name assigned to the account (optional).
  optional string first_name = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Last name assigned to the account (optional).
  optional string last_name = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Phone number assigned to the account (optional).
  optional string phone = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // State, province, or territory for the account address (optional).
  optional string state = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Tax identification number, or an empty string if not applicable
  // (optional).
  optional string tax_id = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Zip or postal code for the account address (optional).
  optional string zip = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm account update. Ignored when dry_run=true.
  bool confirm = 14 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 15 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
