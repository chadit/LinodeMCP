// AccountChildAccountTokenCreateInput is the input contract for
// linode_account_child_account_token_create. euuid and confirm are required.
// Linode deprecated this route in favor of
// POST /iam/delegation/profile/child-accounts/{euuid}/token, which this repo
// now serves as linode_iam_delegation_profile_child_account_token_create. This
// tool stays on the deprecated route until the API withdraws it, since the two
// mint tokens through different account models.
message AccountChildAccountTokenCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_child_account_token_create"
    method: "POST"
    path: "/account/child-accounts/{euuid}/token"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountChildAccountTokenWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a short-lived proxy user token for one child-level account.";
  option (linode.mcp.v1.error_message) = "Failed to create child account token: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a proxy user token for a child account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Child account proxy token created successfully";
  // A replayed POST would mint a second live proxy token, so neither language
  // retried it before it was declared.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the child account the proxy token is minted for.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_account_child_account_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "A proxy user token is created for the selected child account."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // External unique identifier for the child account (required).
  string euuid = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_PATH,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PATH_SAFE_TEXT
  ];
  // Must be true to confirm proxy user token creation. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

