// AccountPaymentMethodCreateInput is the input contract for
// linode_account_payment_method_create. data is a free-form object (the payload
// varies by payment method type: credit card, Google Pay, PayPal), so it maps to
// a google.protobuf.Value map. It is required at runtime but a map field cannot
// be marked required in the generated schema, so the required flag is dropped
// (the rules below still enforce presence).
message AccountPaymentMethodCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_payment_method_create"
    method: "POST"
    path: "/account/payment-methods"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.AccountPaymentMethodWriteResponse";
  option (linode.mcp.v1.tool_description) = "Adds a payment method to the authenticated account.";
  option (linode.mcp.v1.error_message) = "Failed to create the payment method: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a payment method. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Payment method created successfully";
  // A replayed attempt would file the card twice, so neither language retried
  // this POST before it was declared.
  option (linode.mcp.v1.retry_disabled) = true;
  // What filing a method does to the account, which the request does not say.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new account payment method is created and may become the default payment method."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // A blank type is the caller who named no method at all, which is why it is
  // answered apart from a type this endpoint does not take.
  option (buf.validate.message).cel = {
    id: "account_payment_method_create.type.required"
    message: "type is required"
    expression: "this.type.matches('(?s)^.*\\\\S.*$')"
  };
  // The API accepts only credit_card here; Google Pay and PayPal are added
  // through the Cloud Manager, not this endpoint. Written as a one-member
  // set so the value vocabulary reads the same way every other documented set
  // does (post-payment-method: Allowed: credit_card).
  option (buf.validate.message).cel = {
    id: "account_payment_method_create.type.known"
    message: "type must be credit_card"
    expression: "this.type in ['credit_card']"
  };
  // An empty object is the same call as no object: there is no method to file
  // without the details, so both are refused with the one sentence.
  option (buf.validate.message).cel = {
    id: "account_payment_method_create.data.required"
    message: "data is required"
    expression: "size(this.data) > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Payment method details. The shape varies by payment method type. Required at
  // runtime, though the generated schema cannot mark a map field required.
  map<string, google.protobuf.Value> data = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // Card details are the one argument a preview must not echo: a dry run is
    // read and pasted far more widely than the request it stands for.
    (linode.mcp.v1.preview_redact) = true
  ];
  // Whether to set this as the default payment method (required). An
  // implicit-presence bool reads absent and false alike, so the reader asks
  // the argument map which the caller meant.
  bool is_default = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_BOOL
  ];
  // Payment method type (e.g. "credit_card", "google_pay", "paypal") (required).
  string type = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm adding a payment method. Ignored when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

