// AccountOAuthClientCreateInput is the input contract for
// linode_account_oauth_client_create. label, redirect_uri, and confirm are
// required.
message AccountOAuthClientCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_account_oauth_client_create"
    method: "POST"
    path: "/account/oauth-clients"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_scopes) = {scope: TOOL_SCOPE_ACCOUNT_READ_WRITE};
  option (linode.mcp.v1.tool_categories) = {category: TOOL_CATEGORY_ACCOUNT};
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.OAuthClientCreateWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates an account OAuth client. WARNING: The secret is only shown once in the response and cannot be retrieved later.";
  option (linode.mcp.v1.error_message) = "Failed to create OAuth client: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates an OAuth client. The secret is only shown once. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "OAuth client created successfully";
  option (linode.mcp.v1.warning_message) = "IMPORTANT: The secret below is shown ONLY ONCE. Save it now - it cannot be retrieved later.";
  // The server assigns the client id, so a replay after a timeout leaves a
  // second OAuth client behind whose secret no caller ever saw.
  option (linode.mcp.v1.retry_disabled) = true;
  // What a created client leaves behind; the client does not exist yet.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A new account OAuth client is created. The returned client secret is shown once and cannot be retrieved later."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the OAuth client (required). Every unusable shape answers the
  // one required sentence, which a rule on a presence-free string cannot say.
  string label = 2 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_TEXT
  ];
  // Redirect URI for the OAuth client (required).
  string redirect_uri = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.argument_reader) = ARGUMENT_READER_PRESENT_TEXT
  ];
  // Must be true to confirm OAuth client creation. The secret is only shown
  // once. Ignored when dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Whether the client is public, meaning it skips the OAuth consent screen
  // for users on this account (required, defaults to false). It is a plain
  // bool for the same reason IPAddressAllocateInput.public is: the API
  // documents it as required, so it belongs in the generated required set.
  bool public = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
}

