syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// UDF is one user-defined field declared by a StackScript.
message UDF {
  string label = 1;
  string name = 2;
  string example = 3;
  string oneof = 4;
  string default = 5;
}

// StackScript mirrors a Linode StackScript. images and user_defined_fields are
// repeated (emitted as []).
message StackScript {
  string username = 1;
  string user_gravatar_id = 2;
  string label = 3;
  string description = 4;
  repeated string images = 5;
  string created = 6;
  string updated = 7;
  string script = 8;
  repeated UDF user_defined_fields = 9;
  int32 id = 10;
  int32 deployments_total = 11;
  int32 deployments_active = 12;
  bool is_public = 13;
  bool mine = 14;
}

// StackScriptListResponse is the linode_stackscript_list envelope: count, an
// optional filter echo (is_public / mine / label_contains, joined with ", "),
// and the full proto StackScript elements.
message StackScriptListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated StackScript stackscripts = 3;
}

// StackScriptGetInput is the input contract for linode_stackscript_get.
message StackScriptGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_stackscript_get"
    method: "GET"
    path: "/linode/stackscripts/{stackscript_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.StackScript";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the StackScript to retrieve (required).
  int32 stackscript_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// StackScriptWriteResponse is the {message, stackscript} envelope the
// linode_stackscript_create / linode_stackscript_update tools return: a
// confirmation string plus the full StackScript element the API returned.
message StackScriptWriteResponse {
  string message = 1;
  StackScript stackscript = 2;
}

// StackScriptDeleteResponse is the id-echo envelope linode_stackscript_delete
// returns: a confirmation message plus the deleted StackScript's ID. The delete
// endpoint returns an empty body, so the id echo confirms the target.
message StackScriptDeleteResponse {
  string message = 1;
  int32 stackscript_id = 2;
}

// StackScriptListInput is the input contract for linode_stackscript_list.
// The filters are client-side string filters ("true"/"false" for the
// booleans), matching the hand-built schema.
message StackScriptListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_stackscript_list"
    method: "GET"
    path: "/linode/stackscripts"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.StackScriptListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Filter by public status (true, false).
  optional string is_public = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter by ownership - only your own StackScripts (true, false).
  optional string mine = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Filter StackScripts by label containing this string (case-insensitive).
  optional string label_contains = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Page of results to return (optional, minimum 1).
  optional int32 page = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// StackScriptCreateInput is the input contract for linode_stackscript_create.
// label, script, and confirm are required. images is a required array of image
// ID strings in the hand-built schema, but repeated fields are never emitted
// into the generated required list, so it becomes optional here (the handler
// still rejects an empty images list at runtime).
message StackScriptCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_stackscript_create"
    method: "POST"
    path: "/linode/stackscripts"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.StackScriptWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This creates a new StackScript in your account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "StackScript '{label}' (ID: {id}) created successfully";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // A label for the StackScript (max 64 characters, must be unique).
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // The script content (bash, compatible with the selected images).
  string script = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Image IDs that the StackScript supports (e.g., ["linode/debian12",
  // "linode/ubuntu24.04"]).
  repeated string images = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A description of the StackScript.
  optional string description = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the StackScript should be public (default: false).
  optional bool is_public = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A revision note for this version of the StackScript.
  optional string rev_note = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm StackScript creation. Ignored when
  // dry_run=true.
  bool confirm = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// StackScriptUpdateInput is the input contract for linode_stackscript_update.
// stackscript_id and confirm are required; at least one mutable field must be
// supplied (handler-enforced). images stays optional here (repeated fields
// are never required in the generated schema, and the ground truth agrees).
message StackScriptUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_stackscript_update"
    method: "PUT"
    path: "/linode/stackscripts/{stackscript_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_WRITE;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.StackScriptWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This updates a StackScript in your account. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "StackScript '{label}' (ID: {id}) updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the StackScript to update.
  int32 stackscript_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // New label for the StackScript (max 64 characters, must be unique).
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New script content (bash, compatible with the selected images).
  optional string script = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Image IDs that the StackScript supports (e.g., ["linode/debian12",
  // "linode/ubuntu24.04"]).
  repeated string images = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // New description of the StackScript.
  optional string description = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Whether the StackScript should be public.
  optional bool is_public = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // A revision note for this version of the StackScript.
  optional string rev_note = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be set to true to confirm the StackScript update. Ignored when
  // dry_run=true.
  bool confirm = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// StackScriptDeleteInput is the input contract for linode_stackscript_delete,
// a two-stage destroy.
message StackScriptDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_stackscript_delete"
    method: "DELETE"
    path: "/linode/stackscripts/{stackscript_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_DESTROY;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.StackScriptDeleteResponse";
  option (linode.mcp.v1.confirm_message) = "This operation is destructive. Set confirm=true to proceed.";
  option (linode.mcp.v1.resource_type) = "StackScript";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The ID of the StackScript to delete.
  int32 stackscript_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be set to true to confirm deletion. Ignored when dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Two-stage flow: "plan" previews and returns a plan_id; "apply" with plan_id
  // re-checks drift and executes. Omit for a single-step call.
  optional string mode = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The plan_id returned by a mode:"plan" call, supplied with mode:"apply" to
  // execute it.
  optional string plan_id = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}
