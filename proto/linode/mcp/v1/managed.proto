// ManagedLinodeSettingsUpdateInput is the input contract for
// linode_managed_linode_settings_update. linode_id and confirm are required.
// The ssh param is a required object { access: bool, ip: string, port: int
// (1-65535), user: string }; it is rendered here as
// map<string, google.protobuf.Value> (top-level object), which drops the
// required flag and the inner detail. The handler still enforces presence and
// at least one mutable SSH setting.
message ManagedLinodeSettingsUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_linode_settings_update"
    method: "PUT"
    path: "/managed/linode-settings/{linode_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedLinodeSettingsWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates Managed service SSH settings for one Linode.";
  option (linode.mcp.v1.error_message) = "Failed to update managed settings for instance {linode_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates Managed Linode settings. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed Linode settings for Linode {linode_id} updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the SSH block the update replaces.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_managed_linode_settings_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Managed SSH settings are updated for the selected Linode."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The SSH block. Each member carries its own kind, its own bounds, and a
  // null that clears the setting, none of which a rule sees inside a map.
  option (linode.mcp.v1.object_walk) = {
    field: "ssh"
    members: {
      unknown: "{field} contains unsupported fields: {keys}"
      member: {
        name: "access"
        value: {
          kind: VALUE_KIND_BOOL
          unusable: "{field}.{key} must be a boolean"
        }
      }
      member: {
        name: "ip"
        value: {
          kind: VALUE_KIND_TEXT
          non_blank: true
          unusable: "{field}.{key} must be a non-empty string"
        }
      }
      member: {
        name: "port"
        value: {
          kind: VALUE_KIND_INT
          nullable: true
          minimum: 1
          maximum: 65535
          unusable: "{field}.{key} must be an integer from {minimum} to {maximum} or null"
        }
      }
      member: {
        name: "user"
        value: {
          kind: VALUE_KIND_TEXT
          nullable: true
          max_length: 32
          unusable: "{field}.{key} must be a string up to {max_length} characters or null"
        }
      }
    }
  };

  // ssh is a map, which carries no presence bit, so its size is what folds an
  // absent object and an empty one into the sentence both used to answer. A
  // value that is not an object is answered by the body builder instead.
  option (buf.validate.message).cel = {
    id: "managed_linode_settings_update.linode_id.positive"
    message: "linode_id must be a positive integer"
    expression: "this.linode_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "managed_linode_settings_update.ssh.required"
    message: "ssh is required and must be an object"
    expression: "size(this.ssh) > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The numeric Linode ID whose Managed settings should be updated.
  int32 linode_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // SSH settings object: { access: bool, ip: string, port: int (1-65535),
  // user: string }.
  map<string, google.protobuf.Value> ssh = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm updating Managed Linode settings. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

