  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedServiceListResponse";
  option (linode.mcp.v1.tool_description) = "Lists services monitored by Linode Managed.";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Page of results to return (optional, minimum 1).
  optional int32 page = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
  // Number of results per page (optional, 25-500).
  optional int32 page_size = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_QUERY];
}

// ManagedServiceCreateInput is the input contract for
// linode_managed_service_create. address, label, service_type, timeout, and
// confirm are required.
message ManagedServiceCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_service_create"
    method: "POST"
    path: "/managed/services"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedServiceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a Managed service monitor.";
  option (linode.mcp.v1.error_message) = "Failed to create the managed service: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a Managed service monitor. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed service monitor {id} created successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    field: "service_type"
    field: "address"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // What the POST does; there is no monitor to read yet.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A Managed service monitor is created."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The four members the API assigns.
  option (linode.mcp.v1.refuse_arguments) = {
    fields: "created"
    fields: "id"
    fields: "status"
    fields: "updated"
    message: "Read-only fields are not accepted: {fields}"
  };

  // The four rules run in the order the hand handlers checked them, which is
  // what keeps a call missing several of them answering the same sentence it
  // used to. service_type reads as the number it holds because that is the only
  // spelling both CEL runtimes accept, and an argument naming no member arrives
  // as the zero an absent one does, so one rule answers for both.
  option (buf.validate.message).cel = {
    id: "managed_service_create.label.required"
    message: "label is required"
    expression: "this.label != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_create.service_type.known"
    message: "service_type must be one of: tcp, url"
    expression: "this.service_type != 0"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_create.address.required"
    message: "address is required"
    expression: "this.address != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_create.timeout.range"
    message: "timeout must be an integer between 1 and 255"
    expression: "this.timeout >= 1 && this.timeout <= 255"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the Managed service.
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Monitor type: tcp or url.
  ManagedServiceType.Value service_type = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // URL or address monitored by the service.
  string address = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Timeout in seconds, 1-255.
  int32 timeout = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Expected response body text for URL monitors.
  optional string body = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Managed contact group to consult when an issue is detected.
  optional string consultation_group = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Managed credential IDs used when resolving service issues.
  repeated int32 credentials = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Notes for responders.
  optional string notes = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region for private IP services.
  optional string region = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm Managed service creation. Ignored when
  // dry_run=true.
  bool confirm = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ManagedServiceUpdateInput is the input contract for
// linode_managed_service_update. service_id and confirm are required; all
// mutable fields are optional.
message ManagedServiceUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_service_update"
    method: "PUT"
    path: "/managed/services/{service_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedServiceWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates a service monitored by Linode Managed. Pass dry_run=true to preview without modifying.";
  option (linode.mcp.v1.error_message) = "Failed to update managed service {service_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a Managed service monitor. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed service monitor {service_id} updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  // The nullable members beside these are left as sent: a null is a value
  // there, and a string with spaces in it is the caller's.
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    field: "address"
    field: "consultation_group"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the monitor whose settings the update replaces.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_managed_service_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Managed service monitor {service_id} will be updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  option (linode.mcp.v1.refuse_arguments) = {
    fields: "created"
    fields: "id"
    fields: "status"
    fields: "updated"
    message: "Read-only fields are not accepted: {fields}"
  };
  // An explicit null counts as a change: it is how the API is told to clear a
  // member, so presence rather than value is what this asks.
  option (linode.mcp.v1.require_any_of) = {
    fields: "label"
    fields: "service_type"
    fields: "address"
    fields: "timeout"
    fields: "body"
    fields: "consultation_group"
    fields: "credentials"
    fields: "notes"
    fields: "region"
    message: "at least one managed service field is required"
  };

  option (buf.validate.message).cel = {
    id: "managed_service_update.service_id.positive"
    message: "service_id must be a positive integer"
    expression: "this.service_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_update.label.nonblank"
    message: "label must be a non-empty string"
    expression: "!has(this.label) || this.label != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_update.address.nonblank"
    message: "address must be a non-empty string"
    expression: "!has(this.address) || this.address != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_update.consultation_group.nonblank"
    message: "consultation_group must be a non-empty string"
    expression: "!has(this.consultation_group) || this.consultation_group != ''"
  };
  // An enum argument naming no member arrives as the enum's zero, the same as
  // an absent one, so presence is what tells the two apart.
  option (buf.validate.message).cel = {
    id: "managed_service_update.service_type.known"
    message: "service_type must be one of: tcp, url"
    expression: "!has(this.service_type) || this.service_type != 0"
  };
  option (buf.validate.message).cel = {
    id: "managed_service_update.timeout.range"
    message: "timeout must be an integer between 1 and 255"
    expression: "!has(this.timeout) || (this.timeout >= 1 && this.timeout <= 255)"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The numeric Managed service monitor ID to update.
  int32 service_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Updated label for the Managed service.
  optional string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated monitor type: tcp or url.
  optional ManagedServiceType.Value service_type = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated URL or address monitored by the service.
  optional string address = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated timeout in seconds, 1-255.
  optional int32 timeout = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated expected response body text for URL monitors. An explicit null
  // erases it, which is how the API spells "stop matching a body".
  optional string body = 7 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Updated Managed contact group to consult when an issue is detected.
  optional string consultation_group = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated Managed credential IDs used when resolving service issues.
  repeated int32 credentials = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated notes for responders. An explicit null erases them.
  optional string notes = 10 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Updated region for private IP services. An explicit null erases it.
  optional string region = 11 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Must be true to confirm Managed service update. Ignored when dry_run=true.
  bool confirm = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 13 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ManagedServiceDeleteInput is the input contract for
// linode_managed_service_delete. Plain confirm destroy.
message ManagedServiceDeleteInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_service_delete"
    method: "DELETE"
    path: "/managed/services/{service_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedServiceIDResponse";
  option (linode.mcp.v1.tool_description) = "Deletes a service monitored by Linode Managed. Pass dry_run=true to preview without deleting.";
  // Undeclared before: Go assembled "Failed to delete <tool name>" in its shared
  // delete helper, so the sentence is stated here naming the resource instead.
  option (linode.mcp.v1.error_message) = "Failed to delete Managed service monitor: {error}";
  option (linode.mcp.v1.confirm_message) = "This deletes a Managed service monitor. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed service deleted successfully";
  // Neither language retried this DELETE, matching the enable and disable
  // actions on the same monitor.
  option (linode.mcp.v1.retry_disabled) = true;
  // The read is the monitor a caller sees before it stops being watched.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_managed_service_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Managed service monitor {service_id} will be deleted."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "managed_service_delete.service_id.positive"
    message: "service_id must be a positive integer"
    expression: "this.service_id >= 1"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The Managed service monitor ID to delete.
  int32 service_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Must be true to confirm Managed service deletion. Ignored when
  // dry_run=true.
  bool confirm = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

