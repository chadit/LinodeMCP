// ManagedContactCreateInput is the input contract for
// linode_managed_contact_create. Only confirm is required. The phone param is
// an object { primary: string, secondary: string }; it is rendered as
// map<string, google.protobuf.Value> (top-level object), which drops the inner
// detail (the handler still parses primary/secondary).
message ManagedContactCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_contact_create"
    method: "POST"
    path: "/managed/contacts"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedContactWriteResponse";
  option (linode.mcp.v1.tool_description) = "Creates a managed contact for service monitor issue handling. Pass dry_run=true to preview without creating.";
  option (linode.mcp.v1.error_message) = "Failed to create the managed contact: {error}";
  option (linode.mcp.v1.confirm_message) = "This creates a managed contact. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed contact {id} created successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.normalize_fields) = {
    field: "name"
    field: "email"
    field: "group"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // What the POST does; there is no contact to read yet.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A Managed contact is created."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The API assigns both, so a caller naming either is answering for a value
  // the route would ignore.
  option (linode.mcp.v1.refuse_arguments) = {
    fields: ["id", "updated"]
    message: "id and updated are read-only and cannot be set when creating a managed contact"
  };
  // The phone object. A value that is not an object is left to the body
  // builder, which words that for every free-form member alike.
  option (linode.mcp.v1.object_walk) = {
    field: "phone"
    members: {
      unknown: "{field} has unknown fields: {keys}"
      key: ["primary", "secondary"]
      value: {
        kind: VALUE_KIND_TEXT
        nullable: true
        non_blank: true
        unusable: "{field}.{key} must be a non-empty string or null"
      }
      require: {
        name: ["primary", "secondary"]
        any_of: "phone must include primary or secondary"
      }
    }
  };

  // The three text rules run ahead of the at-least-one rule, the order the hand
  // handlers checked them in. phone is a map, which carries no presence bit, so
  // its size is what says the caller sent one.
  option (buf.validate.message).cel = {
    id: "managed_contact_create.name.nonblank"
    message: "name must be a non-empty string"
    expression: "!has(this.name) || this.name != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_contact_create.email.nonblank"
    message: "email must be a non-empty string"
    expression: "!has(this.email) || this.email != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_contact_create.group.nonblank"
    message: "group must be a non-empty string"
    expression: "!has(this.group) || this.group != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_contact_create.fields.required"
    message: "at least one managed contact field is required"
    expression: "has(this.name) || has(this.email) || has(this.group) || size(this.phone) > 0"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Name for the Managed contact (optional).
  optional string name = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Email address for the Managed contact (optional).
  optional string email = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Display grouping for the Managed contact (optional).
  optional string group = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Phone numbers object: { primary: string, secondary: string } (optional).
  map<string, google.protobuf.Value> phone = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm Managed contact creation. Ignored when
  // dry_run=true.
  bool confirm = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ManagedContactUpdateInput is the input contract for
// linode_managed_contact_update. contact_id and confirm are required. The
// phone param is an object { primary: string, secondary: string }; it is
// rendered as map<string, google.protobuf.Value> (top-level object), which
// drops the inner detail (the handler still parses primary/secondary).
message ManagedContactUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_contact_update"
    method: "PUT"
    path: "/managed/contacts/{contact_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedContactWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates a contact configured for Linode Managed service alerts.";
  option (linode.mcp.v1.error_message) = "Failed to update managed contact {contact_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a Managed contact. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed contact {contact_id} updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.normalize_fields) = {
    field: "name"
    field: "email"
    field: "group"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the contact details the update replaces.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_managed_contact_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Managed contact {contact_id} will be updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  // The API assigns both, so a caller naming either is answering for a value
  // the route would ignore.
  option (linode.mcp.v1.refuse_arguments) = {
    fields: ["id", "updated"]
    message: "Read-only fields are not accepted: {fields}"
  };
  // An explicit null counts as naming a field: it is how the API is told to
  // clear one, so a call carrying only that is a real update.
  option (linode.mcp.v1.require_any_of) = {
    fields: ["name", "email", "group", "phone"]
    message: "at least one mutable contact field is required"
  };
  option (linode.mcp.v1.object_walk) = {
    field: "phone"
    members: {
      unknown: "{field} has unknown fields: {keys}"
      key: ["primary", "secondary"]
      value: {
        kind: VALUE_KIND_TEXT
        nullable: true
        non_blank: true
        unusable: "{field}.{key} must be a non-empty string or null"
      }
      require: {
        name: ["primary", "secondary"]
        any_of: "phone must include primary or secondary"
      }
    }
  };

  option (buf.validate.message).cel = {
    id: "managed_contact_update.contact_id.positive"
    message: "contact_id must be a positive integer"
    expression: "this.contact_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "managed_contact_update.email.nonblank"
    message: "email must be a non-empty string"
    expression: "!has(this.email) || this.email != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_contact_update.name.nonblank"
    message: "name must be a non-empty string"
    expression: "!has(this.name) || this.name != ''"
  };
  // A null clears the group, so only a supplied string is held to being one.
  option (buf.validate.message).cel = {
    id: "managed_contact_update.group.nonblank"
    message: "group must be a non-empty string or null"
    expression: "!has(this.group) || this.group != ''"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The numeric Managed contact ID to update.
  int32 contact_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Updated contact name (optional).
  optional string name = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated contact email address (optional).
  optional string email = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Updated contact group (optional). An explicit null erases it.
  optional string group = 5 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    (linode.mcp.v1.body_nullable) = true
  ];
  // Updated phone numbers object: { primary: string, secondary: string }
  // (optional).
  map<string, google.protobuf.Value> phone = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm updating the Managed contact. Ignored when
  // dry_run=true.
  bool confirm = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ManagedContactDeleteInput is the input contract for
