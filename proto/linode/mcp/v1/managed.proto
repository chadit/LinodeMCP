    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // What the POST does; the secret in the body reaches the report redacted.
  option (linode.mcp.v1.preview_sentence) = {
    template: "A Managed credential is created."
    line: PREVIEW_LINE_SIDE_EFFECT
  };

  option (buf.validate.message).cel = {
    id: "managed_credential_create.label.required"
    message: "label is required"
    expression: "this.label != ''"
  };
  option (buf.validate.message).cel = {
    id: "managed_credential_create.secret.required"
    message: "password is required"
    expression: "this.password.matches('[^ \\t\\r\\n]')"
  };
  option (buf.validate.message).cel = {
    id: "managed_credential_create.username.nonblank"
    message: "username must be a non-empty string"
    expression: "!has(this.username) || this.username != ''"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the Managed credential.
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Password to store for the Managed credential.
  string password = 3 [
    (linode.mcp.v1.field_location) = FIELD_LOCATION_BODY,
    // The secret is the one argument a preview must not echo: a dry run is
    // read and pasted more widely than the request it stands for.
    (linode.mcp.v1.preview_redact) = true
  ];
  // Username to store for the Managed credential.
  optional string username = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm creating a stored Managed credential. Ignored
  // when dry_run=true.
  bool confirm = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

// ManagedCredentialUpdateInput is the input contract for
// linode_managed_credential_update. credential_id, label, and confirm are
// required.
message ManagedCredentialUpdateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_credential_update"
    method: "PUT"
    path: "/managed/credentials/{credential_id}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedCredentialWriteResponse";
  option (linode.mcp.v1.tool_description) = "Updates one stored managed credential by ID. Pass dry_run=true to preview without modifying.";
  option (linode.mcp.v1.error_message) = "Failed to update managed credential {credential_id}: {error}";
  option (linode.mcp.v1.confirm_message) = "This updates a Managed credential. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed credential {credential_id} updated successfully";
  option (linode.mcp.v1.retry_disabled) = true;
  option (linode.mcp.v1.normalize_fields) = {
    field: "label"
    transform: NORMALIZE_TRANSFORM_TRIM
  };
  // The read is the credential the update replaces; its GET never carries
  // the secret.
  option (linode.mcp.v1.state_route) = {
    tool: "linode_managed_credential_get"
  };
  option (linode.mcp.v1.preview_sentence) = {
    template: "Managed credential {credential_id} will be updated."
    line: PREVIEW_LINE_SIDE_EFFECT
  };
  // The two members the API assigns. Neither is a field here, so nothing else
  // sees a caller who sets one.
  option (linode.mcp.v1.refuse_arguments) = {
    fields: "id"
    fields: "last_decrypted"
    message: "Read-only fields are not accepted: {fields}"
  };

  option (buf.validate.message).cel = {
    id: "managed_credential_update.credential_id.positive"
    message: "credential_id must be a positive integer"
    expression: "this.credential_id >= 1"
  };
  option (buf.validate.message).cel = {
    id: "managed_credential_update.label.required"
    message: "label is required"
    expression: "this.label != ''"
  };

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The numeric Managed credential ID to update.
  int32 credential_id = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // Updated credential label.
  string label = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm updating the Managed credential. Ignored when
  // dry_run=true.
  bool confirm = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

