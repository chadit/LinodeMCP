// ManagedServiceCreateInput is the input contract for
// linode_managed_service_create. address, label, service_type, timeout, and
// confirm are required.
message ManagedServiceCreateInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_managed_service_create"
    method: "POST"
    path: "/managed/services"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_ADMIN;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.ManagedServiceWriteResponse";
  option (linode.mcp.v1.confirm_message) = "This creates a Managed service monitor. Set confirm=true to proceed.";
  option (linode.mcp.v1.success_message) = "Managed service monitor {id} created successfully";
  option (linode.mcp.v1.retry_disabled) = true;

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Label for the Managed service.
  string label = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Monitor type: tcp or url.
  ManagedServiceType.Value service_type = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // URL or address monitored by the service.
  string address = 4 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Timeout in seconds, 1-255.
  int32 timeout = 5 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Expected response body text for URL monitors.
  optional string body = 6 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Managed contact group to consult when an issue is detected.
  optional string consultation_group = 7 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Managed credential IDs used when resolving service issues.
  repeated int32 credentials = 8 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Notes for responders.
  optional string notes = 9 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Region for private IP services.
  optional string region = 10 [(linode.mcp.v1.field_location) = FIELD_LOCATION_BODY];
  // Must be true to confirm Managed service creation. Ignored when
  // dry_run=true.
  bool confirm = 11 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // Preview the call without making it: returns the would-be request and
  // current resource state. Default false.
  optional bool dry_run = 12 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
}

