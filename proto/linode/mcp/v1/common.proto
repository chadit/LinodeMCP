syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

// MessageResponse is the bare {message} envelope a write tool returns when the
// API action has no resource body to echo (the endpoint returns an empty body
// and there are no useful id echoes). Shared across tools whose only output is a
// human-readable confirmation string.
message MessageResponse {
  string message = 1;
}

// DiskEncryption is the at-rest encryption toggle the API documents with the
// same enabled/disabled set on every resource that offers it: the
// disk_encryption field of LKE node pools and Linode instances, and the
// encryption field of Block Storage volumes. It lives here rather than in one
// resource's file because more than one file needs it, following the enum
// wrapper convention documented in nodebalancer_config.proto.
message DiskEncryption {
  enum Value {
    unspecified = 0;
    disabled = 1;
    enabled = 2;
  }
}

// LKETier is the service tier an LKE cluster runs on: enterprise unlocks the
// enterprise-only cluster features (Kubernetes versions per node pool, rolling
// update strategies), standard is the default offering. Values are the exact
// lowercase Linode API strings, authored from the live OpenAPI spec
// (POST /lke/clusters). It lives here for the reason DiskEncryption does: the
// cluster create input and the tier-version routes both need it, and two
// byte-identical copies of one set is what lets them drift.
message LKETier {
  enum Value {
    unspecified = 0;
    standard = 1;
    enterprise = 2;
  }
}
