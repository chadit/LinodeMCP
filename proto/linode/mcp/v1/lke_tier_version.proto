syntax = "proto3";

package linode.mcp.v1;

option go_package = "github.com/chadit/LinodeMCP/go/internal/genpb/linode/mcp/v1;linodev1";

import "linode/mcp/v1/options.proto";

// LKETier is the service tier of an LKE cluster. Values are the exact lowercase
// Linode API strings, authored from the live OpenAPI spec (POST /lke/clusters).
// See the enum-wrapper convention in nodebalancer_config.proto.
message LKETier {
  enum Value {
    unspecified = 0;
    standard = 1;
    enterprise = 2;
  }
}

// LKETierVersion is one Kubernetes version available for a specific LKE tier.
message LKETierVersion {
  string id = 1;
  string tier = 2;
}

// LKETierVersionListResponse is the {count, filter?, tier_versions} envelope the
// linode_lke_tier_version_list tool returns for a requested tier.
message LKETierVersionListResponse {
  int32 count = 1;
  optional string filter = 2;
  repeated LKETierVersion tier_versions = 3;
}

// LKETierVersionGetInput is the input contract for linode_lke_tier_version_get.
message LKETierVersionGetInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_tier_version_get"
    method: "GET"
    path: "/lke/tiers/{tier}/versions/{version}"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKETierVersion";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // The LKE tier ID, standard or enterprise (required).
  LKETier.Value tier = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
  // The Kubernetes version ID (required).
  string version = 3 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}

// LKETierVersionListInput is the input contract for
// linode_lke_tier_version_list.
message LKETierVersionListInput {
  option (linode.mcp.v1.tool_route) = {
    tool: "linode_lke_tier_version_list"
    method: "GET"
    path: "/lke/tiers/{tier}/versions"
  };
  option (linode.mcp.v1.tool_capability) = TOOL_CAPABILITY_READ;
  option (linode.mcp.v1.tool_response) = "linode.mcp.v1.LKETierVersionListResponse";

  // Linode environment to use (optional, defaults to "default").
  optional string environment = 1 [(linode.mcp.v1.field_location) = FIELD_LOCATION_LOCAL]; // system param
  // LKE tier: standard or enterprise (required).
  LKETier.Value tier = 2 [(linode.mcp.v1.field_location) = FIELD_LOCATION_PATH];
}
