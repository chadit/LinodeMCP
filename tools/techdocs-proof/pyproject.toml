# Tool project, deliberately separate from python/ (the shipped package).
# It is never installed with the server, never imported by it, and carries no
# runtime dependencies: the comparator is stdlib plus the `buf` and `gh`
# binaries it shells out to. Keeping it a project of its own is what makes
# "not part of the shipped package" a fact the build enforces rather than a
# convention someone remembers.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techdocs-proof"
version = "0.1.0"
description = "Compare rendered Linode TechDocs against the LinodeMCP proto contract"
requires-python = ">=3.14.7"
license = { text = "MIT" }
authors = [{ name = "LinodeMCP Contributors" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/techdocs_proof"]

# Same rule set, line length, and target version as the shipped package, then
# the handful of relaxations a one-file command-line tool earns. Mirrors what
# scripts/ruff.toml does for the gate scripts.
[tool.ruff]
extend = "../../python/pyproject.toml"

[tool.ruff.lint]
extend-ignore = [
    "T201",    # print: the command reports its result on stdout by design
    "S603",    # subprocess call: fixed argv, no shell
    "S607",    # partial executable path: buf and gh resolve from PATH
    "C901",    # complex-structure: the comparison branches over contract shapes
    "PLR0912", # too-many-branches: same, linear classification
    "PLR0915", # too-many-statements: same
    "PLR2004", # magic-value-comparison: inline constants read fine here
    # urlopen: the rule only clears for a literal https URL, and every page URL
    # here arrives from a fetched sitemap. fetch_text refuses any scheme but
    # https before it opens anything, which is the check the rule asks for.
    "S310",
]

[tool.ruff.lint.per-file-ignores]
# run_self_test IS the test suite: its assertions are the checks, and the
# gate runs it with plain python3 so they are live. The function refuses to
# run under -O rather than leaving that invariant to a comment.
"src/techdocs_proof/proof.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["techdocs_proof"]
